
# azure-pipelines.yml
trigger:
- main
pool:
  name: 'ubuntu2204-qa'
jobs:
- job: RunRobotTests
  displayName: 'Run Robot Framework Tests'
  steps:
  - checkout: self
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.10.18'
      addToPath: true
  - task: UseNode@1
    inputs:
      version: '20.x'
    displayName: 'Use Node.js 20'
    
  - script: |
      python -m pip install --upgrade pip
      pip install robotframework
      pip install robotframework-seleniumlibrary
      pip install robotframework-browser
      rfbrowser init
    displayName: 'Install Python Dependencies'
  - script: |
      echo "Listing files in working directory:"
      ls -R $(System.DefaultWorkingDirectory)
    displayName: 'List all files for debugging'
  - script: |
      echo "Running Robot Framework Tests"
      mkdir -p $(System.DefaultWorkingDirectory)/Results
      robot --outputdir $(System.DefaultWorkingDirectory)/Results $(System.DefaultWorkingDirectory)/Tests/Homepage.robot
    displayName: 'Execute Robot Framework Tests'
    continueOnError: true
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Robot Framework Results'
    inputs:
      PathtoPublish: '$(System.DefaultWorkingDirectory)/Results'
      ArtifactName: 'RobotFrameworkReports'
      publishLocation: 'Container'
    condition: succeededOrFailed()
