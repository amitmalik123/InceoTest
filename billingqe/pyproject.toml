[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "billing-qe-automation"
version = "1.0.0"
description = "A Playwright-based Python BDD automation framework for Billing QE using pytest-bdd and Page Object Model."
requires-python = ">=3.10"
dependencies = [
    # Browser automation
    "playwright>=1.42.0",
    "pytest-playwright==0.4.4",

    # Core testing framework
    "pytest>=8.0.0,<10.0.0",
    "pytest-bdd>=8.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-html>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-rerunfailures>=12.0",

    # BDD support
    "gherkin-official>=27.0.0",

    # Reporting
    "allure-pytest>=2.13.0",

    # Configuration
    "pyyaml>=6.0",

    # Database (optional)
    "pyodbc>=5.0.0",

    # HTTP Requests (optional)
    "requests>=2.31.0",

    # Environment (.env) file support
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
# Only include actual Python packages (directories with __init__.py)
include = ["pages*", "utils*", "tests*", "fixtures*"]
# Exclude data/config directories that aren't Python packages
exclude = ["data*", "config*", "queries*", "docs*", "reports*", "scripts*"]

[tool.setuptools.package-data]
# Include non-Python files within packages
"*" = ["*.yaml", "*.json", "*.csv", "*.sql", "*.feature"]

[project.optional-dependencies]
dev = [
    # Code formatting
    "black==24.3.0",
    "autopep8==2.0.4",
    "isort==5.13.2",

    # Linting
    "flake8==7.0.0",
    "flake8-bugbear==24.2.6",
    "pylint>=3.0.0",

    # Type checking
    "mypy==1.9.0",

    # Code coverage
    "pytest-cov==4.1.0",
    "coverage[toml]==7.4.4",

    # Pre-commit hooks
    "pre-commit==3.6.2"
]

[tool.coverage.run]
source = ["pages", "tests", "fixtures"]
omit = [
    "*/tests/*",
    "*/site-packages/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | \.pytest_cache
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "^\\.venv/",
    "^\\.pytest_cache/",
    "^__pycache__/",
]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "W0212",  # protected-access
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-attributes = 10
max-locals = 20
