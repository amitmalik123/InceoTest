[pytest]
# Disable pytest-dashboard plugin to prevent progress.yaml files
# These files clutter the workspace and aren't needed
# HTML report with timestamp is auto-configured in conftest.py
addopts = -p no:pytest-dashboard
    --self-contained-html
    --disable-warnings

# Suppress specific warning categories
filterwarnings =
    ignore::pytest.PytestConfigWarning
    ignore::pytest.PytestCollectionWarning
    ignore::urllib3.exceptions.InsecureRequestWarning
