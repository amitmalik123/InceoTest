###############################################################################
# Azure DevOps Pipeline - Services Matrix Based Execution
###############################################################################
# This pipeline reads configuration from services-matrix.yaml and executes
# tests based on service configurations.
#
# Features:
# - Single or multiple service execution
# - On-demand manual runs
# - Automated PR triggers
# - Automated Push triggers
# - Scheduled runs (cron-based)
# - Multi-environment support (TSADEV, TSATEST, T12, T11, T10)
# - Dynamic job generation based on service matrix
###############################################################################

# PR Trigger - runs when PRs are created/updated
pr:
  branches:
    include:
      - qe_platform

# Push Trigger - runs when code is pushed to branches
trigger:
  branches:
    include:
      - qe_platform

# Scheduled Triggers - Each schedule targets a specific service
# The pipeline matches the build start time (UTC) against these cron schedules
# to determine which service to run. Ensure each service has a unique time.
# Format: cron times are in UTC
schedules:
  - cron: "25 19 * * *"      # 19:00 UTC -> parties
    displayName: 'Parties API - Daily Test'
    branches:
      include:
        - qe_platform
    always: true
  
  - cron: "0 6 * * *"       # 06:00 UTC -> work_item_notification
    displayName: 'Work Item Notification - Daily Test'
    branches:
      include:
        - qe_platform
    always: true
  
  - cron: "15 7 * * *"      # 07:15 UTC -> movemoney
    displayName: 'Move Money API - Daily Test'
    branches:
      include:
        - qe_platform
    always: true
  
  - cron: "0 7 * * *"       # 07:00 UTC -> models
    displayName: 'Models API - Daily Test'
    branches:
      include:
        - qe_platform
    always: true

###############################################################################
# Pipeline Parameters - For Manual Execution
###############################################################################
parameters:
  - name: executionMode
    displayName: 'Execution Mode'
    type: string
    default: 'auto'
    values:
      - auto      # Automatic based on trigger (PR/Push/Schedule)
      - manual    # Manual selection of services
  
  - name: services
    displayName: 'Services to Run (comma-separated, or "all" for all enabled)'
    type: string
    default: 'all'
  
  - name: environments
    displayName: 'Environments (comma-separated, or "all" for service defaults)'
    type: string
    default: 'all'
  
  - name: testType
    displayName: 'Test Type'
    type: string
    default: 'functional'
    values:
      - functional
      - non-functional
      - both
  
  - name: overrideEnabled
    displayName: 'Override Enabled Flag (run disabled services too)'
    type: boolean
    default: false
  
  - name: customFunctionalArgs
    displayName: 'Custom Functional Test Args (optional - overrides services-matrix)'
    type: string
    default: 'N/A'
  
  - name: customNonFunctionalArgs
    displayName: 'Custom Non-Functional Test Args (optional - overrides services-matrix)'
    type: string
    default: 'N/A'

###############################################################################
# Global Variables
###############################################################################
variables:
  # Shared configuration (auth tokens, common settings)
  - group: 'qa-pipelines-shared-config'
  
  # Single variable group containing ALL environment-prefixed URLs
  # This eliminates variable overwriting issues when loading multiple groups
  # 
  # Required variables in this group:
  #   TSADEV_parties_base_url, TSATEST_parties_base_url, TSASILO_parties_base_url
  #   TSADEV_address_base_url, TSATEST_address_base_url, TSASILO_address_base_url
  #   ... (same pattern for all service URLs)
  #
  - group: 'qa-pipelines-config'

  - name: buildPath
    value: '$(Build.SourcesDirectory)/platformqe/core-api-automation'
  - name: matrixConfigPath
    value: 'config/services-matrix.yaml'
  - name: pythonVersion
    value: '3.10'

###############################################################################
# Stages
###############################################################################
stages:
  ###########################################################################
  # Stage 1: Initialization - Parse Matrix and Determine Services to Run
  ###########################################################################
  - stage: Initialize
    displayName: 'Initialize and Parse Service Matrix'
    jobs:
      - job: ParseMatrix
        displayName: 'Parse Services Matrix'
        pool:
          name: ewm20-docker-build-agent-inc-dev
        steps:
          - checkout: self
          
          # - task: UsePythonVersion@0
          #   displayName: 'Set up Python $(pythonVersion)'
          #   inputs:
          #     versionSpec: '$(pythonVersion)'
          #     addToPath: true
          
          - task: Bash@3
            displayName: 'Install PyYAML'
            inputs:
              targetType: inline
              script: |
                pip install pyyaml
          
          - task: Bash@3
            name: DetermineServices
            displayName: 'Determine Services to Run'
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Using manage_matrix.py to determine services"
                echo "=========================================="
                
                # Extract service name from schedule trigger by matching build time to cron schedules
                SCHEDULE_SERVICE=""
                if [ "$(Build.Reason)" = "Schedule" ]; then
                  # Get current UTC time
                  CURRENT_HOUR=$(date -u +%H)
                  CURRENT_MINUTE=$(date -u +%M)
                  
                  echo "Schedule triggered at UTC: ${CURRENT_HOUR}:${CURRENT_MINUTE}"
                  
                  # Map cron times to service names (hour:minute -> service)
                  # Format: "HH:MM" where HH is 00-23, MM is 00-59
                  case "${CURRENT_HOUR}:${CURRENT_MINUTE}" in
                    "19:25")
                      SCHEDULE_SERVICE="parties"
                      ;;
                    "6:0"|"06:00")
                      SCHEDULE_SERVICE="work_item_notification"
                      ;;
                    "7:15")
                      SCHEDULE_SERVICE="movemoney"
                      ;;
                    "7:0"|"07:00")
                      SCHEDULE_SERVICE="models"
                      ;;
                    *)
                      echo "WARNING: No service found for time ${CURRENT_HOUR}:${CURRENT_MINUTE}"
                      echo "Checking with minute tolerance (within 5 minutes)..."
                      # Allow 5-minute window for schedule matching
                      CURRENT_TIME_MIN=$((10#$CURRENT_HOUR * 60 + 10#$CURRENT_MINUTE))
                      
                      # parties: 19:25 (1165 min)
                      if [ $CURRENT_TIME_MIN -ge 1163 ] && [ $CURRENT_TIME_MIN -le 1167 ]; then
                        SCHEDULE_SERVICE="parties"
                      # work_item_notification: 06:00 (360 min)
                      elif [ $CURRENT_TIME_MIN -ge 358 ] && [ $CURRENT_TIME_MIN -le 362 ]; then
                        SCHEDULE_SERVICE="work_item_notification"
                      # movemoney: 07:15 (435 min)
                      elif [ $CURRENT_TIME_MIN -ge 433 ] && [ $CURRENT_TIME_MIN -le 437 ]; then
                        SCHEDULE_SERVICE="movemoney"
                      # models: 07:00 (420 min)
                      elif [ $CURRENT_TIME_MIN -ge 418 ] && [ $CURRENT_TIME_MIN -le 422 ]; then
                        SCHEDULE_SERVICE="models"
                      fi
                      ;;
                  esac
                  
                  if [ -n "$SCHEDULE_SERVICE" ]; then
                    echo "Matched schedule to service: $SCHEDULE_SERVICE"
                  else
                    echo "ERROR: Could not determine service for scheduled run"
                    echo "Please check azure-pipelines-matrix.yml schedule times match this script"
                  fi
                fi
                
                # Override services parameter if schedule triggered
                SERVICES_PARAM="${{ parameters.services }}"
                if [ "$(Build.Reason)" = "Schedule" ] && [ -n "$SCHEDULE_SERVICE" ]; then
                  SERVICES_PARAM="$SCHEDULE_SERVICE"
                  echo "Using schedule-specified service: $SERVICES_PARAM"
                fi
                
                # Set environments parameter (use "all" if empty)
                ENVIRONMENTS_PARAM="${{ parameters.environments }}"
                if [ -z "$ENVIRONMENTS_PARAM" ]; then
                  ENVIRONMENTS_PARAM="all"
                fi
                
                # Store custom args in variables to handle quotes and special characters safely
                CUSTOM_FUNC_ARGS='${{ parameters.customFunctionalArgs }}'
                CUSTOM_NONFUNC_ARGS='${{ parameters.customNonFunctionalArgs }}'
                
                # Run the manage_matrix.py script with pipeline parameters
                # Build arguments array to avoid eval and handle empty parameters safely
                set -- "scripts/manage_matrix.py" "generate-pipeline-matrix" \
                  "--execution-mode" "${{ parameters.executionMode }}" \
                  "--services" "$SERVICES_PARAM" \
                  "--environments" "$ENVIRONMENTS_PARAM" \
                  "--test-type" "${{ parameters.testType }}" \
                  "--trigger-reason" "$(Build.Reason)"
                
                # Add optional arguments only if they have values
                if [ "${{ parameters.overrideEnabled }}" = "True" ]; then
                  set -- "$@" "--override-enabled"
                fi
                
                # Debug: Show parameter values before adding to command
                echo "DEBUG: customFunctionalArgs = '$CUSTOM_FUNC_ARGS'"
                echo "DEBUG: customNonFunctionalArgs = '$CUSTOM_NONFUNC_ARGS'"
                
                if [ -n "$CUSTOM_FUNC_ARGS" ]; then
                  if [ "$CUSTOM_FUNC_ARGS" != "N/A" ]; then
                    echo "DEBUG: Adding custom functional args to command"
                    set -- "$@" "--custom-functional-args" "$CUSTOM_FUNC_ARGS"
                  else
                    echo "DEBUG: Skipping custom functional args (value is N/A)"
                  fi
                else
                  echo "DEBUG: Skipping custom functional args (value is empty)"
                fi
                
                if [ -n "$CUSTOM_NONFUNC_ARGS" ]; then
                  if [ "$CUSTOM_NONFUNC_ARGS" != "N/A" ]; then
                    echo "DEBUG: Adding custom non-functional args to command"
                    set -- "$@" "--custom-nonfunctional-args" "$CUSTOM_NONFUNC_ARGS"
                  else
                    echo "DEBUG: Skipping custom non-functional args (value is N/A)"
                  fi
                else
                  echo "DEBUG: Skipping custom non-functional args (value is empty)"
                fi
                
                # Debug: Show complete command that will be executed
                echo "DEBUG: Full command: python3 $@"
                
                # Execute the command
                python3 "$@" > matrix_output.log 2>&1
                
                exit_code=$?
                
                # Display the output
                cat matrix_output.log
                
                echo ""
                echo "Script completed with exit code: $exit_code"
                
                # Verify the output variables were set correctly
                echo ""
                echo "=========================================="
                echo "Verifying Matrix Output"
                echo "=========================================="
                
                # Check if the vso commands are present
                if grep -q "##vso\[task.setvariable variable=servicesMatrix" matrix_output.log; then
                  echo "✅ servicesMatrix variable command found"
                  
                  # Extract just the JSON part for validation
                  matrix_json=$(grep "##vso\[task.setvariable variable=servicesMatrix" matrix_output.log | sed 's/.*isOutput=true\]//')
                  
                  # Check if it's valid JSON (basic check)
                  if echo "$matrix_json" | python3 -m json.tool > /dev/null 2>&1; then
                    echo "✅ Matrix JSON is valid"
                    echo "Matrix keys count: $(echo "$matrix_json" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
                  else
                    echo "❌ ERROR: Matrix JSON is INVALID!"
                    echo "This will cause Azure DevOps to not parse the matrix"
                  fi
                else
                  echo "❌ ERROR: No servicesMatrix variable command found in output!"
                fi
                
                echo "=========================================="
                
                exit $exit_code
              workingDirectory: $(buildPath)

  ###########################################################################
  # Stage 2: Execute Tests - Dynamic Jobs Based on Service Matrix
  ###########################################################################
  - stage: ExecuteTests
    displayName: 'Execute Service Tests'
    dependsOn: Initialize
    condition: and(succeeded(), eq(dependencies.Initialize.outputs['ParseMatrix.DetermineServices.hasServices'], 'true'))
    jobs:
      - job: RunTests
        displayName: 'Run Tests'
        pool:
          name: ewm20-docker-build-agent-inc-dev
        strategy:
          maxParallel: 5
          matrix: $[ stageDependencies.Initialize.ParseMatrix.outputs['DetermineServices.servicesMatrix'] ]
                
        steps:
          - checkout: self
          
          - task: Bash@3
            displayName: 'Debug Matrix Variables'
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "DEBUG: Matrix Variable Injection Test"
                echo "=========================================="
                echo "Raw matrix variables from strategy:"
                echo "  name = '$(name)'"
                echo "  displayName = '$(displayName)'"
                echo "  environment = '$(environment)'"
                echo "  testType = '$(testType)'"
                echo "  priority = '$(priority)'"
                echo "  reason = '$(reason)'"
                echo "  functionalTestArgs = '$(functionalTestArgs)'"
                echo ""
                if [ -z "$(name)" ]; then
                  echo "❌ ERROR: Matrix variables are EMPTY!"
                  echo "   This means the matrix from Initialize stage was not passed correctly"
                  echo "   Check the servicesMatrix output variable format"
                else
                  echo "✅ Matrix variables are populated correctly"
                fi
                echo "=========================================="
          
          # Fetch database connection strings from Azure Key Vault
          # Using separate tasks for each environment since azureSubscription requires literal service connection name
          
          # TSADEV Environment Key Vault (also runs for 'all' as default)
          - task: AzureKeyVault@2
            displayName: 'Fetch secrets from Key Vault (TSADEV)'
            condition: or(eq(variables['environment'], 'TSADEV'), eq(variables['environment'], 'all'))
            inputs:
              azureSubscription: $(subscription_dev)
              KeyVaultName: 'amkkvqapipeline-devncus'
              SecretsFilter: 'parties-sqldb-connection-string,movemoney-sqldb-connection-string,hne-db-connection-string,securitieshub-db-connection-string,modelhub-db-connection-string'
              RunAsPreJob: false
          
          # TSATEST Environment Key Vault
          - task: AzureKeyVault@2
            displayName: 'Fetch secrets from Key Vault (TSATEST)'
            condition: eq(variables['environment'], 'TSATEST')
            inputs:
              azureSubscription: $(subscription_test)
              KeyVaultName: 'amkkvqapipeline-testncus'
              SecretsFilter: 'parties-sqldb-connection-string,movemoney-sqldb-connection-string,hne-db-connection-string,securitieshub-db-connection-string,modelhub-db-connection-string'
              RunAsPreJob: false
          
          # TSASILO Environment Key Vault
          - task: AzureKeyVault@2
            displayName: 'Fetch secrets from Key Vault (TSASILO)'
            condition: eq(variables['environment'], 'TSASILO')
            inputs:
              azureSubscription: $(subscription_silo)
              KeyVaultName: 'amkkvqapipeline-siloncus'
              SecretsFilter: 'parties-sqldb-connection-string,movemoney-sqldb-connection-string,hne-db-connection-string,securitieshub-db-connection-string,modelhub-db-connection-string'
              RunAsPreJob: false
          
          # Resolve environment-specific variables based on matrix environment selection
          # This handles: single env (TSADEV/TSATEST/TSASILO), 'all' (default to TSADEV), or multiple envs
          - task: Bash@3
            name: ResolveEnvVars
            displayName: 'Resolve Environment Variables'
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Resolving Environment-Specific Variables"
                echo "=========================================="
                echo "Selected Environment: $(environment)"
                
                # Determine which environment to use
                # For 'all', default to TSADEV; otherwise use the specified environment
                SELECTED_ENV="$(environment)"
                if [ "$SELECTED_ENV" = "all" ]; then
                  SELECTED_ENV="TSADEV"
                  echo "Environment 'all' selected, defaulting to: $SELECTED_ENV"
                fi
                
                echo "Using environment: $SELECTED_ENV"
                
                # Map environment-prefixed variables to standard variable names
                # These should be defined in your variable groups with prefixes:
                # e.g., TSADEV_parties_base_url, TSATEST_parties_base_url, TSASILO_parties_base_url
                
                case "$SELECTED_ENV" in
                  "TSADEV")
                    echo "##vso[task.setvariable variable=RESOLVED_PARTIES_BASE_URL]$(TSADEV_parties_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ADDRESS_BASE_URL]$(TSADEV_address_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ANALYTICS_BASE_URL]$(TSADEV_analytics_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_HNE_BASE_URL]$(TSADEV_hne_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_MODELS_BASE_URL]$(TSADEV_models_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_MOVEMONEY_BASE_URL]$(TSADEV_movemoney_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_SECURITIES_BASE_URL]$(TSADEV_securities_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_WORK_ITEM_NOTIFICATION_BASE_URL]$(TSADEV_work_item_notification_base_url)"
                    ;;
                  "TSATEST")
                    echo "##vso[task.setvariable variable=RESOLVED_PARTIES_BASE_URL]$(TSATEST_parties_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ADDRESS_BASE_URL]$(TSATEST_address_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ANALYTICS_BASE_URL]$(TSATEST_analytics_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_HNE_BASE_URL]$(TSATEST_hne_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_MODELS_BASE_URL]$(TSATEST_models_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_MOVEMONEY_BASE_URL]$(TSATEST_movemoney_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_SECURITIES_BASE_URL]$(TSATEST_securities_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_WORK_ITEM_NOTIFICATION_BASE_URL]$(TSATEST_work_item_notification_base_url)"
                    ;;
                  "TSASILO")
                    echo "##vso[task.setvariable variable=RESOLVED_PARTIES_BASE_URL]$(TSASILO_parties_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ADDRESS_BASE_URL]$(TSASILO_address_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ANALYTICS_BASE_URL]$(TSASILO_analytics_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_HNE_BASE_URL]$(TSASILO_hne_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_MODELS_BASE_URL]$(TSASILO_models_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_MOVEMONEY_BASE_URL]$(TSASILO_movemoney_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_SECURITIES_BASE_URL]$(TSASILO_securities_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_WORK_ITEM_NOTIFICATION_BASE_URL]$(TSASILO_work_item_notification_base_url)"
                    ;;
                  *)
                    echo "❌ ERROR: Unknown environment: $SELECTED_ENV"
                    echo "Defaulting to TSADEV variables"
                    echo "##vso[task.setvariable variable=RESOLVED_PARTIES_BASE_URL]$(TSADEV_parties_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ADDRESS_BASE_URL]$(TSADEV_address_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ANALYTICS_BASE_URL]$(TSADEV_analytics_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_HNE_BASE_URL]$(TSADEV_hne_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_MODELS_BASE_URL]$(TSADEV_models_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_MOVEMONEY_BASE_URL]$(TSADEV_movemoney_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_SECURITIES_BASE_URL]$(TSADEV_securities_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_WORK_ITEM_NOTIFICATION_BASE_URL]$(TSADEV_work_item_notification_base_url)"
                    ;;
                esac
                
                echo "✅ Environment variables resolved for: $SELECTED_ENV"
                echo "=========================================="
          
          # Debug: Show resolved URLs to verify correct environment selection
          - task: Bash@3
            displayName: 'Debug Resolved Environment URLs'
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Resolved Environment URLs"
                echo "=========================================="
                echo "Environment: $(environment)"
                echo ""
                echo "RESOLVED_PARTIES_BASE_URL: $(RESOLVED_PARTIES_BASE_URL)"
                echo "RESOLVED_ADDRESS_BASE_URL: $(RESOLVED_ADDRESS_BASE_URL)"
                echo "RESOLVED_ANALYTICS_BASE_URL: $(RESOLVED_ANALYTICS_BASE_URL)"
                echo "RESOLVED_HNE_BASE_URL: $(RESOLVED_HNE_BASE_URL)"
                echo "RESOLVED_MODELS_BASE_URL: $(RESOLVED_MODELS_BASE_URL)"
                echo "RESOLVED_MOVEMONEY_BASE_URL: $(RESOLVED_MOVEMONEY_BASE_URL)"
                echo "RESOLVED_SECURITIES_BASE_URL: $(RESOLVED_SECURITIES_BASE_URL)"
                echo "RESOLVED_WORK_ITEM_NOTIFICATION_BASE_URL: $(RESOLVED_WORK_ITEM_NOTIFICATION_BASE_URL)"
                echo "=========================================="
          
          # - task: UsePythonVersion@0
          #   displayName: 'Set up Python $(pythonVersion)'
          #   inputs:
          #     versionSpec: '$(pythonVersion)'
          #     addToPath: true
          
          - task: Bash@3
            displayName: 'Environment Info'
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Service: $(name)"
                echo "Display Name: $(displayName)"
                echo "Environment: $(environment)"
                echo "Test Type: $(testType)"
                echo "Priority: $(priority)"
                echo "Reason: $(reason)"
                echo "Functional Args: $(functionalTestArgs)"
                echo "Non-Functional Args: $(nonFunctionalTestArgs)"
                echo "=========================================="
                echo ""
                echo "Checking condition for functional tests:"
                echo "testType value: '$(testType)'"
                if [ "$(testType)" = "functional" ] || [ "$(testType)" = "both" ]; then
                  echo "✅ Condition PASSED - Functional tests will run"
                else
                  echo "❌ Condition FAILED - Functional tests will be SKIPPED"
                  echo "   testType is neither 'functional' nor 'both'"
                fi
                echo "=========================================="
          
          - task: CmdLine@2
            displayName: 'Install Python Dependencies'
            inputs:
              script: |
                find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
                find . -type f -name "*.pyc" -delete 2>/dev/null || true
                python -m pip install --upgrade pip
                pip install -r requirements.txt
              workingDirectory: $(buildPath)
          
          - task: Bash@3
            displayName: 'Pre-Test Validation'
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "VALIDATING TEST EXECUTION CONDITIONS"
                echo "=========================================="
                echo "Service: $(name)"
                echo "Environment: $(environment)"
                echo "Test Type Variable: '$(testType)'"
                echo ""
                echo "Checking functional test condition..."
                if [ "$(testType)" = "functional" ]; then
                  echo "✅ Will run FUNCTIONAL tests only"
                elif [ "$(testType)" = "both" ]; then
                  echo "✅ Will run BOTH functional and non-functional tests"
                elif [ "$(testType)" = "non-functional" ]; then
                  echo "⚠️ Will run NON-FUNCTIONAL tests only (functional tests skipped)"
                else
                  echo "❌ ERROR: testType='$(testType)' is not recognized!"
                fi
                echo "=========================================="
          
          - task: Bash@3
            displayName: 'Run Functional Tests - $(name)'
            condition: and(succeeded(), or(eq(variables['testType'], 'functional'), eq(variables['testType'], 'both')))
            env:
              LOG_LEVEL: $(log_level)
              WORK_ITEM_AUTH_TOKEN: $(WORK_ITEM_AUTH_TOKEN)
              PARTIES_AUTH_TOKEN: $(PARTIES_AUTH_TOKEN)
              # Use resolved environment-specific base URLs
              PARTIES_BASE_URL: $(RESOLVED_PARTIES_BASE_URL)
              PARTIES_SQLDB: $(parties-sqldb-connection-string)
              MOVEMONEY_SQLDB: $(movemoney-sqldb-connection-string)
              HNE_DB: $(hne-db-connection-string)
              SECURITIESHUB_DB: $(securitieshub-db-connection-string)
              MODELHUB_DB: $(modelhub-db-connection-string)
              AZURE_SQL_PASSWORD: $(AZURE_SQL_PASSWORD)
              POSTGRES_DB_PASSWORD: $(POSTGRES_DB_PASSWORD)
              ADDRESS_BASE_URL: $(RESOLVED_ADDRESS_BASE_URL)
              ANALYTICS_BASE_URL: $(RESOLVED_ANALYTICS_BASE_URL)
              HNE_BASE_URL: $(RESOLVED_HNE_BASE_URL)
              MODELS_BASE_URL: $(RESOLVED_MODELS_BASE_URL)
              MOVEMONEY_BASE_URL: $(RESOLVED_MOVEMONEY_BASE_URL)
              SECURITIES_BASE_URL: $(RESOLVED_SECURITIES_BASE_URL)
              WORK_ITEM_NOTIFICATION_BASE_URL: $(RESOLVED_WORK_ITEM_NOTIFICATION_BASE_URL)
              API_TIMEOUT: $(api_timeout)
              API_RETRY_COUNT: $(api_retry_count)
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Running Functional Tests"
                echo "Service: $(name)"
                echo "Environment: $(environment)"
                echo "=========================================="
                
                echo "Test Arguments: $(functionalTestArgs)"
                
                pytest -sv tests/test_api_generic.py $(functionalTestArgs)
                TEST_EXIT_CODE=$?
                echo "##vso[task.setvariable variable=TEST_EXIT_CODE]$TEST_EXIT_CODE"
                exit $TEST_EXIT_CODE
              workingDirectory: $(buildPath)
          
          - task: Bash@3
            displayName: 'Locate Reports Folder'
            condition: succeededOrFailed()
            inputs:
              targetType: inline
              script: |
                latest=$(ls -td reports/[0-9]*/ 2>/dev/null | head -1 || echo "reports/")
                echo "##vso[task.setvariable variable=REPORTS_PATH]$latest"
                echo "Reports location: $latest"
              workingDirectory: $(buildPath)
          
          - task: Bash@3
            displayName: 'Run Non-Functional Tests - $(name)'
            condition: and(succeededOrFailed(), or(eq(variables['testType'], 'non-functional'), eq(variables['testType'], 'both')))
            env:
              LOG_LEVEL: $(log_level)
              WORK_ITEM_AUTH_TOKEN: $(WORK_ITEM_AUTH_TOKEN)
              PARTIES_AUTH_TOKEN: $(PARTIES_AUTH_TOKEN)
              # Use resolved environment-specific base URLs
              PARTIES_BASE_URL: $(RESOLVED_PARTIES_BASE_URL)
              PARTIES_SQLDB: $(parties-sqldb-connection-string)
              MOVEMONEY_SQLDB: $(movemoney-sqldb-connection-string)
              HNE_DB: $(hne-db-connection-string)
              SECURITIESHUB_DB: $(securitieshub-db-connection-string)
              MODELHUB_DB: $(modelhub-db-connection-string)
              AZURE_SQL_PASSWORD: $(AZURE_SQL_PASSWORD)
              POSTGRES_DB_PASSWORD: $(POSTGRES_DB_PASSWORD)
              ADDRESS_BASE_URL: $(RESOLVED_ADDRESS_BASE_URL)
              ANALYTICS_BASE_URL: $(RESOLVED_ANALYTICS_BASE_URL)
              HNE_BASE_URL: $(RESOLVED_HNE_BASE_URL)
              MODELS_BASE_URL: $(RESOLVED_MODELS_BASE_URL)
              MOVEMONEY_BASE_URL: $(RESOLVED_MOVEMONEY_BASE_URL)
              SECURITIES_BASE_URL: $(RESOLVED_SECURITIES_BASE_URL)
              WORK_ITEM_NOTIFICATION_BASE_URL: $(RESOLVED_WORK_ITEM_NOTIFICATION_BASE_URL)
              API_TIMEOUT: $(api_timeout)
              API_RETRY_COUNT: $(api_retry_count)
              INFLUX_URL: $(influx_url)
              INFLUX_TOKEN: $(influx_token)
              INFLUX_ORG: $(influx_org)
              INFLUX_BUCKET: $(influx_bucket)
              INFLUX_TIMEOUT: $(influx_timeout)
              INFLUX_ENABLE: $(influx_enable)
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Running Non-Functional Tests"
                echo "Service: $(name)"
                echo "Environment: $(environment)"
                echo "=========================================="
                
                # Use existing report directory from functional tests
                latest=$(ls -td reports/[0-9]*/ 2>/dev/null | head -1)
                if [ -n "$latest" ]; then
                  report_dir="${latest%/}"
                  echo "Using existing report directory: $report_dir"
                else
                  timestamp=$(date +%Y%m%d_%H%M%S)
                  report_dir="reports/${timestamp}"
                  mkdir -p "$report_dir"
                  echo "Created new report directory: $report_dir"
                fi
                
                echo "Locust Arguments: $(nonFunctionalTestArgs)"
                
                locust -f locustfile.py $(nonFunctionalTestArgs) \
                  --html="${report_dir}/performance_report.html" \
                  --csv="${report_dir}/performance_report"
                
                LOCUST_EXIT_CODE=$?
                echo "##vso[task.setvariable variable=LOCUST_EXIT_CODE]$LOCUST_EXIT_CODE"
                exit $LOCUST_EXIT_CODE
              workingDirectory: $(buildPath)
          
          - task: PublishTestResults@2
            displayName: 'Publish Test Results - $(name)'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/junit_report*.xml'
              searchFolder: '$(buildPath)/$(REPORTS_PATH)'
              mergeTestResults: true
              failTaskOnFailedTests: false
              testRunTitle: '$(displayName) - $(environment) - $(Build.BuildNumber)'
          
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Test Reports - $(name)'
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: '$(buildPath)/reports'
              ArtifactName: 'test-reports-$(name)-$(environment)-$(Build.BuildNumber)'
              publishLocation: 'Container'
          
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Framework Logs - $(name)'
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: '$(buildPath)/framework/logs'
              ArtifactName: 'framework-logs-$(name)-$(environment)-$(Build.BuildNumber)'
              publishLocation: 'Container'
          
          - task: Bash@3
            displayName: 'Send Email Report - $(name)'
            condition: and(succeededOrFailed(), or(eq(variables['email_feature_enabled'], 'true'), eq(variables['email_feature_enabled'], 'True')))
            env:
              SMTP_SERVER: $(smtp_server)
              SMTP_PORT: $(smtp_port)
              EMAIL_FROM: $(email_from)
              EMAIL_TO: $(email_to)
              EMAIL_CC: $(email_cc)
              EMAIL_BCC: $(email_bcc)
              EMAIL_SUBJECT_PREFIX: $(email_subject_prefix)
            inputs:
              targetType: inline
              script: |
                export PYTHONPATH="${PYTHONPATH}:$(pwd)"
                python3 framework/reporter/email_reporter.py \
                  --build-number "$(Build.BuildNumber)" \
                  --job-status "$(Agent.JobStatus)" \
                  --reports-path "$(REPORTS_PATH)" \
                  --build-id "$(Build.BuildId)" \
                  --team-project "$(System.TeamProject)" \
                  --collection-uri "$(System.TeamFoundationCollectionUri)" \
                  --service-name "$(name)"
              workingDirectory: $(buildPath)
          
          - task: Bash@3
            displayName: 'Verify Test Results - $(name)'
            condition: always()
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Final Test Results - $(name)"
                echo "=========================================="
                failed=false
                
                # Check functional test results
                if [ "$(testType)" = "functional" ] || [ "$(testType)" = "both" ]; then
                  if [ -z "$(TEST_EXIT_CODE)" ]; then
                    echo "⚠️ Functional Tests were SKIPPED or not executed"
                    failed=true
                  elif [ "$(TEST_EXIT_CODE)" != "0" ]; then
                    echo "❌ Functional Tests Failed (Exit Code: $(TEST_EXIT_CODE))"
                    failed=true
                  else
                    echo "✅ Functional Tests Passed"
                  fi
                fi
                
                # Check non-functional test results
                if [ "$(testType)" = "non-functional" ] || [ "$(testType)" = "both" ]; then
                  if [ -z "$(LOCUST_EXIT_CODE)" ]; then
                    echo "⚠️ Non-Functional Tests were SKIPPED or not executed"
                    failed=true
                  elif [ "$(LOCUST_EXIT_CODE)" != "0" ]; then
                    echo "❌ Non-Functional Tests Failed (Exit Code: $(LOCUST_EXIT_CODE))"
                    failed=true
                  else
                    echo "✅ Non-Functional Tests Passed"
                  fi
                fi
                
                if [ "$failed" = "true" ]; then
                  echo "##vso[task.complete result=Failed;]Tests failed or were skipped for $(name)"
                  exit 1
                else
                  echo "✅ All tests passed for $(name)"
                fi

  ###########################################################################
  # Stage 3: Summary and Reporting
  ###########################################################################
  - stage: Summary
    displayName: 'Test Execution Summary'
    dependsOn:
      - Initialize
      - ExecuteTests
    condition: always()
    jobs:
      - job: GenerateSummary
        displayName: 'Generate Execution Summary'
        pool:
          name: ewm20-docker-build-agent-inc-dev
        variables:
          initializeResult: $[ stageDependencies.Initialize.ParseMatrix.result ]
          executeTestsResult: $[ stageDependencies.ExecuteTests.RunTests.result ]
        steps:
          - checkout: self
          
          - task: Bash@3
            displayName: 'Display Summary'
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Pipeline Execution Summary"
                echo "=========================================="
                echo "Build Number: $(Build.BuildNumber)"
                echo "Build Reason: $(Build.Reason)"
                echo "Source Branch: $(Build.SourceBranch)"
                echo "Trigger: $(Build.Reason)"
                echo "=========================================="
                echo ""
                echo "Stage Results:"
                echo "  Initialize: $(initializeResult)"
                echo "  ExecuteTests: $(executeTestsResult)"
                echo "=========================================="
                echo ""
                echo "Check the published test results and artifacts for detailed reports."
                echo ""
                
                # Fail the summary if ExecuteTests failed or was skipped
                if [ "$(executeTestsResult)" = "Failed" ]; then
                  echo "❌ Pipeline FAILED - Tests failed"
                  echo "##vso[task.complete result=Failed;]Test execution failed"
                  exit 1
                elif [ "$(executeTestsResult)" = "Skipped" ]; then
                  echo "⚠️ Pipeline SKIPPED - Tests were not executed"
                  echo "##vso[task.complete result=Failed;]Test execution was skipped"
                  exit 1
                elif [ "$(executeTestsResult)" = "Canceled" ]; then
                  echo "⚠️ Pipeline CANCELED"
                  echo "##vso[task.complete result=Canceled;]Test execution was canceled"
                  exit 1
                else
                  echo "✅ Pipeline execution completed successfully"
                fi
