                    echo "Defaulting to TSADEV variables"
                    echo "##vso[task.setvariable variable=RESOLVED_PARTIES_BASE_URL]$(TSADEV_parties_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ADDRESS_BASE_URL]$(TSADEV_address_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ANALYTICS_BASE_URL]$(TSADEV_analytics_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_HNE_BASE_URL]$(TSADEV_hne_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_MODELS_BASE_URL]$(TSADEV_models_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_MOVEMONEY_BASE_URL]$(TSADEV_movemoney_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ACCOUNTS_BASE_URL]$(TSADEV_accounts_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_SECURITIES_BASE_URL]$(TSADEV_securities_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_WORK_ITEM_NOTIFICATION_BASE_URL]$(TSADEV_work_item_notification_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_STRATEGIES_BASE_URL]$(TSADEV_strategies_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_WRAPTOKEN_BASE_URL]$(TSADEV_wraptoken_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ACCOUNTDISTRIBUTIONS_BASE_URL]$(TSADEV_accountdistributions_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_LEXISNEXIS_BASE_URL]$(TSADEV_lexisnexis_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_DOCUSIGN_BASE_URL]$(T10_docusign_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_TRANSFER_SERVICE_VALIDATION_BASE_URL]$(T11_transfer_service_validation_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_CUSTODIAL_INTEGRATION_BASE_URL]$(TSADEV_custodial_integration_base_url)"
                    ;;
                esac
                
                echo "✅ Environment variables resolved for: $SELECTED_ENV"
                echo "=========================================="
          
          - task: Bash@3
            displayName: 'Debug Resolved Environment URLs'
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Resolved Environment URLs"
                echo "=========================================="
                echo "Environment: $(environment)"
                echo ""
                echo "RESOLVED_PARTIES_BASE_URL: $(RESOLVED_PARTIES_BASE_URL)"
                echo "RESOLVED_ADDRESS_BASE_URL: $(RESOLVED_ADDRESS_BASE_URL)"
                echo "RESOLVED_ANALYTICS_BASE_URL: $(RESOLVED_ANALYTICS_BASE_URL)"
                echo "RESOLVED_HNE_BASE_URL: $(RESOLVED_HNE_BASE_URL)"
                echo "RESOLVED_MODELS_BASE_URL: $(RESOLVED_MODELS_BASE_URL)"
                echo "RESOLVED_MOVEMONEY_BASE_URL: $(RESOLVED_MOVEMONEY_BASE_URL)"
                echo "RESOLVED_ACCOUNTS_BASE_URL: $(RESOLVED_ACCOUNTS_BASE_URL)"
                echo "RESOLVED_SECURITIES_BASE_URL: $(RESOLVED_SECURITIES_BASE_URL)"
                echo "RESOLVED_WORK_ITEM_NOTIFICATION_BASE_URL: $(RESOLVED_WORK_ITEM_NOTIFICATION_BASE_URL)"
                echo "RESOLVED_STRATEGIES_BASE_URL: $(RESOLVED_STRATEGIES_BASE_URL)"
                echo "RESOLVED_WRAPTOKEN_BASE_URL: $(RESOLVED_WRAPTOKEN_BASE_URL)"
                echo "RESOLVED_ACCOUNTDISTRIBUTIONS_BASE_URL: $(RESOLVED_ACCOUNTDISTRIBUTIONS_BASE_URL)"
                echo "RESOLVED_LEXISNEXIS_BASE_URL: $(RESOLVED_LEXISNEXIS_BASE_URL)"
                echo "RESOLVED_DOCUSIGN_BASE_URL: $(RESOLVED_DOCUSIGN_BASE_URL)"
                echo "RESOLVED_TRANSFER_SERVICE_VALIDATION_BASE_URL: $(RESOLVED_TRANSFER_SERVICE_VALIDATION_BASE_URL)"
                echo "RESOLVED_CUSTODIAL_INTEGRATION_BASE_URL: $(RESOLVED_CUSTODIAL_INTEGRATION_BASE_URL)"
                echo "=========================================="
          
          - task: Bash@3
            displayName: 'Environment Info'
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Service: $(name)"
                echo "Display Name: $(displayName)"
                echo "Environment: $(environment)"
                echo "Test Type: $(testType)"
                echo "Priority: $(priority)"
                echo "Reason: $(reason)"
                echo "Functional Args: $(functionalTestArgs)"
                echo "Non-Functional Args: $(nonFunctionalTestArgs)"
                echo "=========================================="
                echo ""
                echo "Checking condition for functional tests:"
                echo "testType value: '$(testType)'"
                if [ "$(testType)" = "functional" ] || [ "$(testType)" = "both" ]; then
                  echo "✅ Condition PASSED - Functional tests will run"
                else
                  echo "❌ Condition FAILED - Functional tests will be SKIPPED"
                fi
                echo "=========================================="
          
          - task: CmdLine@2
            displayName: 'Install Python Dependencies'
            inputs:
              script: |
                find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
                find . -type f -name "*.pyc" -delete 2>/dev/null || true
                python -m pip install --upgrade pip
                pip install -r requirements.txt
              workingDirectory: $(buildPath)
          
          - task: Bash@3
            displayName: 'Pre-Test Validation'
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "VALIDATING TEST EXECUTION CONDITIONS"
                echo "=========================================="
                echo "Service: $(name)"
                echo "Environment: $(environment)"
                echo "Test Type Variable: '$(testType)'"
                echo ""
                echo "Checking functional test condition..."
                if [ "$(testType)" = "functional" ]; then
                  echo "✅ Will run FUNCTIONAL tests only"
                elif [ "$(testType)" = "both" ]; then
                  echo "✅ Will run BOTH functional and non-functional tests"
                elif [ "$(testType)" = "non-functional" ]; then
                  echo "⚠️ Will run NON-FUNCTIONAL tests only (functional tests skipped)"
                else
                  echo "❌ ERROR: testType='$(testType)' is not recognized!"
                fi
                echo "=========================================="
          
          - task: Bash@3
            displayName: 'Run Functional Tests - $(name)'
            condition: and(succeeded(), or(eq(variables['testType'], 'functional'), eq(variables['testType'], 'both')))
            env:
              TEST_CASE_FILTER: ${{ parameters.testCaseFilter }}
              LOG_LEVEL: $(log_level)
              WORK_ITEM_AUTH_TOKEN: $(WORK_ITEM_AUTH_TOKEN)
              PARTIES_AUTH_TOKEN: $(PARTIES_AUTH_TOKEN)
              MODELS_X_USER_ID: $(models_x_user_id)
              PARTIES_BASE_URL: $(RESOLVED_PARTIES_BASE_URL)
              PARTIES_SQLDB: $(parties-sqldb-connection-string)
              ACCOUNTS_SQLDB: $(accounts-sqldb-connection-string)
              MOVEMONEY_SQLDB: $(movemoney-sqldb-connection-string)
              HNE_DB: $(hne-db-connection-string)
              SECURITIESHUB_DB: $(securitieshub-db-connection-string)
              MODELHUB_DB: $(modelhub-db-connection-string)
              AM_DB_SQLDB: $(am-db-connection-string)
              PLATFORM_DB_SQLDB: $(platform-db-connection-string)
              AZURE_SQL_PASSWORD: $(AZURE_SQL_PASSWORD)
              POSTGRES_DB_PASSWORD: $(POSTGRES_DB_PASSWORD)
              ADDRESS_BASE_URL: $(RESOLVED_ADDRESS_BASE_URL)
              ACCOUNTS_BASE_URL: $(RESOLVED_ACCOUNTS_BASE_URL)
              ANALYTICS_BASE_URL: $(RESOLVED_ANALYTICS_BASE_URL)
              HNE_BASE_URL: $(RESOLVED_HNE_BASE_URL)
              MODELS_BASE_URL: $(RESOLVED_MODELS_BASE_URL)
              MOVEMONEY_BASE_URL: $(RESOLVED_MOVEMONEY_BASE_URL)
              SECURITIES_BASE_URL: $(RESOLVED_SECURITIES_BASE_URL)
              WORK_ITEM_NOTIFICATION_BASE_URL: $(RESOLVED_WORK_ITEM_NOTIFICATION_BASE_URL)
              STRATEGIES_BASE_URL: $(RESOLVED_STRATEGIES_BASE_URL)
              WRAPTOKEN_BASE_URL: $(RESOLVED_WRAPTOKEN_BASE_URL)
              ACCOUNTDISTRIBUTIONS_BASE_URL: $(RESOLVED_ACCOUNTDISTRIBUTIONS_BASE_URL)
              LEXISNEXIS_BASE_URL: $(RESOLVED_LEXISNEXIS_BASE_URL)
              DOCUSIGN_BASE_URL: $(RESOLVED_DOCUSIGN_BASE_URL)
              TRANSFER_SERVICE_VALIDATION_BASE_URL: $(RESOLVED_TRANSFER_SERVICE_VALIDATION_BASE_URL)
              CUSTODIAL_INTEGRATION_BASE_URL: $(RESOLVED_CUSTODIAL_INTEGRATION_BASE_URL)
              API_TIMEOUT: $(api_timeout)
              API_RETRY_COUNT: $(api_retry_count)
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Running Functional Tests"
                echo "Service: $(name)"
                echo "Environment: $(environment)"
                echo "=========================================="
                echo "Test Arguments: $(functionalTestArgs)"
                
                # Build test case filter argument if specified
                if [ -n "$TEST_CASE_FILTER" ] && [ "$TEST_CASE_FILTER" != "N/A" ]; then
                  echo "Applying test case filter: --test-type $TEST_CASE_FILTER"
                  pytest -sv tests/test_api_generic.py $(functionalTestArgs) --test-type "$TEST_CASE_FILTER"
                else
                  pytest -sv tests/test_api_generic.py $(functionalTestArgs)
                fi
                TEST_EXIT_CODE=$?
                echo "##vso[task.setvariable variable=TEST_EXIT_CODE]$TEST_EXIT_CODE"
                exit $TEST_EXIT_CODE
              workingDirectory: $(buildPath)
          
          - task: Bash@3
            displayName: 'Locate Reports Folder'
            condition: succeededOrFailed()
            inputs:
              targetType: inline
              script: |
                latest=$(ls -td reports/[0-9]*/ 2>/dev/null | head -1 || echo "reports/")
                echo "##vso[task.setvariable variable=REPORTS_PATH]$latest"
                echo "Reports location: $latest"
              workingDirectory: $(buildPath)
          
          - task: Bash@3
            displayName: 'Run Non-Functional Tests - $(name)'
            condition: and(succeededOrFailed(), or(eq(variables['testType'], 'non-functional'), eq(variables['testType'], 'both')))
            env:
              LOG_LEVEL: $(log_level)
              WORK_ITEM_AUTH_TOKEN: $(WORK_ITEM_AUTH_TOKEN)
              PARTIES_AUTH_TOKEN: $(PARTIES_AUTH_TOKEN)
              MODELS_X_USER_ID: $(models_x_user_id)
              PARTIES_BASE_URL: $(RESOLVED_PARTIES_BASE_URL)
              PARTIES_SQLDB: $(parties-sqldb-connection-string)
              ACCOUNTS_SQLDB: $(accounts-sqldb-connection-string)
              MOVEMONEY_SQLDB: $(movemoney-sqldb-connection-string)
              HNE_DB: $(hne-db-connection-string)
              SECURITIESHUB_DB: $(securitieshub-db-connection-string)
              MODELHUB_DB: $(modelhub-db-connection-string)
              AM_DB_SQLDB: $(am-db-connection-string)
              PLATFORM_DB_SQLDB: $(platform-db-connection-string)
              AZURE_SQL_PASSWORD: $(AZURE_SQL_PASSWORD)
              POSTGRES_DB_PASSWORD: $(POSTGRES_DB_PASSWORD)
              ADDRESS_BASE_URL: $(RESOLVED_ADDRESS_BASE_URL)
              ACCOUNTS_BASE_URL: $(RESOLVED_ACCOUNTS_BASE_URL)
              ANALYTICS_BASE_URL: $(RESOLVED_ANALYTICS_BASE_URL)
              HNE_BASE_URL: $(RESOLVED_HNE_BASE_URL)
              MODELS_BASE_URL: $(RESOLVED_MODELS_BASE_URL)
              MOVEMONEY_BASE_URL: $(RESOLVED_MOVEMONEY_BASE_URL)
              SECURITIES_BASE_URL: $(RESOLVED_SECURITIES_BASE_URL)
              WORK_ITEM_NOTIFICATION_BASE_URL: $(RESOLVED_WORK_ITEM_NOTIFICATION_BASE_URL)
              STRATEGIES_BASE_URL: $(RESOLVED_STRATEGIES_BASE_URL)
              WRAPTOKEN_BASE_URL: $(RESOLVED_WRAPTOKEN_BASE_URL)
              ACCOUNTDISTRIBUTIONS_BASE_URL: $(RESOLVED_ACCOUNTDISTRIBUTIONS_BASE_URL)
              LEXISNEXIS_BASE_URL: $(RESOLVED_LEXISNEXIS_BASE_URL)
              DOCUSIGN_BASE_URL: $(RESOLVED_DOCUSIGN_BASE_URL)
              TRANSFER_SERVICE_VALIDATION_BASE_URL: $(RESOLVED_TRANSFER_SERVICE_VALIDATION_BASE_URL)
              CUSTODIAL_INTEGRATION_BASE_URL: $(RESOLVED_CUSTODIAL_INTEGRATION_BASE_URL)
              API_TIMEOUT: $(api_timeout)
              API_RETRY_COUNT: $(api_retry_count)
              INFLUX_URL: $(influx_url)
              INFLUX_TOKEN: $(influx_token)
              INFLUX_ORG: $(influx_org)
              INFLUX_BUCKET: $(influx_bucket)
              INFLUX_TIMEOUT: $(influx_timeout)
              INFLUX_ENABLE: $(influx_enable)
              # Performance SLA threshold (seconds). Sourced from Azure DevOps
              # Library variable group; falls back to '' so locustfile.py uses
              # config.<env>.yaml -> performance.sla_seconds (default 1.0).
              LOCUST_SLA_SECONDS: $(LOCUST_SLA_SECONDS)
              # Per-env Azure subscription IDs sourced from the Library variable
              # group. Used by the executive-summary reporter to build App
              # Insights deep-links (Performance / Failures).
              SUBSCRIPTION_DEV: $(subscription_dev)
              SUBSCRIPTION_TEST: $(subscription_test)
              SUBSCRIPTION_SILO: $(subscription_silo)
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Running Non-Functional Tests"
                echo "Service: $(name)"
                echo "Environment: $(environment)"
                echo "=========================================="
                
                latest=$(ls -td reports/[0-9]*/ 2>/dev/null | head -1)
                if [ -n "$latest" ]; then
                  report_dir="${latest%/}"
                  echo "Using existing report directory: $report_dir"
                else
                  timestamp=$(date +%Y%m%d_%H%M%S)
                  report_dir="reports/${timestamp}"
                  mkdir -p "$report_dir"
                  echo "Created new report directory: $report_dir"
                fi
                echo "##vso[task.setvariable variable=REPORTS_PATH]$report_dir"
                
                echo "Locust Arguments: $(nonFunctionalTestArgs)"
                echo "Performance SLA (seconds): ${LOCUST_SLA_SECONDS:-<unset, will use config default>}"
                echo "App Insights subscriptions (Library group): dev=${SUBSCRIPTION_DEV:-<unset>} test=${SUBSCRIPTION_TEST:-<unset>} silo=${SUBSCRIPTION_SILO:-<unset>}"
                
                locust -f locustfile.py $(nonFunctionalTestArgs) \
                  --html="${report_dir}/performance_report.html" \
                  --csv="${report_dir}/performance_report"
                
                LOCUST_EXIT_CODE=$?
                echo "##vso[task.setvariable variable=LOCUST_EXIT_CODE]$LOCUST_EXIT_CODE"
                exit $LOCUST_EXIT_CODE
              workingDirectory: $(buildPath)
          
          - task: PublishTestResults@2
            displayName: 'Publish Test Results - $(name)'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/junit_report*.xml'
              searchFolder: '$(buildPath)/$(REPORTS_PATH)'
              mergeTestResults: true
              failTaskOnFailedTests: false
              testRunTitle: '$(displayName) - $(environment) - $(Build.BuildNumber)'
          
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Test Reports - $(name)'
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: '$(buildPath)/reports'
              ArtifactName: 'test-reports-$(name)-$(environment)-$(Build.BuildNumber)'
              publishLocation: 'Container'
          
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Framework Logs - $(name)'
            condition: succeededOrFailed()
            inputs:
              PathtoPublish: '$(buildPath)/framework/logs'
              ArtifactName: 'framework-logs-$(name)-$(environment)-$(Build.BuildNumber)'
              publishLocation: 'Container'
          
          - task: Bash@3
            displayName: 'Push to Log Analytics - $(name)_$(environment)'
            condition: and(always(), or(eq(variables['testType'], 'functional'), eq(variables['testType'], 'both')))
            env:
              LOG_ANALYTICS_WORKSPACE_ID: $(logAnalyticsWorkspaceId)
              LOG_ANALYTICS_SHARED_KEY: $(logAnalyticsSharedKey)
              LOG_ANALYTICS_ENABLED: $(logAnalyticsEnabled)
              SERVICE_NAME: $(name)
              ENV_NAME: $(environment)
            inputs:
              targetType: inline
              script: |
                export PYTHONPATH="${PYTHONPATH}:$(pwd)"
                echo "=========================================="
                echo "Pushing Test Results to Log Analytics"
                echo "=========================================="
                echo "Service: $(name)"
                echo "Environment: $(environment)"
                echo "Workspace ID: $(logAnalyticsWorkspaceId)"
                echo "Enabled: ${LOG_ANALYTICS_ENABLED:-true}"
                echo ""
                
                # Push aggregated test metrics to Log Analytics
                python3 framework/reporter/log_analytics_reporter.py
                
                if [ $? -eq 0 ]; then
                  echo "✅ Log Analytics push completed"
                  echo "⏳ Note: Table may take 5-15 minutes to appear in Log Analytics"
                  echo "📊 Table created: TestResults_CL"
                else
                  echo "⚠️ Log Analytics push failed (non-blocking)"
                fi
              workingDirectory: $(buildPath)

          - task: Bash@3
            displayName: 'Push Performance Results to Log Analytics - $(name)_$(environment)'
            condition: and(succeededOrFailed(), or(eq(variables['testType'], 'non-functional'), eq(variables['testType'], 'both')))
            env:
              LOG_ANALYTICS_WORKSPACE_ID: $(logAnalyticsWorkspaceId)
              LOG_ANALYTICS_SHARED_KEY: $(logAnalyticsSharedKey)
              LOG_ANALYTICS_ENABLED: $(logAnalyticsEnabled)
              SERVICE_NAME: $(name)
              ENV_NAME: $(environment)
              BASELINE_REASON: ${{ parameters.baselineReason }}
              APPROVED_BY: $(Build.RequestedFor)
            inputs:
              targetType: inline
              script: |
                export PYTHONPATH="${PYTHONPATH}:$(pwd)"
                echo "=========================================="
                echo "Pushing Performance Results to Log Analytics"
                echo "=========================================="
                echo "Service: $(name)"
                echo "Environment: $(environment)"
                echo "Reports Path: $(REPORTS_PATH)"
                echo "Baseline Promotion: ${{ parameters.promotePerformanceBaseline }}"

                PROMOTE_ARGS=()
                if [ "${{ parameters.promotePerformanceBaseline }}" = "true" ] || [ "${{ parameters.promotePerformanceBaseline }}" = "True" ]; then
                  PROMOTE_ARGS+=(--promote-baseline --baseline-reason "$BASELINE_REASON" --approved-by "$APPROVED_BY")
                fi

                python3 framework/reporter/performance_log_analytics_reporter.py \
                  --reports-path "$(REPORTS_PATH)" \
                  --service-name "$(name)" \
                  --environment "$(environment)" \
                  "${PROMOTE_ARGS[@]}"

                if [ $? -eq 0 ]; then
                  echo "✅ Performance Log Analytics push completed"
                  echo "⏳ Custom tables may take 5-15 minutes to appear after first ingestion"
                  echo "📊 Tables: PerfRun_CL, PerfEndpointSummary_CL, PerfTimeSeries_CL, PerfFailure_CL, PerfBaseline_CL"
                else
                  echo "⚠️ Performance Log Analytics push failed (non-blocking)"
                fi
              workingDirectory: $(buildPath)
          
          - task: Bash@3
            displayName: 'Send Email Report - $(name)_$(environment)'
            # Email is suppressed for non-functional-only runs (perf reports are
            # already published as build artifacts + executive summary HTML).
            condition: >-
              and(
                succeededOrFailed(),
                ne('${{ parameters.testType }}', 'non-functional'),
                or(
                  eq(variables['email_feature_enabled'], 'true'),
                  eq(variables['email_feature_enabled'], 'True')
                )
              )
            env:
              SMTP_SERVER: $(smtp_server)
              SMTP_PORT: $(smtp_port)
              EMAIL_FROM: $(email_from)
              EMAIL_TO: $(email_to)
              EMAIL_CC: $(email_cc)
              EMAIL_BCC: $(email_bcc)
              EMAIL_SUBJECT_PREFIX: $(email_subject_prefix)
              EMAIL_TO_MOVEMONEY: $(email_to_movemoney)
              EMAIL_CC_MOVEMONEY: $(email_cc_movemoney)
              EMAIL_TO_PARTIES: $(email_to_parties)
              EMAIL_CC_PARTIES: $(email_cc_parties)
              EMAIL_TO_ADDRESSSERVICE: $(email_to_addressservice)
              EMAIL_CC_ADDRESSSERVICE: $(email_cc_addressservice)
              EMAIL_TO_WORK_ITEM_NOTIFICATION: $(email_to_work_item_notification)
              EMAIL_CC_WORK_ITEM_NOTIFICATION: $(email_cc_work_item_notification)
              EMAIL_TO_SECURITIES: $(email_to_securities)
              EMAIL_CC_SECURITIES: $(email_cc_securities)
              EMAIL_TO_MODELS: $(email_to_models)
              EMAIL_CC_MODELS: $(email_cc_models)
              EMAIL_TO_ANALYTICS: $(email_to_analytics)
              EMAIL_CC_ANALYTICS: $(email_cc_analytics)
              EMAIL_TO_HNEBASE: $(email_to_hnebase)
              EMAIL_CC_HNEBASE: $(email_cc_hnebase)
              TEST_CASE_FILTER: ${{ parameters.testCaseFilter }}
            inputs:
              targetType: inline
              script: |
                export PYTHONPATH="${PYTHONPATH}:$(pwd)"
                
                # Build email reporter command with optional test case filter
                if [ -n "$TEST_CASE_FILTER" ] && [ "$TEST_CASE_FILTER" != "N/A" ]; then
                  python3 framework/reporter/email_reporter.py \
                    --build-number "$(Build.BuildNumber)" \
                    --job-status "$(Agent.JobStatus)" \
                    --reports-path "$(REPORTS_PATH)" \
                    --build-id "$(Build.BuildId)" \
                    --team-project "$(System.TeamProject)" \
                    --collection-uri "$(System.TeamFoundationCollectionUri)" \
                    --service-name "$(name)" \
                    --environment "$(environment)" \
                    --test-case-filter "$TEST_CASE_FILTER"
                else
                  python3 framework/reporter/email_reporter.py \
                    --build-number "$(Build.BuildNumber)" \
                    --job-status "$(Agent.JobStatus)" \
                    --reports-path "$(REPORTS_PATH)" \
                    --build-id "$(Build.BuildId)" \
                    --team-project "$(System.TeamProject)" \
                    --collection-uri "$(System.TeamFoundationCollectionUri)" \
                    --service-name "$(name)" \
                    --environment "$(environment)"
                fi
              workingDirectory: $(buildPath)
          
          - task: Bash@3
            displayName: 'Verify Test Results - $(name)_$(environment)'
            condition: always()
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Final Test Results - $(name)"
                echo "=========================================="
                failed=false
                
                if [ "$(testType)" = "functional" ] || [ "$(testType)" = "both" ]; then
                  if [ -z "$(TEST_EXIT_CODE)" ]; then
                    echo "⚠️ Functional Tests were SKIPPED or not executed"
                    failed=true
                  elif [ "$(TEST_EXIT_CODE)" != "0" ]; then
                    echo "❌ Functional Tests Failed (Exit Code: $(TEST_EXIT_CODE))"
                    failed=true
                  else
                    echo "✅ Functional Tests Passed"
                  fi
                fi
                
                if [ "$(testType)" = "non-functional" ] || [ "$(testType)" = "both" ]; then
                  if [ -z "$(LOCUST_EXIT_CODE)" ]; then
                    echo "⚠️ Non-Functional Tests were SKIPPED or not executed"
                    failed=true
                  elif [ "$(LOCUST_EXIT_CODE)" != "0" ]; then
                    echo "❌ Non-Functional Tests Failed (Exit Code: $(LOCUST_EXIT_CODE))"
                    failed=true
                  else
                    echo "✅ Non-Functional Tests Passed"
                  fi
                fi
                
                if [ "$failed" = "true" ]; then
                  echo "##vso[task.complete result=Failed;]Tests failed or were skipped for $(name)"
                  exit 1
                else
                  echo "✅ All tests passed for $(name)"
                fi

  ###########################################################################
  # Stage 3: Summary and Reporting
  ###########################################################################
  - stage: Summary
    displayName: 'Test Execution Summary'
    dependsOn:
      - Initialize
      - ExecuteTests
    condition: always()
    jobs:
      - job: GenerateSummary
        displayName: 'Generate Execution Summary'
        pool:
          name: ewm20-docker-build-agent-qa-dev
        variables:
          initializeResult: $[ stageDependencies.Initialize.ParseMatrix.result ]
          executeTestsResult: $[ stageDependencies.ExecuteTests.RunTests.result ]
        steps:
          - checkout: ${{ parameters.repositoryAlias }}
            clean: true
            fetchDepth: 1
            sparseCheckoutDirectories: |
              platformqe
          
          - task: Bash@3
            displayName: 'Display Summary'
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Pipeline Execution Summary"
                echo "=========================================="
                echo "Build Number: $(Build.BuildNumber)"
                echo "Build Reason: $(Build.Reason)"
                echo "Source Branch: $(Build.SourceBranch)"
                echo "Trigger: $(Build.Reason)"
                echo "=========================================="
                echo ""
                echo "Stage Results:"
                echo "  Initialize: $(initializeResult)"
                echo "  ExecuteTests: $(executeTestsResult)"
                echo "=========================================="
                echo ""
                echo "Check the published test results and artifacts for detailed reports."
                echo ""
                
                if [ "$(executeTestsResult)" = "Failed" ]; then
                  echo "❌ Pipeline FAILED - Tests failed"
                  echo "##vso[task.complete result=Failed;]Test execution failed"
                  exit 1
                elif [ "$(executeTestsResult)" = "Skipped" ]; then
                  echo "⚠️ Pipeline SKIPPED - Tests were not executed"
                  echo "##vso[task.complete result=Failed;]Test execution was skipped"
                  exit 1
                elif [ "$(executeTestsResult)" = "Canceled" ]; then
                  echo "⚠️ Pipeline CANCELED"
                  echo "##vso[task.complete result=Canceled;]Test execution was canceled"
                  exit 1
                else
                  echo "✅ Pipeline execution completed successfully"
                fi
          - task: DownloadBuildArtifacts@1
            displayName: 'Download Build Artifacts for Notification'
            condition: succeededOrFailed()
            inputs:
              buildType: 'current'
              downloadType: 'all'
              downloadPath: '$(Pipeline.Workspace)/teams-summary'
          
          # Slack Workflow Notification
          - ${{ if eq(parameters.slackNotificationEnabled, true) }}:
            - template: qe-slack-workflow-notification.yml
              parameters:
                slackWorkflowWebhookUrl: $(SLACK_WORKFLOW_WEBHOOK_URL)
                serviceNames: ${{ parameters.services }}