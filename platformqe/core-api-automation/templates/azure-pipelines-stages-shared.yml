###############################################################################
# Shared Stages Template for QE Automation Framework
# File: templates/azure-pipelines-stages-shared.yml
###############################################################################
# This template contains reusable stages for both azure-pipelines-matrix.yml
# and azure-pipelines-callable.yml to eliminate code duplication.
#
# Usage:
#   stages:
#   - template: templates/azure-pipelines-stages-shared.yml
#     parameters:
#       repositoryAlias: 'self'
#       buildPath: '$(Build.SourcesDirectory)/platformqe/core-api-automation'
#       buildPathSuffix: 'platformqe/core-api-automation'
#       executionMode: 'auto'
#       services: 'all'
#       environments: 'all'
#       testType: 'functional'
#       overrideEnabled: false
#       customFunctionalArgs: 'N/A'
#       customNonFunctionalArgs: 'N/A'
#       triggerReason: '$(Build.Reason)'
#       enableScheduleDetection: true  # Set to true for scheduled pipeline runs
###############################################################################

parameters:
  # Repository configuration
  - name: repositoryAlias
    type: string
    default: 'self'
  
  # Build path configuration
  - name: buildPath
    type: string
    default: ''
  
  - name: buildPathSuffix
    type: string
    default: 'platformqe/core-api-automation'
  
  # Execution parameters
  - name: executionMode
    type: string
    default: 'auto'
  
  - name: services
    type: string
    default: 'all'
  
  - name: environments
    type: string
    default: 'all'
  
  - name: testType
    type: string
    default: 'functional'

  # Filter test cases by test_type tag (e.g. Smoke, Regression, Business Logic)
  # This appends --test-type <value> to pytest to filter JSON test cases
  - name: testCaseFilter
    type: string
    default: 'N/A'
  
  - name: overrideEnabled
    type: boolean
    default: false
  
  - name: customFunctionalArgs
    type: string
    default: 'N/A'
  
  - name: customNonFunctionalArgs
    type: string
    default: 'N/A'

  - name: promotePerformanceBaseline
    type: boolean
    default: false

  - name: baselineReason
    type: string
    default: 'Approved performance baseline'

  - name: slackNotificationEnabled
    type: boolean
    default: false
  
  # Trigger configuration
  - name: triggerReason
    type: string
    default: 'Manual'
  
  # Enable schedule detection (for matrix pipeline with cron triggers)
  - name: enableScheduleDetection
    type: boolean
    default: false

  # Default environments (fallback when ENABLED_ENVIRONMENTS variable is not set)
  - name: defaultEnvironments
    type: string
    default: 'all'
  # Schedule-specific test case filter (branch-aware, set in calling pipeline)
  - name: scheduleTestCaseFilter
    type: string
    default: 'N/A'

  # sleept time To sync the deployment charts
  - name: deploymentsync
    displayName: 'wait to sync ArgoCd charts and deployment sucessfully'
    type: number
    default: 0

stages:
  ###########################################################################
  # Stage 1: Initialization - Parse Matrix and Determine Services to Run
  ###########################################################################
  - stage: Initialize
    displayName: 'Initialize and Parse Service Matrix'
    # Skip scheduled runs if SCHEDULE_RUN_BRANCH doesn't match this branch
    condition: |
      or(
        ne(variables['Build.Reason'], 'Schedule'),
        eq(variables['SCHEDULE_RUN_BRANCH'], 'all'),
        eq(variables['SCHEDULE_RUN_BRANCH'], variables['Build.SourceBranchName'])
      )
    jobs:
      - job: ParseMatrix
        displayName: 'Parse Services Matrix'
        pool:
          name: ewm20-docker-build-agent-qa-dev
        steps:
          - checkout: ${{ parameters.repositoryAlias }}
            clean: true
            fetchDepth: 1
            sparseCheckoutDirectories: |
              platformqe

          - task: PowerShell@2
            displayName: 'Sleep time if triggered from deployment pipeline'
            inputs:
              targetType: 'inline'
              script: |
                    Start-Sleep -Seconds ${{ parameters.deploymentsync }}
          - task: Bash@3
            name: SetBuildPath
            displayName: 'Determine Build Path'
            env:
              SOURCE_DIR: $(Build.SourcesDirectory)
              REPO_ALIAS: ${{ parameters.repositoryAlias }}
              BUILD_PATH_PARAM: ${{ parameters.buildPath }}
              BUILD_PATH_SUFFIX: ${{ parameters.buildPathSuffix }}
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Determining Build Path"
                echo "=========================================="
                
                # If buildPath is explicitly provided, use it
                if [ -n "$BUILD_PATH_PARAM" ]; then
                  BUILD_PATH="$BUILD_PATH_PARAM"
                  echo "Using provided buildPath: $BUILD_PATH"
                # Otherwise, calculate based on repository alias
                elif [ "$REPO_ALIAS" = "self" ]; then
                  BUILD_PATH="${SOURCE_DIR}/${BUILD_PATH_SUFFIX}"
                else
                  # Try with alias folder first (multiple repos checkout)
                  BUILD_PATH="${SOURCE_DIR}/${REPO_ALIAS}/${BUILD_PATH_SUFFIX}"
                  
                  # If not found, try without alias (single repo checkout)
                  if [ ! -d "$BUILD_PATH" ]; then
                    echo "Path with alias not found, trying without alias..."
                    BUILD_PATH="${SOURCE_DIR}/${BUILD_PATH_SUFFIX}"
                  fi
                fi
                
                echo "Source Directory: $SOURCE_DIR"
                echo "Repository Alias: $REPO_ALIAS"
                echo "Build Path Suffix: $BUILD_PATH_SUFFIX"
                echo "Build Path: $BUILD_PATH"
                
                # Verify path exists
                if [ -d "$BUILD_PATH" ]; then
                  echo "✅ Build path exists"
                else
                  echo "❌ Build path does not exist!"
                  echo "Available directories in source:"
                  ls -la "${SOURCE_DIR}/"
                  exit 1
                fi
                
                echo "##vso[task.setvariable variable=buildPath;isOutput=true]$BUILD_PATH"
                echo "##vso[task.setvariable variable=buildPath]$BUILD_PATH"
                echo "=========================================="
          
          - task: Bash@3
            displayName: 'Install PyYAML'
            inputs:
              targetType: inline
              script: |
                pip install pyyaml
          
          - task: Bash@3
            name: DetermineServices
            displayName: 'Determine Services to Run'
            env:
              BUILD_REASON: $(Build.Reason)
              SERVICES_INPUT: ${{ parameters.services }}
              ENABLE_SCHEDULE: ${{ parameters.enableScheduleDetection }}
              ENVIRONMENTS_INPUT: ${{ parameters.environments }}
              DEFAULT_ENVIRONMENTS: $(defaultEnvironments)
              EXECUTION_MODE: ${{ parameters.executionMode }}
              TEST_TYPE: ${{ parameters.testType }}
              TRIGGER_REASON: ${{ parameters.triggerReason }}
              OVERRIDE_ENABLED: ${{ parameters.overrideEnabled }}
              CUSTOM_FUNC_ARGS: ${{ parameters.customFunctionalArgs }}
              CUSTOM_NONFUNC_ARGS: ${{ parameters.customNonFunctionalArgs }}
              TEST_CASE_FILTER: ${{ parameters.testCaseFilter }}
              SCHEDULE_TEST_CASE_FILTER: ${{ parameters.scheduleTestCaseFilter }}
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Using manage_matrix.py to determine services"
                echo "=========================================="
                
                # For scheduled runs, use branch-specific filter if manual filter is not set
                if [ "$BUILD_REASON" = "Schedule" ] && { [ -z "$TEST_CASE_FILTER" ] || [ "$TEST_CASE_FILTER" = "N/A" ]; }; then
                  if [ -n "$SCHEDULE_TEST_CASE_FILTER" ] && [ "$SCHEDULE_TEST_CASE_FILTER" != "N/A" ]; then
                    TEST_CASE_FILTER="$SCHEDULE_TEST_CASE_FILTER"
                    echo "Using branch-specific schedule filter: $TEST_CASE_FILTER"
                  fi
                fi
                
                # Normalize filter: strip spaces around commas (e.g. "Smoke, Regression" -> "Smoke,Regression")
                if [ -n "$TEST_CASE_FILTER" ] && [ "$TEST_CASE_FILTER" != "N/A" ]; then
                  TEST_CASE_FILTER=$(echo "$TEST_CASE_FILTER" | sed 's/[[:space:]]*,[[:space:]]*/,/g' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                  echo "Test Case Filter: $TEST_CASE_FILTER (will append --test-type $TEST_CASE_FILTER to pytest)"
                fi
                
                # Handle schedule service detection (for matrix pipeline with cron triggers)
                SERVICES_PARAM="$SERVICES_INPUT"
                
                if [ "$ENABLE_SCHEDULE" = "True" ] && [ "$BUILD_REASON" = "Schedule" ]; then
                  echo "Schedule detection enabled - determining service from cron time..."
                  
                  CURRENT_HOUR=$(date -u +%H)
                  CURRENT_MINUTE=$(date -u +%M)
                  
                  echo "Schedule triggered at UTC: ${CURRENT_HOUR}:${CURRENT_MINUTE}"
                  
                  # Map cron times to service names
                  SCHEDULE_SERVICE=""
                  case "${CURRENT_HOUR}:${CURRENT_MINUTE}" in
                    "6:0"|"06:00")
                      SCHEDULE_SERVICE="work_item_notification"
                      ;;
                    "15:5"|"15:05")
                      SCHEDULE_SERVICE="account_service"
                      ;;
                    "15:10")
                      SCHEDULE_SERVICE="custodialintegration"
                      ;;
                    "15:15")
                      SCHEDULE_SERVICE="movemoney"
                      ;;
                    "15:20")
                      SCHEDULE_SERVICE="transfer_service_validation"
                      ;;
                    "15:30")
                      SCHEDULE_SERVICE="models"
                      ;;
                    "15:45")
                      SCHEDULE_SERVICE="analytics"
                      ;;
                    "16:0"|"16:00")
                      SCHEDULE_SERVICE="parties"
                      ;;
                    "16:15")
                      SCHEDULE_SERVICE="addressservice"
                      ;;
                    "16:30")
                      SCHEDULE_SERVICE="securities"
                      ;;
                    "16:45")
                      SCHEDULE_SERVICE="hnebase"
                      ;;
                    "16:5"|"16:05")
                      SCHEDULE_SERVICE="lexisnexiscipproxyservice"
                      ;;
                    "16:10")
                      SCHEDULE_SERVICE="DocusignProxyservice"
                      ;;
                    *)
                      echo "WARNING: No exact match for time ${CURRENT_HOUR}:${CURRENT_MINUTE}"
                      echo "Checking with minute tolerance (within 5 minutes)..."
                      CURRENT_TIME_MIN=$((10#$CURRENT_HOUR * 60 + 10#$CURRENT_MINUTE))
                      
                      # work_item_notification: 06:00 (360 min)
                      if [ $CURRENT_TIME_MIN -ge 358 ] && [ $CURRENT_TIME_MIN -le 362 ]; then
                        SCHEDULE_SERVICE="work_item_notification"
                      # account_service: 15:05 (905 min)
                      elif [ $CURRENT_TIME_MIN -ge 903 ] && [ $CURRENT_TIME_MIN -le 907 ]; then
                        SCHEDULE_SERVICE="account_service"
                      # custodialintegration: 15:10 (910 min)
                      elif [ $CURRENT_TIME_MIN -ge 908 ] && [ $CURRENT_TIME_MIN -le 912 ]; then
                        SCHEDULE_SERVICE="custodialintegration"
                      # movemoney: 15:15 (915 min)
                      elif [ $CURRENT_TIME_MIN -ge 913 ] && [ $CURRENT_TIME_MIN -le 917 ]; then
                        SCHEDULE_SERVICE="movemoney"
                      # transfer_service_validation: 15:20 (920 min)
                      elif [ $CURRENT_TIME_MIN -ge 918 ] && [ $CURRENT_TIME_MIN -le 922 ]; then
                        SCHEDULE_SERVICE="transfer_service_validation"
                      # models: 15:30 (930 min)
                      elif [ $CURRENT_TIME_MIN -ge 928 ] && [ $CURRENT_TIME_MIN -le 932 ]; then
                        SCHEDULE_SERVICE="models"
                      # analytics: 15:45 (945 min)
                      elif [ $CURRENT_TIME_MIN -ge 943 ] && [ $CURRENT_TIME_MIN -le 947 ]; then
                        SCHEDULE_SERVICE="analytics"
                      # parties: 16:00 (960 min)
                      elif [ $CURRENT_TIME_MIN -ge 958 ] && [ $CURRENT_TIME_MIN -le 962 ]; then
                        SCHEDULE_SERVICE="parties"
                      # addressservice: 16:15 (975 min)
                      elif [ $CURRENT_TIME_MIN -ge 973 ] && [ $CURRENT_TIME_MIN -le 977 ]; then
                        SCHEDULE_SERVICE="addressservice"
                      # securities: 16:30 (990 min)
                      elif [ $CURRENT_TIME_MIN -ge 988 ] && [ $CURRENT_TIME_MIN -le 992 ]; then
                        SCHEDULE_SERVICE="securities"
                      # hnebase: 16:45 (1005 min)
                      elif [ $CURRENT_TIME_MIN -ge 1003 ] && [ $CURRENT_TIME_MIN -le 1007 ]; then
                        SCHEDULE_SERVICE="hnebase"
                      # lexisnexiscipproxyservice: 16:05 (965 min)
                      elif [ $CURRENT_TIME_MIN -ge 963 ] && [ $CURRENT_TIME_MIN -le 967 ]; then
                        SCHEDULE_SERVICE="lexisnexiscipproxyservice"
                      # DocusignProxyservice: 16:10 (970 min)
                      elif [ $CURRENT_TIME_MIN -ge 968 ] && [ $CURRENT_TIME_MIN -le 972 ]; then
                        SCHEDULE_SERVICE="DocusignProxyservice"
                      fi
                      ;;
                  esac
                  
                  if [ -n "$SCHEDULE_SERVICE" ]; then
                    SERVICES_PARAM="$SCHEDULE_SERVICE"
                    echo "Matched schedule to service: $SERVICES_PARAM"
                  else
                    echo "ERROR: Could not determine service for scheduled run"
                    echo "Falling back to parameter value: $SERVICES_PARAM"
                  fi
                fi
                
                # Set environments parameter
                ENVIRONMENTS_PARAM="$ENVIRONMENTS_INPUT"
                VAR_GROUP_ENVS="$DEFAULT_ENVIRONMENTS"
                
                if [ -z "$ENVIRONMENTS_PARAM" ] || [ "$ENVIRONMENTS_PARAM" = "all" ]; then
                  if [ -n "$VAR_GROUP_ENVS" ] && [ "$VAR_GROUP_ENVS" != "all" ]; then
                    ENVIRONMENTS_PARAM="$VAR_GROUP_ENVS"
                    echo "Using environments from variable group: $ENVIRONMENTS_PARAM"
                  else
                    ENVIRONMENTS_PARAM="all"
                    echo "Using default environments from services-matrix.yaml"
                  fi
                else
                  echo "Using manually specified environments: $ENVIRONMENTS_PARAM"
                fi
                
                # Build arguments array
                set -- "scripts/manage_matrix.py" "generate-pipeline-matrix" \
                  "--execution-mode" "$EXECUTION_MODE" \
                  "--services" "$SERVICES_PARAM" \
                  "--environments" "$ENVIRONMENTS_PARAM" \
                  "--test-type" "$TEST_TYPE" \
                  "--trigger-reason" "$TRIGGER_REASON"
                
                # Add optional arguments
                if [ "$OVERRIDE_ENABLED" = "True" ]; then
                  set -- "$@" "--override-enabled"
                fi
                
                echo "DEBUG: customFunctionalArgs = '$CUSTOM_FUNC_ARGS'"
                echo "DEBUG: customNonFunctionalArgs = '$CUSTOM_NONFUNC_ARGS'"
                
                if [ -n "$CUSTOM_FUNC_ARGS" ] && [ "$CUSTOM_FUNC_ARGS" != "N/A" ]; then
                  echo "DEBUG: Adding custom functional args to command"
                  set -- "$@" "--custom-functional-args" "$CUSTOM_FUNC_ARGS"
                fi
                
                if [ -n "$CUSTOM_NONFUNC_ARGS" ] && [ "$CUSTOM_NONFUNC_ARGS" != "N/A" ]; then
                  echo "DEBUG: Adding custom non-functional args to command"
                  set -- "$@" "--custom-nonfunctional-args" "$CUSTOM_NONFUNC_ARGS"
                fi
                
                echo "DEBUG: Full command: python3 $@"
                
                python3 "$@" > matrix_output.log 2>&1
                exit_code=$?
                cat matrix_output.log
                
                echo ""
                echo "Script completed with exit code: $exit_code"
                
                # Verify the output variables
                echo "=========================================="
                echo "Verifying Matrix Output"
                echo "=========================================="
                
                if grep -q "##vso\[task.setvariable variable=servicesMatrix" matrix_output.log; then
                  echo "✅ servicesMatrix variable command found"
                  matrix_json=$(grep "##vso\[task.setvariable variable=servicesMatrix" matrix_output.log | sed 's/.*isOutput=true\]//')
                  if echo "$matrix_json" | python3 -m json.tool > /dev/null 2>&1; then
                    echo "✅ Matrix JSON is valid"
                    echo "Matrix keys count: $(echo "$matrix_json" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
                  else
                    echo "❌ ERROR: Matrix JSON is INVALID!"
                  fi
                else
                  echo "❌ ERROR: No servicesMatrix variable command found in output!"
                fi
                
                echo "=========================================="
                
                # Display execution plan summary
                echo ""
                echo "=========================================="
                echo "📋 EXECUTION PLAN SUMMARY"
                echo "=========================================="
                echo "  Test Type (Runner):     $TEST_TYPE"
                echo "  Services:               $SERVICES_PARAM"
                echo "  Environments:           $ENVIRONMENTS_PARAM"
                echo ""
                # Functional test details
                if [ "$TEST_TYPE" = "functional" ] || [ "$TEST_TYPE" = "both" ]; then
                  echo "  🧪 Functional Tests (pytest):  ✅ Will run"
                  if [ -n "$TEST_CASE_FILTER" ] && [ "$TEST_CASE_FILTER" != "N/A" ]; then
                    echo "     Test Case Filter:           $TEST_CASE_FILTER"
                    echo "     pytest will receive:         --test-type $TEST_CASE_FILTER"
                    echo "     ℹ️  Only test cases with '$TEST_CASE_FILTER' in their test_type array will run"
                  else
                    echo "     Test Case Filter:           None (all test cases will run)"
                  fi
                else
                  echo "  🧪 Functional Tests (pytest):  ⏭️ Skipped (testType=$TEST_TYPE)"
                  if [ -n "$TEST_CASE_FILTER" ] && [ "$TEST_CASE_FILTER" != "N/A" ]; then
                    echo "     ⚠️  Test Case Filter '$TEST_CASE_FILTER' ignored (only applies to functional/pytest)"
                  fi
                fi
                echo ""
                # Non-functional test details
                if [ "$TEST_TYPE" = "non-functional" ] || [ "$TEST_TYPE" = "both" ]; then
                  echo "  🔥 Non-Functional Tests (locust): ✅ Will run"
                else
                  echo "  🔥 Non-Functional Tests (locust): ⏭️ Skipped (testType=$TEST_TYPE)"
                fi
                echo "=========================================="
                
                exit $exit_code
              workingDirectory: $(buildPath)

  ###########################################################################
  # Stage 2: Execute Tests - Dynamic Jobs Based on Service Matrix
  ###########################################################################
  - stage: ExecuteTests
    displayName: 'Execute Service Tests'
    dependsOn: Initialize
    condition: and(succeeded(), eq(dependencies.Initialize.outputs['ParseMatrix.DetermineServices.hasServices'], 'true'))
    jobs:
      - job: RunTests
        displayName: 'Run Tests'
        pool:
          name: ewm20-docker-build-agent-qa-dev
        strategy:
          maxParallel: 5
          matrix: $[ stageDependencies.Initialize.ParseMatrix.outputs['DetermineServices.servicesMatrix'] ]
                
        steps:
          - checkout: ${{ parameters.repositoryAlias }}
            clean: true
            fetchDepth: 1
            sparseCheckoutDirectories: |
              platformqe
          
          - task: Bash@3
            name: SetBuildPath
            displayName: 'Determine Build Path'
            env:
              SOURCE_DIR: $(Build.SourcesDirectory)
              REPO_ALIAS: ${{ parameters.repositoryAlias }}
              BUILD_PATH_PARAM: ${{ parameters.buildPath }}
              BUILD_PATH_SUFFIX: ${{ parameters.buildPathSuffix }}
            inputs:
              targetType: inline
              script: |
                if [ -n "$BUILD_PATH_PARAM" ]; then
                  BUILD_PATH="$BUILD_PATH_PARAM"
                elif [ "$REPO_ALIAS" = "self" ]; then
                  BUILD_PATH="${SOURCE_DIR}/${BUILD_PATH_SUFFIX}"
                else
                  # Try with alias folder first (multiple repos checkout)
                  BUILD_PATH="${SOURCE_DIR}/${REPO_ALIAS}/${BUILD_PATH_SUFFIX}"
                  # If not found, try without alias (single repo checkout)
                  if [ ! -d "$BUILD_PATH" ]; then
                    BUILD_PATH="${SOURCE_DIR}/${BUILD_PATH_SUFFIX}"
                  fi
                fi
                echo "Build Path: $BUILD_PATH"
                echo "##vso[task.setvariable variable=buildPath]$BUILD_PATH"
          
          - task: Bash@3
            displayName: 'Debug Matrix Variables'
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Matrix Variable Injection Test"
                echo "=========================================="
                echo "  name = '$(name)'"
                echo "  displayName = '$(displayName)'"
                echo "  environment = '$(environment)'"
                echo "  testType = '$(testType)'"
                echo "  priority = '$(priority)'"
                echo "  reason = '$(reason)'"
                echo "  functionalTestArgs = '$(functionalTestArgs)'"
                echo "  buildPath = '$(buildPath)'"
                if [ -z "$(name)" ]; then
                  echo "❌ ERROR: Matrix variables are EMPTY!"
                else
                  echo "✅ Matrix variables populated correctly"
                fi
                echo "=========================================="
          
          # Fetch database connection strings from Azure Key Vault
          - task: AzureKeyVault@2
            displayName: 'Fetch secrets from Key Vault (TSADEV)'
            condition: or(eq(variables['environment'], 'TSADEV'), eq(variables['environment'], 'all'))
            inputs:
              azureSubscription: $(subscription_dev)
              KeyVaultName: 'amkkvqapipeline-devncus'
              SecretsFilter: 'parties-sqldb-connection-string,accounts-sqldb-connection-string,movemoney-sqldb-connection-string,hne-db-connection-string,securitieshub-db-connection-string,modelhub-db-connection-string,am-db-connection-string,platform-db-connection-string'
              RunAsPreJob: false
          
          - task: AzureKeyVault@2
            displayName: 'Fetch secrets from Key Vault (TSATEST)'
            condition: eq(variables['environment'], 'TSATEST')
            inputs:
              azureSubscription: $(subscription_test)
              KeyVaultName: 'amkkvqapipeline-testncus'
              SecretsFilter: 'parties-sqldb-connection-string,accounts-sqldb-connection-string,movemoney-sqldb-connection-string,hne-db-connection-string,securitieshub-db-connection-string,modelhub-db-connection-string,am-db-connection-string,platform-db-connection-string'
              RunAsPreJob: false
          
          - task: AzureKeyVault@2
            displayName: 'Fetch secrets from Key Vault (TSASILO)'
            condition: eq(variables['environment'], 'TSASILO')
            inputs:
              azureSubscription: $(subscription_silo)
              KeyVaultName: 'amkkvqapipeline-siloncus'
              SecretsFilter: 'parties-sqldb-connection-string,accounts-sqldb-connection-string,movemoney-sqldb-connection-string,hne-db-connection-string,securitieshub-db-connection-string,modelhub-db-connection-string,am-db-connection-string,platform-db-connection-string'
              RunAsPreJob: false
          
          # Resolve environment-specific variables
          - task: Bash@3
            name: ResolveEnvVars
            displayName: 'Resolve Environment Variables'
            inputs:
              targetType: inline
              script: |
                echo "=========================================="
                echo "Resolving Environment-Specific Variables"
                echo "=========================================="
                echo "Selected Environment: $(environment)"
                
                SELECTED_ENV="$(environment)"
                if [ "$SELECTED_ENV" = "all" ]; then
                  SELECTED_ENV="TSADEV"
                  echo "Environment 'all' selected, defaulting to: $SELECTED_ENV"
                fi
                
                echo "Using environment: $SELECTED_ENV"
                
                case "$SELECTED_ENV" in
                  "TSADEV")
                    echo "##vso[task.setvariable variable=RESOLVED_PARTIES_BASE_URL]$(TSADEV_parties_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ADDRESS_BASE_URL]$(TSADEV_address_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ANALYTICS_BASE_URL]$(TSADEV_analytics_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_HNE_BASE_URL]$(TSADEV_hne_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_MODELS_BASE_URL]$(TSADEV_models_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_MOVEMONEY_BASE_URL]$(TSADEV_movemoney_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ACCOUNTS_BASE_URL]$(TSADEV_accounts_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_SECURITIES_BASE_URL]$(TSADEV_securities_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_WORK_ITEM_NOTIFICATION_BASE_URL]$(TSADEV_work_item_notification_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_STRATEGIES_BASE_URL]$(TSADEV_strategies_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_WRAPTOKEN_BASE_URL]$(TSADEV_wraptoken_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ACCOUNTDISTRIBUTIONS_BASE_URL]$(TSADEV_accountdistributions_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_LEXISNEXIS_BASE_URL]$(TSADEV_lexisnexis_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_DOCUSIGN_BASE_URL]$(T10_docusign_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_TRANSFER_SERVICE_VALIDATION_BASE_URL]$(T11_transfer_service_validation_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_CUSTODIAL_INTEGRATION_BASE_URL]$(TSADEV_custodial_integration_base_url)"
                    ;;
                  "TSATEST")
                    echo "##vso[task.setvariable variable=RESOLVED_PARTIES_BASE_URL]$(TSATEST_parties_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ADDRESS_BASE_URL]$(TSATEST_address_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ANALYTICS_BASE_URL]$(TSATEST_analytics_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_HNE_BASE_URL]$(TSATEST_hne_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_MODELS_BASE_URL]$(TSATEST_models_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_MOVEMONEY_BASE_URL]$(TSATEST_movemoney_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_ACCOUNTS_BASE_URL]$(TSATEST_accounts_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_SECURITIES_BASE_URL]$(TSATEST_securities_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_WORK_ITEM_NOTIFICATION_BASE_URL]$(TSATEST_work_item_notification_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_STRATEGIES_BASE_URL]$(TSATEST_strategies_base_url)"
                    echo "##vso[task.setvariable variable=RESOLVED_WRAPTOKEN_BASE_URL]$(TSATEST_wraptoken_base_url)"
