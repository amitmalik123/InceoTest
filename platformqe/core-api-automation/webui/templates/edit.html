<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if new %}New{% else %}Edit{% endif %} Test Case</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="am-header d-flex align-items-center mb-4">
        <img src="/static/AssetMark.png" alt="AssetMark Logo" style="height:32px;margin-right:1rem;">
        <h2 class="mb-0" style="font-size:2rem;">{% if new %}New{% else %}Edit{% endif %} Test Case</h2>
    </div>
    <a href="{{ url_for('index') }}" class="btn btn-secondary mb-3">Back to Dashboard</a>
    <form method="post">
        {% if testcase is defined and testcase is mapping %}
            {% for key, value in testcase.items() %}
                {% if key != '__file' and key != 'test_id' %}
                <div class="mb-3">
                    <label for="{{ key }}" class="form-label">{{ key.replace('_', ' ').title() }}</label>
                    <textarea class="form-control expandable-textarea" id="{{ key }}" name="{{ key }}" rows="3">{{ value }}</textarea>
                </div>
                {% endif %}
            {% endfor %}
            {% if not new %}
            <input type="hidden" name="test_id" value="{{ testcase.test_id }}">
            {% endif %}
        {% else %}
            <div class="mb-3">
                <label for="row_value" class="form-label">Value</label>
                <textarea class="form-control expandable-textarea" id="row_value" name="row_value" rows="3">{{ row }}</textarea>
            </div>
        {% endif %}
        <button type="submit" class="btn btn-primary">{% if new %}Create{% else %}Update{% endif %}</button>
    </form>

    <script>
    // Make textareas auto-expand as user types, and add a button to expand/collapse
    document.querySelectorAll('.expandable-textarea').forEach(function(textarea) {
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
        // Initial resize
        textarea.style.height = 'auto';
        textarea.style.height = (textarea.scrollHeight) + 'px';

        // Add expand/collapse button
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn-sm btn-outline-secondary ms-2';
        btn.textContent = 'Expand';
        btn.style.marginTop = '5px';
        btn.addEventListener('click', function() {
            if (textarea.style.height !== '300px') {
                textarea.style.height = '300px';
                btn.textContent = 'Collapse';
            } else {
                textarea.style.height = 'auto';
                textarea.style.height = (textarea.scrollHeight) + 'px';
                btn.textContent = 'Expand';
            }
        });
        textarea.parentNode.appendChild(btn);
    });
    </script>
</div>
</body>
</html>
