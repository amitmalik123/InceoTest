
# Azure AD Authentication Resources
azure_ad:
  resources:
    # Database resources
    postgresql: "https://ossrdbms-aad.database.windows.net"
    mysql: "https://ossrdbms-aad.database.windows.net"
    mssql: "https://database.windows.net/"
    
    # Azure services
    resource_manager: "https://management.azure.com/"
    key_vault: "https://vault.azure.net"
    storage: "https://storage.azure.com/"
    
    # Default resource for database operations
    default_database: "https://ossrdbms-aad.database.windows.net"


# Database connection strings - Enhanced to support multiple connections
db_connections:
  # MSSQL Connections - Multiple servers and databases
  mssql:
    tracking_center:
      driver: "ODBC Driver 17 for SQL Server"
      server: "t10ewmdba"
      database: "TrackingCenter"
      trusted_connection: true
  
  # PostgreSQL Connections - Multiple servers and databases
  postgresql:
    parties:
      host: "psql-custodialdataops-dev01-ncus.postgres.database.azure.com"
      port: 5432
      database: "parties"
      user: "psql-custodialdataops-dev01-ncus-parties-rw"
      password: "AZURE_AD"  # Placeholder - will use Azure AD token
      sslmode: "require"
      use_azure_auth: true  # Set to true to use Azure AD authentication instead of password
    
    securities_hub:
      host: "psql-platform-dev01-ncus.postgres.database.azure.com"
      port: 5432
      database: "securitieshub"
      user: "psql-platform-dev01-ncus-securitieshub-ro"
      password: "AZURE_AD"  # Placeholder - will use Azure AD token
      sslmode: "require"
      use_azure_auth: true  # Set to true to use Azure AD authentication instead of password
    
    # Example: Azure AD authentication (no password needed)
    parties_azure_ad:
      host: "psql-custodialdataops-dev01-ncus.postgres.database.azure.com"
      port: 5432
      database: "parties"
      user: "psql-custodialdataops-dev01-ncus-parties-rw"
      password: "AZURE_AD"  # Placeholder - will use Azure AD token
      sslmode: "require"
      use_azure_auth: true  # Enable Azure AD authentication
  
  # CosmosDB Connections - Multiple accounts and databases
  cosmosdb:
    primary:
      endpoint: "https://cosmos-primary-dev.documents.azure.com:443/"
      key: "${COSMOS_PRIMARY_KEY}"
      database: "main_db"
      container: "default_container"
  
  # MongoDB Connections - Multiple clusters and databases
  mongodb:
    main_cluster:
      connection_string: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo-main-dev.azure.com:27017/main_db?authSource=admin"
      database: "main_db"
      collection: "default_collection"
  
  # SQLite Connections - Multiple local databases
  sqlite:
    test_users:
      path: "testdata/users.db"
  
  # InfluxDB Connections - Time-series metrics database
  influxdb:
    default:
      url: "http://azncc03perf.corp.local:8086"
      token: "g5gf0ukY8fPdwaWynLviDLd0wz1l5snomLbip3t2IrQkeNNkiEFYECEHlcJLwsAPvv2Gx-op4ho6QcpVsCpdGQ=="
      org: "MF"
      bucket: "Platform_Automation"
      timeout: 10000  # Connection timeout in milliseconds
      enabled: false  # Set to true to enable InfluxDB push for this environment

# API Endpoints - Multiple services and environments
api_endpoints:
  parties:
    base_url: "https://platform.dev01.assetmark.com/api/parties/v1"  # Parties API endpoint
    auth_token: "${PARTIES_AUTH_TOKEN}"
    timeout: 30
    retry_count: 3
    use_azure_auth: false  # Set to true to use Azure AD authentication
    azure_resource: "https://management.azure.com/"
  
  accountdistributions:
    base_url: "${ACCOUNTDISTRIBUTIONS_BASE_URL}"
    auth_token: "${ACCOUNTDISTRIBUTIONS_AUTH_TOKEN:}"
    timeout: ${API_TIMEOUT:30}
    retry_count: ${API_RETRY_COUNT:3}
    use_azure_auth: false
    azure_resource: "https://management.azure.com/"
  
  work_item_notification:
    base_url: "https://app-workitemnotifsvc-test-test10.azurewebsites.net"
    auth_token: "${WORK_ITEM_AUTH_TOKEN}"
    timeout: 30
    retry_count: 3
    use_azure_auth: false  # Set to true to use Azure AD authentication
    azure_resource: "https://management.azure.com/"  # Azure resource for token generation
  
  docusignproxyservice:
    base_url: "${DOCUSIGN_BASE_URL}"
    auth_token: "${DOCUSIGN_AUTH_TOKEN}"
    timeout: 30
    retry_count: 3
    use_azure_auth: false
    azure_resource: "https://management.azure.com/"
  
  # Example: Azure AD authenticated API
  azure_resource_manager:
    base_url: "https://management.azure.com"
    auth_token: "AZURE_AD"  # Placeholder - will use Azure AD token
    timeout: 30
    retry_count: 3
    use_azure_auth: true  # Enable Azure AD authentication
    azure_resource: "https://management.azure.com/"

# Legacy support for api_base_url variable (used in some testcases)
api_base_url: "https://your-parties-api-url.azurewebsites.net"  # TODO: Update with actual Parties API URL

user_load: 100
feature_flags:
  enable_feature_x: true

  # Synced from .env
env_name: "TSADEV"
appinsights_instrumentation_key: "your_instrumentation_key_here"