    displayName: Work Item Notification
    enabled: false
    runOnPR: false
    runOnPush: false
    runOnSchedule: false
    testType: functional
    environments:
    - TSADEV
    - TSATEST
    - TSASILO
    functionalTestArgs: --service-name work_item_notification --env {environment}
