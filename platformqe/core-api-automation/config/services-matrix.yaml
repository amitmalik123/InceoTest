global:
  defaultPool:
    name: ewm20-docker-build-agent-inc-dev
  pythonVersion: '3.10'
  defaultEnvironments:
  - TSADEV
  - TSATEST
  - TSASILO
  defaultTestType: functional
  parallelExecution:
    maxParallel: 5
    timeoutInMinutes: 60
  reportRetention:
    daysToKeep: 30
    artifactsToKeep: 50
