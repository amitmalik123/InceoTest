# AP Stage Environment Configuration
environment: apstage

applications:
  adhesion:
    name: "adhesion"
    # Test/login domain used by Playwright recordings
    login_url: "https://testlogin.adhesionwealth.com/"
    home_url: "https://apstage.adhesionwealth.com/"
    login_page_class: "LoginPage"
    timeout: 30000

application:
  base_url: "https://apstage.adhesionwealth.com/"
  login_url: "https://testlogin.adhesionwealth.com/"
  timeout: 30000

browser:
  browser_type: "chromium"
  headless: false
  slow_mo: 0
  viewport:
    width: 1280
    height: 720
  args:
    - "--start-maximized"

test:
  screenshot_on_failure: true
  screenshot_each_step: false
  video: "on"
  trace: "retain-on-failure"

reporting:
  allure_results: "reports/allure-results"
  html_report: "reports/pytest_report.html"

data:
  test_data_csv: "data/test_data.apstage.csv"
  test_data_excel: "data/APStage_data.xlsx"

api:
  auth_token: ""

database:
  vault_databases: {}

auth:
  # Concurrency for the auth runner. Set to empty string for unlimited.
  login_concurrency: 3
  # Timeout (ms) for individual login operations.
  login_timeout_ms: 60000
