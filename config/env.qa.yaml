# QA Environment Configuration

# Multiple application configurations
applications:
  ewm:
    name: "ewm"
    login_url: "https://wrmqa.schwabplan.com/ewmLogin/account/login"
    home_url: "https://wrmqa.schwabplan.com/en.aspx"
    login_page_class: "LoginPage"
    timeout: 30000

# Default application (for backward compatibility)
application:
  base_url: "https://wrmqa.schwabplan.com/"
  timeout: 30000  # milliseconds

# Test settings
test:
  screenshot_each_step: false  # Enable to capture screenshots after every BDD step

# Outlook Email (IMAP – password should be in Key Vault or .env)
outlook:
  email: ""                              # your Outlook email address
  password: ""                            # password or App Password (prefer Key Vault / .env)
  imap_server: "outlook.office365.com"    # change for on-prem Exchange
  imap_port: 993

# Data
data:
  test_data_csv: "data/test_data.qa.csv"
