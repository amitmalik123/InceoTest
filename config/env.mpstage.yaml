# MP Stage Environment Configuration
environment: mpstage

applications:
  ewm:
    name: "ewm"
    login_url: "https://mpstage.adhesionwealth.com/ewmLogin/account/login"
    home_url: "https://mpstage.adhesionwealth.com/en.aspx"
    login_page_class: "AdhesionLoginPage"
    timeout: 30000

application:
  base_url: "https://mpstage.adhesionwealth.com/"
  login_url: "https://mpstage.adhesionwealth.com/ewmLogin/account/login"
  timeout: 30000

browser:
  browser_type: "chromium"
  headless: false
  slow_mo: 0
  viewport:
    width: 1280
    height: 720
  args:
    - "--start-maximized"

test:
  screenshot_on_failure: true
  screenshot_each_step: false
  video: "on"
  trace: "retain-on-failure"

reporting:
  allure_results: "reports/allure-results"
  html_report: "reports/pytest_report.html"

data:
  test_data_csv: "data/test_data.mpstage.csv"
  test_data_excel: "data/MPStage_data.xlsx"

api:
  auth_token: ""

database:
  vault_databases: {}

auth:
  # Concurrency for the auth runner. Set to empty string for unlimited.
  login_concurrency: 3
  # Timeout (ms) for individual login operations.
  login_timeout_ms: 60000
