# Test12 Environment Configuration
environment: test12

# Application settings
application:
  base_url: "https://test12.ewealthmanager.com/"
  login_url: "https://test12.ewealthmanager.com/ewmLogin/account/login"
  timeout: 30000  # milliseconds

# Browser settings
browser:
  browser_type: "chromium"  # chromium, firefox, webkit
  headless: false
  slow_mo: 0
  viewport:
    width: 1280
    height: 720
  args:
    - "--start-maximized"

# Test settings
test:
  screenshot_on_failure: true
  screenshot_each_step: false  # Enable to capture screenshots after every BDD step
  video: "on"  # on, off, retain-on-failure
  trace: "retain-on-failure"  # on, off, retain-on-failure

# Reporting
reporting:
  allure_results: "reports/allure-results"
  html_report: "reports/pytest_report.html"

# Data
data:
  test_data_csv: "data/test_data.test12.csv"

# Database settings
database:
  # ── All database connections use connection strings from Azure Key Vault ──
  # The pipeline's AzureKeyVault@2 task fetches secrets and maps them to env vars.
  # Python never calls Key Vault directly — it just reads os.getenv().
  # For local dev, set these env vars in the .env file.
  # No username/password needed — connection strings contain everything.
  vault_databases:
    transfer:
      env_var: "TRANSFER_CONNECTION_STRING"
      secret_name: "transfer-connection-string"
      driver: "{ODBC Driver 17 for SQL Server}"
    accountdistributions:
      env_var: "ACCOUNTDISTRIBUTIONS_CONNECTION_STRING"
      secret_name: "accoundistributions-connection-string"
      driver: "{ODBC Driver 17 for SQL Server}"
    crm:
      env_var: "CRM_DB_CONNECTION_STRING"
      secret_name: "crm-db-connection-string"
      driver: "{ODBC Driver 17 for SQL Server}"
    billing:
      env_var: "AM_BILLING_CONNECTION_STRING"
      secret_name: "am-billing-connection-string"
      driver: "{ODBC Driver 17 for SQL Server}"
