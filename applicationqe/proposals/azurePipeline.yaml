pool:
  name: "ubuntu2204-qa"
  timeoutInMinutes: 10

trigger: none

# -----------------------------
# Scheduled triggers
# -----------------------------
schedules:
  - cron: "30 20 * * *" # 12:00 PM PST → Test11
    displayName: "Schedule for Test11"
    branches:
      include:
        - playwrightaaron
    always: true

# -----------------------------
# Parameters for Manual Runs
# -----------------------------
parameters:
  - name: environment
    displayName: "Target Environment (manual run)"
    type: string
    default: "test11"
    values:
      - test11
      - test10
      - silo

  - name: tag
    displayName: "Cucumber Tag to Run"
    type: string
    default: "@smokeTest"

  - name: threadCount
    displayName: "Number of Threads"
    type: string
    default: "2"

  - name: runnerFile
    displayName: "Runner File"
    type: string
    default: "*"

# -----------------------------
# Job Section
# -----------------------------
jobs:
  - job: RunPlaywrightTests
    displayName: "Run Playwright Tests"
    timeoutInMinutes: 30

    variables:
      buildPath: "$(Build.SourcesDirectory)"
      proposalsPath: "$(Build.SourcesDirectory)/applicationqe/proposals"
      environment: ${{ parameters.environment }}
      allureResultsDir: "$(Build.SourcesDirectory)/applicationqe/proposals/target/allure-results"
      allureReportDir: "$(Build.SourcesDirectory)/applicationqe/proposals/target/allure-report"
      allureToolsDir: "$(Build.ArtifactStagingDirectory)/allure-tools"
      INFLUXDB_URL: "http://azncc03perf.corp.local:8086"
      INFLUXDB_ORG: "MF"
      INFLUXDB_BUCKET: "AutomationData"
      INFLUXDB_TOKEN: "$(InfluxDBToken)"

    steps:
      - checkout: self
        clean: true

      - script: |
          echo "Determining environment and test settings dynamically..."
          if [ "$(Build.Reason)" = "Manual" ]; then
            echo "##vso[task.setvariable variable=environment]${{ parameters.environment }}"
            echo "##vso[task.setvariable variable=tag]${{ parameters.tag }}"
            echo "##vso[task.setvariable variable=threadCount]${{ parameters.threadCount }}"
            echo "##vso[task.setvariable variable=runnerFile]${{ parameters.runnerFile }}"
          else
            echo "##vso[task.setvariable variable=environment]test11"
            echo "##vso[task.setvariable variable=tag]@smokeTest"
            echo "##vso[task.setvariable variable=threadCount]2"
            echo "##vso[task.setvariable variable=runnerFile]*"
          fi

        displayName: "Set Environment Variables Dynamically"

      - script: |
          echo "##vso[task.setvariable variable=ENVIRONMENT]$(environment)"
        displayName: "Set Playwright Environment Variables"

      - script: |
          echo "Print Parameters"
          echo "Environment: $(environment)"
          echo "ThreadCount: $(threadCount)"
        displayName: "Print Parameters"

      - script: |
          echo "Building Playwright test command..."
          # DON'T override reporters on command line - let playwright.config.ts handle all reporters
          # This ensures junit, allure-playwright, and html reporters all get proper options from config
          TEST_CMD="npx playwright test"

          echo "Final command: $TEST_CMD"
          echo "##vso[task.setvariable variable=TEST_CMD]$TEST_CMD"
        displayName: "Build Playwright Command"
        workingDirectory: $(Build.SourcesDirectory)/applicationqe/proposals
        continueOnError: false

      - task: NodeTool@0
        inputs:
          versionSpec: "22.x"
        displayName: "Install Node.js"

      - script: npm ci --ignore-scripts
        workingDirectory: $(Build.SourcesDirectory)/applicationqe/proposals
        displayName: "Install Dependencies"

      - script: npx playwright install chromium
        workingDirectory: $(Build.SourcesDirectory)/applicationqe/proposals
        displayName: "Install Playwright Browsers"
        continueOnError: false

      - script: |
          echo "Checking for required system libraries..."
          ldd /home/amkbuild/myagent3/_work/31/s/node_modules/playwright/.cache/chromium-*/chrome-linux/chrome 2>/dev/null | grep "not found" | head -5 || echo "Browser appears ready"
        displayName: "Verify Browser Dependencies"
        continueOnError: true

      - script: |
          echo "Installing Allure CLI into tools folder..."
          mkdir -p $(allureToolsDir)
          npm install allure-commandline --prefix $(allureToolsDir)
          echo "Adding Allure CLI to PATH for this step..."
          export PATH="$(allureToolsDir)/node_modules/.bin:$PATH"
          # Also tell the Azure agent to prepend the path for subsequent tasks
          echo "##vso[task.prependpath]$(allureToolsDir)/node_modules/.bin"
          echo "Verifying Allure CLI installation..."
          # Help debug if the binary is missing
          if ! command -v allure >/dev/null 2>&1; then
            echo "Allure binary not found in PATH. Listing bin folder contents:"
            ls -la "$(allureToolsDir)/node_modules/.bin" || true
          fi
          allure --version
        displayName: "Install and Verify Allure CLI"

      - script: |
          mkdir -p "$(proposalsPath)/target/allure-results"
          echo "========================================"
          echo "PLAYWRIGHT TEST EXECUTION START"
          echo "========================================"
          echo "Test Command: $(TEST_CMD)"
          echo "Environment: $(environment)"
          echo "Build Path: $(buildPath)"
          echo "Proposals Path: $(proposalsPath)"
          echo "Allure Results Dir: $(allureResultsDir)"
          echo "========================================"
          echo ""
          echo "Setting up environment variables..."
          export ALLURE_RESULTS_DIR="$(allureResultsDir)"
          export CI=true
          echo "✓ ALLURE_RESULTS_DIR=$ALLURE_RESULTS_DIR"
          echo "✓ CI=$CI"
          echo ""
          echo "Current working directory: $(pwd)"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo ""
          echo "Executing: $(TEST_CMD)"
          echo "========================================"
          echo ""
          eval "$(TEST_CMD)" 2>&1 || TEST_EXIT_CODE=$? || true
          echo ""
          echo "========================================"
          echo "Test Execution Exit Code: ${TEST_EXIT_CODE:-0}"
          echo "========================================"
          echo "##vso[task.setvariable variable=TEST_EXIT_CODE]${TEST_EXIT_CODE:-0}"
          echo ""
          echo "Checking for generated reports..."
          echo "Looking for JUnit XML files:"
          find . -name "junit*.xml" -type f 2>/dev/null | head -10 || echo "No JUnit files found"
          echo ""
          echo "Listing Allure results:"
          ls -la $(allureResultsDir) 2>/dev/null || echo "Allure results directory not found"
          echo ""
          echo "Listing Playwright reports:"
          ls -la $(proposalsPath)/playwright-report 2>/dev/null || echo "Playwright report directory not found"
        displayName: "Run Playwright Tests with Allure"
        workingDirectory: $(Build.SourcesDirectory)/applicationqe/proposals
        continueOnError: true

      - script: |
          echo "Checking for JUnit test results..."
          echo "Looking in: $(buildPath)/applicationqe/proposals"
          find $(buildPath)/applicationqe/proposals -type f -name "*.xml" | grep -E "(junit|test)" | head -20 || echo "No XML files found"
          echo "---"
          echo "test-results contents:"
          ls -la $(buildPath)/applicationqe/proposals/test-results 2>/dev/null || echo "test-results directory not found"
          echo "---"
          echo "Current directory contents:"
          ls -la $(buildPath)/applicationqe/proposals 2>/dev/null | grep -E "(junit|test-results|xml|playwright)" || echo "No matching files found"
          echo "---"
          echo "Copying test results to expected location..."
          mkdir -p $(buildPath)/test-results
          cp -r $(buildPath)/applicationqe/proposals/test-results/* $(buildPath)/test-results 2>/dev/null || echo "No test-results to copy"
          cp -r $(buildPath)/applicationqe/proposals/playwright-report $(buildPath)/playwright-report 2>/dev/null || echo "No playwright-report to copy"
        displayName: "Debug Test Results Location"
        condition: always()
        continueOnError: true

      - script: |
          echo "Checking Allure Results Directory..."
          echo "Results Dir: $(allureResultsDir)"
          ls -la $(allureResultsDir) 2>/dev/null || echo "Results dir not found"
        displayName: "Debug Allure Results Directory"
        condition: always()

      - script: |
          mkdir -p "$(proposalsPath)/target/allure-report"
          echo "Allure Report Directory created: $(proposalsPath)/target/allure-report"
        displayName: "Create Allure Report Directory"

      - script: |
          echo "Checking for Allure results..."
          # Check proposals allure-results folder
          SRC_DIR="$(proposalsPath)/target/allure-results"
          ALT_DIR="$(proposalsPath)/allure-results"
          REPORT_DIR="$(proposalsPath)/target/allure-report"

          if [ ! -d "$SRC_DIR" ] || [ -z "$(ls -A "$SRC_DIR" 2>/dev/null)" ]; then
            if [ -d "$ALT_DIR" ] && [ -n "$(ls -A "$ALT_DIR" 2>/dev/null)" ]; then
              echo "Using alternate Allure results directory: $ALT_DIR"
              mkdir -p "$SRC_DIR"
              cp -r "$ALT_DIR"/* "$SRC_DIR/" || true
              echo "Copied alternate results into staging: $SRC_DIR"
            else
              echo "##vso[task.logissue type=warning]No Allure results found in $SRC_DIR or $ALT_DIR. Report generation skipped."
              exit 0
            fi
          fi

          echo "Generating Allure report from: $SRC_DIR"
          allure generate "$SRC_DIR" --clean -o "$REPORT_DIR" --single-file
          echo "Report generated at: $REPORT_DIR"
          ls -la "$REPORT_DIR" 2>/dev/null || echo "Report dir not found"
        displayName: "Generate Allure Report"
        condition: always()

      - script: |
          echo "Verifying report directories before publish..."
          echo "Results Dir: $(allureResultsDir)"
          echo "Report Dir: $(allureReportDir)"
          ls -la $(allureResultsDir) 2>/dev/null || echo "Results dir not found"
          ls -la $(allureReportDir) 2>/dev/null || echo "Report dir not found"
        displayName: "Verify Report Paths"
        condition: always()

      - script: |
          echo "Generating JUnit report from test results..."
          echo ""
          
          # Define paths
          SRC_TEST_RESULTS="$(proposalsPath)/test-results"
          SRC_JUNIT="$(proposalsPath)/test-results/junit-report.xml"
          DEST_DIR="$(buildPath)/test-results"
          DEST_JUNIT="$(buildPath)/test-results/junit-report.xml"
          
          echo "Source junit: $SRC_JUNIT"
          echo "Destination junit: $DEST_JUNIT"
          echo ""
          
          # Step 1: Check if Playwright generated the junit report
          if [ -f "$SRC_JUNIT" ]; then
            echo "✓ Found junit-report.xml from Playwright"
            echo "Copying to build root..."
            mkdir -p "$DEST_DIR"
            cp "$SRC_JUNIT" "$DEST_JUNIT"
            echo "✓ JUnit report copied to: $DEST_JUNIT"
            echo ""
            echo "Report details:"
            ls -lh "$DEST_JUNIT"
            echo ""
            echo "Report content (first 30 lines):"
            head -30 "$DEST_JUNIT"
          else
            echo "⚠ junit-report.xml not found from Playwright at $SRC_JUNIT"
            echo ""
            echo "Checking what files exist in proposals..."
            ls -la "$(proposalsPath)" 2>/dev/null | grep -E "(test|junit|xml)" || echo "No test-related files found"
            echo ""
            echo "Searching for any junit/xml files in proposals..."
            find "$(proposalsPath)" -name "*.xml" -type f 2>/dev/null | head -20 || echo "No XML files found"
            echo ""
            
            # Step 2: If Playwright didn't generate it, create from Allure results if available
            echo "Attempting to extract test count from Allure results..."
            ALLURE_RESULTS_DIR="$(allureResultsDir)"
            
            if [ -d "$ALLURE_RESULTS_DIR" ] && [ ! -z "$(ls -A "$ALLURE_RESULTS_DIR" 2>/dev/null)" ]; then
              echo "✓ Found Allure results, extracting test statistics..."
              
              # Count test results from Allure JSON files
              TEST_COUNT=$(find "$ALLURE_RESULTS_DIR" -name "*-result.json" -type f 2>/dev/null | wc -l)
              FAILED_COUNT=$(find "$ALLURE_RESULTS_DIR" -name "*-result.json" -exec grep -l '"status":"failed"' {} \; 2>/dev/null | wc -l)
              PASSED_COUNT=$((TEST_COUNT - FAILED_COUNT))
              SKIPPED_COUNT=$(find "$ALLURE_RESULTS_DIR" -name "*-result.json" -exec grep -l '"status":"skipped"' {} \; 2>/dev/null | wc -l)
              
              echo "  Tests: $TEST_COUNT"
              echo "  Passed: $PASSED_COUNT"
              echo "  Failed: $FAILED_COUNT"
              echo "  Skipped: $SKIPPED_COUNT"
              echo ""
              echo "Creating JUnit report from Allure results..."
              
              mkdir -p "$DEST_DIR"
              
              # Generate JUnit XML from Allure results
              printf '<?xml version="1.0" encoding="UTF-8"?>\n' > "$DEST_JUNIT"
              printf '<testsuites name="Playwright Test Results" tests="%d" failures="%d" skipped="%d" time="0.000">\n' "$TEST_COUNT" "$FAILED_COUNT" "$SKIPPED_COUNT" >> "$DEST_JUNIT"
              printf '  <testsuite name="Playwright Tests" tests="%d" failures="%d" skipped="%d" time="0.000">\n' "$TEST_COUNT" "$FAILED_COUNT" "$SKIPPED_COUNT" >> "$DEST_JUNIT"
              
              # Parse Allure results and add test cases
              find "$ALLURE_RESULTS_DIR" -name "*-result.json" -type f 2>/dev/null | while read -r result_file; do
                TEST_NAME=$(grep -o '"name":"[^"]*' "$result_file" | head -1 | cut -d'"' -f4 || echo "Unknown Test")
                STATUS=$(grep -o '"status":"[^"]*' "$result_file" | head -1 | cut -d'"' -f4 || echo "unknown")
                
                if [ "$STATUS" = "passed" ]; then
                  printf '    <testcase classname="Playwright" name="%s" time="0.000"></testcase>\n' "$TEST_NAME" >> "$DEST_JUNIT"
                elif [ "$STATUS" = "failed" ]; then
                  printf '    <testcase classname="Playwright" name="%s" time="0.000">\n' "$TEST_NAME" >> "$DEST_JUNIT"
                  printf '      <failure message="Test failed"></failure>\n' >> "$DEST_JUNIT"
                  printf '    </testcase>\n' >> "$DEST_JUNIT"
                elif [ "$STATUS" = "skipped" ]; then
                  printf '    <testcase classname="Playwright" name="%s" time="0.000">\n' "$TEST_NAME" >> "$DEST_JUNIT"
                  printf '      <skipped></skipped>\n' >> "$DEST_JUNIT"
                  printf '    </testcase>\n' >> "$DEST_JUNIT"
                fi
              done
              
              printf '    <properties>\n' >> "$DEST_JUNIT"
              printf '      <property name="source" value="Playwright Allure Results"/>\n' >> "$DEST_JUNIT"
              printf '    </properties>\n' >> "$DEST_JUNIT"
              printf '  </testsuite>\n' >> "$DEST_JUNIT"
              printf '</testsuites>\n' >> "$DEST_JUNIT"
              
              echo "✓ JUnit report created from Allure results"
              echo ""
              echo "Report details:"
              ls -lh "$DEST_JUNIT"
            else
              echo "✗ No Allure results found, creating empty JUnit report..."
              mkdir -p "$DEST_DIR"
              
              printf '<?xml version="1.0" encoding="UTF-8"?>\n' > "$DEST_JUNIT"
              printf '<testsuites name="Playwright Test Results" tests="0" failures="0" skipped="0" time="0.000">\n' >> "$DEST_JUNIT"
              printf '  <testsuite name="Playwright Tests" tests="0" failures="0" skipped="0" time="0.000">\n' >> "$DEST_JUNIT"
              printf '    <properties>\n' >> "$DEST_JUNIT"
              printf '      <property name="note" value="No test results available - Check Allure report for details"/>\n' >> "$DEST_JUNIT"
              printf '    </properties>\n' >> "$DEST_JUNIT"
              printf '  </testsuite>\n' >> "$DEST_JUNIT"
              printf '</testsuites>\n' >> "$DEST_JUNIT"
              
              echo "✓ Empty JUnit report created (Check Allure report for test details)"
            fi
          fi
          
          echo ""
          echo "Final JUnit report location: $DEST_JUNIT"
          echo "File exists: $([ -f "$DEST_JUNIT" ] && echo 'YES' || echo 'NO')"
        displayName: "Generate JUnit Report for Publishing"
        condition: always()
        continueOnError: true

      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.x"
        displayName: "Setup Python for InfluxDB Reporter"

      - script: |
          echo "Installing InfluxDB client..."
          pip install -r $(Build.SourcesDirectory)/applicationqe/proposals/requirements.txt
        displayName: "Install Python Dependencies"
        continueOnError: false

      - script: |
          echo "Pushing test metrics to InfluxDB..."
          export INFLUXDB_URL="${INFLUXDB_URL}"
          export INFLUXDB_TOKEN="${INFLUXDB_TOKEN}"
          export INFLUXDB_ORG="${INFLUXDB_ORG}"
          export INFLUXDB_BUCKET="${INFLUXDB_BUCKET}"
          export ALLURE_RESULTS_DIR="$(allureResultsDir)"
          export ENVIRONMENT="$(environment)"
          export BUILD_ID="$(Build.BuildId)"
          export BUILD_REASON="$(Build.Reason)"
          export SYSTEM_TEAMFOUNDATIONCOLLECTIONURI="$(System.TeamFoundationCollectionUri)"
          export SYSTEM_TEAMPROJECT="$(System.TeamProject)"
          export BUILD_BUILDID="$(Build.BuildId)"

          python3 $(Build.SourcesDirectory)/applicationqe/proposals/framework/reporter/influx_reporter.py
        displayName: "Push Metrics to InfluxDB"
        condition: always()
        continueOnError: true
        env:
          INFLUXDB_URL: $(INFLUXDB_URL)
          INFLUXDB_TOKEN: $(INFLUXDB_TOKEN)
          INFLUXDB_ORG: $(INFLUXDB_ORG)
          INFLUXDB_BUCKET: $(INFLUXDB_BUCKET)

      - task: PublishBuildArtifacts@1
        displayName: "Publish Test Results Directory"
        inputs:
          PathtoPublish: "$(buildPath)/test-results"
          ArtifactName: "TestResults"
          publishLocation: "Container"
        condition: always()
        continueOnError: true

      - task: PublishTestResults@2
        displayName: "Publish JUnit Test Results to Azure Pipelines"
        inputs:
          testResultsFormat: "JUnit"
          testResultsFiles: "$(buildPath)/test-results/junit-report.xml"
          mergeTestResults: true
          failTaskOnFailedTests: false
          publishRunAttachments: true
        condition: always()
        continueOnError: true

      - task: PublishBuildArtifacts@1
        displayName: "Publish Playwright HTML Report"
        inputs:
          PathtoPublish: "$(proposalsPath)/playwright-report"
          ArtifactName: "PlaywrightReport"
          publishLocation: "Container"
        condition: always()

      - task: PublishBuildArtifacts@1
        displayName: "Publish Allure Report"
        inputs:
          PathtoPublish: "$(allureReportDir)"
          ArtifactName: "AllureReport"
          publishLocation: "Container"
        condition: always()

      - task: PublishBuildArtifacts@1
        displayName: "Publish Allure Results Data"
        inputs:
          PathtoPublish: "$(allureResultsDir)"
          ArtifactName: "AllureResults"
          publishLocation: "Container"
        condition: always()

      - script: |
          echo "✓ Test Execution Complete"
          echo "Reports are available in the build artifacts:"
          echo "  - Playwright HTML Report: PlaywrightReport"
          echo "  - Allure Report: AllureReport"
          echo "  - Allure Results Data: AllureResults"
          echo "  - Test Results Directory: TestResults"
          echo "  - Test Results: Available in the Tests tab of this pipeline"
        displayName: "Print Test Report Summary"
        condition: always()
