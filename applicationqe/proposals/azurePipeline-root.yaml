pool:
  name: "ubuntu2204-qa"
  timeoutInMinutes: 10

trigger: none

# -----------------------------
# Scheduled triggers
# -----------------------------
schedules:
  - cron: "30 20 * * *" # 12:00 PM PST → Test11
    displayName: "Schedule for Test11"
    branches:
      include:
        - playwrightaaron
    always: true

# -----------------------------
# Parameters for Manual Runs
# -----------------------------
parameters:
  - name: environment
    displayName: "Target Environment (manual run)"
    type: string
    default: "test11"
    values:
      - test11
      - test10
      - silo

  - name: threadCount
    displayName: "Number of Threads"
    type: string
    default: "2"

  - name: runnerFile
    displayName: "Runner File"
    type: string
    default: "*"

  - name: scriptsPath
    displayName: "Path to scripts folder (relative to repo root)"
    type: string
    default: "applicationqe/proposals"

  - name: allureResultsPath
    displayName: "Path to Allure results directory (relative to repo root)"
    type: string
    default: "applicationqe/proposals/target/allure-results"

# -----------------------------
# Job Section
# -----------------------------
jobs:
  - job: RunPlaywrightTests
    displayName: "Run Playwright Tests"
    timeoutInMinutes: 30

    variables:
      buildPath: "$(Build.SourcesDirectory)"
      scriptsPath: "$(Build.SourcesDirectory)/${{ parameters.scriptsPath }}"
      environment: ${{ parameters.environment }}
      allureResultsDir: "$(Build.SourcesDirectory)/${{ parameters.allureResultsPath }}"
      allureReportDir: "$(Build.SourcesDirectory)/${{ parameters.allureResultsPath }}/../allure-report"
      allureToolsDir: "$(Build.ArtifactStagingDirectory)/allure-tools"
      INFLUXDB_URL: "http://azncc03perf.corp.local:8086"
      INFLUXDB_ORG: "MF"
      INFLUXDB_BUCKET: "AutomationData"
      INFLUXDB_TOKEN: "$(InfluxDBToken)"

    steps:
      - checkout: self
        clean: true

      - script: |
          echo "Determining environment and test settings dynamically..."
          if [ "$(Build.Reason)" = "Manual" ]; then
            echo "##vso[task.setvariable variable=environment]${{ parameters.environment }}"
            echo "##vso[task.setvariable variable=threadCount]${{ parameters.threadCount }}"
            echo "##vso[task.setvariable variable=runnerFile]${{ parameters.runnerFile }}"
          else
            echo "##vso[task.setvariable variable=environment]test11"
            echo "##vso[task.setvariable variable=threadCount]2"
            echo "##vso[task.setvariable variable=runnerFile]*"
          fi

        displayName: "Set Environment Variables Dynamically"

      - script: |
          echo "##vso[task.setvariable variable=ENVIRONMENT]$(environment)"
        displayName: "Set Playwright Environment Variables"

      - script: |
          echo "Print Parameters"
          echo "Environment: $(environment)"
          echo "ThreadCount: $(threadCount)"
        displayName: "Print Parameters"

      - script: |
          echo "Building Playwright test command..."
          TEST_CMD="npx playwright test --reporter=allure-playwright,html,junit"

          echo "Final command: $TEST_CMD"
          echo "##vso[task.setvariable variable=TEST_CMD]$TEST_CMD"
        displayName: "Build Playwright Command"
        workingDirectory: $(scriptsPath)
        continueOnError: false

      - task: NodeTool@0
        inputs:
          versionSpec: "22.x"
        displayName: "Install Node.js"

      - script: npm ci --ignore-scripts
        workingDirectory: $(scriptsPath)
        displayName: "Install Dependencies"

      - script: npx playwright install chromium
        workingDirectory: $(scriptsPath)
        displayName: "Install Playwright Browsers"
        continueOnError: false

      - script: |
          echo "Checking for required system libraries..."
          ldd /home/amkbuild/myagent3/_work/31/s/node_modules/playwright/.cache/chromium-*/chrome-linux/chrome 2>/dev/null | grep "not found" | head -5 || echo "Browser appears ready"
        displayName: "Verify Browser Dependencies"
        continueOnError: true

      - script: |
          echo "Installing Allure CLI into tools folder..."
          mkdir -p $(allureToolsDir)
          npm install allure-commandline --prefix $(allureToolsDir)
          echo "Adding Allure CLI to PATH for this step..."
          export PATH="$(allureToolsDir)/node_modules/.bin:$PATH"
          # Also tell the Azure agent to prepend the path for subsequent tasks
          echo "##vso[task.prependpath]$(allureToolsDir)/node_modules/.bin"
          echo "Verifying Allure CLI installation..."
          # Help debug if the binary is missing
          if ! command -v allure >/dev/null 2>&1; then
            echo "Allure binary not found in PATH. Listing bin folder contents:"
            ls -la "$(allureToolsDir)/node_modules/.bin" || true
          fi
          allure --version
        displayName: "Install and Verify Allure CLI"

      - script: |
          echo "Setting up environment variables..."
          export ALLURE_RESULTS_DIR="$(scriptsPath)/target/allure-results"
          export CI=true
          echo "✓ ALLURE_RESULTS_DIR=$ALLURE_RESULTS_DIR"
          echo "✓ CI=$CI"
          echo ""
          echo "Current working directory: $(pwd)"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo ""
          echo "Executing: $(TEST_CMD)"
          echo "========================================"
          echo ""
          eval "$(TEST_CMD)" 2>&1 || TEST_EXIT_CODE=$? || true
          echo ""
          echo "========================================"
          echo "Test Execution Exit Code: ${TEST_EXIT_CODE:-0}"
          echo "========================================"
          echo "##vso[task.setvariable variable=TEST_EXIT_CODE]${TEST_EXIT_CODE:-0}"
          echo ""
          echo "Checking for generated reports..."
          echo "Looking for JUnit XML files:"
          find . -name "junit*.xml" -type f 2>/dev/null | head -10 || echo "No JUnit files found"
          echo ""
          echo "Listing Allure results:"
          ls -la $(allureResultsDir) 2>/dev/null || echo "Allure results directory not found"
          echo ""
          echo "Listing Playwright reports:"
          ls -la $(scriptsPath)/playwright-report 2>/dev/null || echo "Playwright report directory not found"
        displayName: "Run Playwright Tests with Allure"
        workingDirectory: $(scriptsPath)
        continueOnError: true

      - script: |
          echo "Debugging ALLURE_RESULTS_DIR after test execution..."
          echo "ALLURE_RESULTS_DIR: $(allureResultsDir)"
          if [ -d "$(allureResultsDir)" ]; then
            echo "Contents of ALLURE_RESULTS_DIR:"
            ls -la $(allureResultsDir)
          else
            echo "ALLURE_RESULTS_DIR does not exist."
          fi
        displayName: "Debug ALLURE_RESULTS_DIR After Tests"
        condition: always()
        continueOnError: true

      - script: |
          echo "Verifying ALLURE_RESULTS_DIR before Playwright test execution..."
          echo "ALLURE_RESULTS_DIR: $(ALLURE_RESULTS_DIR)"
          if [ -d "$(ALLURE_RESULTS_DIR)" ]; then
            echo "ALLURE_RESULTS_DIR exists and contains the following files:"
            ls -la $(ALLURE_RESULTS_DIR)
          else
            echo "ALLURE_RESULTS_DIR does not exist or is empty."
          fi
        displayName: "Verify ALLURE_RESULTS_DIR"
        condition: always()
        continueOnError: true

      - script: |
          echo "Checking for JUnit test results..."
          echo "Looking in: $(buildPath)"
          find $(buildPath) -type f -name "*.xml" | grep -E "(junit|test)" | head -20 || echo "No XML files found"
          echo "---"
          echo "test-results contents:"
          ls -la $(buildPath)/test-results 2>/dev/null || echo "test-results directory not found"
          echo "---"
          echo "Current directory contents:"
          ls -la $(buildPath) 2>/dev/null | grep -E "(junit|test-results|xml|playwright)" || echo "No matching files found"
          echo "---"
          echo "Copying results from scripts path to build root..."
          mkdir -p $(buildPath)/target/allure-results
          cp -r $(scriptsPath)/target/allure-results/* $(buildPath)/target/allure-results 2>/dev/null || echo "No allure-results to copy"
          cp -r $(scriptsPath)/playwright-report $(buildPath)/playwright-report 2>/dev/null || echo "No playwright-report to copy"
          echo "Copy completed"
        displayName: "Debug Test Results Location"
        condition: always()
        continueOnError: true

      - script: |
          echo "Checking Allure Results Directory..."
          echo "Results Dir: $(allureResultsDir)"
          ls -la $(allureResultsDir) 2>/dev/null || echo "Results dir not found"
        displayName: "Debug Allure Results Directory"
        condition: always()

      - script: |
          mkdir -p "$(buildPath)/target/allure-report"
          echo "Allure Report Directory created: $(buildPath)/target/allure-report"
        displayName: "Create Allure Report Directory"

      - script: |
          echo "Checking for Allure results..."
          # Check both scripts path and root for allure-results
          SCRIPTS_SRC_DIR="$(scriptsPath)/target/allure-results"
          ROOT_SRC_DIR="$(buildPath)/target/allure-results"
          ALT_DIR="$(buildPath)/allure-results"
          REPORT_DIR="$(buildPath)/target/allure-report"

          # Try to copy from scripts path if not already in root
          if [ -d "$SCRIPTS_SRC_DIR" ] && [ -n "$(ls -A "$SCRIPTS_SRC_DIR" 2>/dev/null)" ]; then
            echo "Copying results from scripts path..."
            mkdir -p "$ROOT_SRC_DIR"
            cp -r "$SCRIPTS_SRC_DIR"/* "$ROOT_SRC_DIR/" || true
            echo "Copied results from: $SCRIPTS_SRC_DIR"
          fi

          SRC_DIR="$ROOT_SRC_DIR"

          if [ ! -d "$SRC_DIR" ] || [ -z "$(ls -A "$SRC_DIR" 2>/dev/null)" ]; then
            if [ -d "$ALT_DIR" ] && [ -n "$(ls -A "$ALT_DIR" 2>/dev/null)" ]; then
              echo "Using alternate Allure results directory: $ALT_DIR"
              mkdir -p "$SRC_DIR"
              cp -r "$ALT_DIR"/* "$SRC_DIR/" || true
              echo "Copied alternate results into staging: $SRC_DIR"
            else
              echo "##vso[task.logissue type=warning]No Allure results found in $SRC_DIR or $ALT_DIR. Report generation skipped."
              exit 0
            fi
          fi

          echo "Generating Allure report from: $SRC_DIR"
          allure generate "$SRC_DIR" --clean -o "$REPORT_DIR" --single-file
          echo "Report generated at: $REPORT_DIR"
          ls -la "$REPORT_DIR" 2>/dev/null || echo "Report dir not found"
        displayName: "Generate Allure Report"
        condition: always()

      - script: |
          echo "Verifying report directories before publish..."
          echo "Results Dir: $(allureResultsDir)"
          echo "Report Dir: $(allureReportDir)"
          ls -la $(allureResultsDir) 2>/dev/null || echo "Results dir not found"
          ls -la $(allureReportDir) 2>/dev/null || echo "Report dir not found"
        displayName: "Verify Report Paths"
        condition: always()

      - script: |
          echo "Generating comprehensive JUnit XML report from test execution..."
          mkdir -p $(buildPath)/test-results

          python3 $(scriptsPath)/scripts/generate_junit_report.py \
            "$(allureResultsDir)" \
            "$(buildPath)/test-results/junit-report.xml"

          echo "---Report Preview---"
          head -30 $(buildPath)/test-results/junit-report.xml || echo "Report not found"
        displayName: "Generate JUnit XML Report"
        condition: always()
        continueOnError: true

      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.x"
        displayName: "Setup Python for InfluxDB Reporter"

      - script: |
          echo "Installing InfluxDB client..."
          pip install -r $(scriptsPath)/requirements.txt
        displayName: "Install Python Dependencies"
        continueOnError: false

      - script: |
          echo "Pushing test metrics to InfluxDB..."
          export INFLUXDB_URL="${INFLUXDB_URL}"
          export INFLUXDB_TOKEN="${INFLUXDB_TOKEN}"
          export INFLUXDB_ORG="${INFLUXDB_ORG}"
          export INFLUXDB_BUCKET="${INFLUXDB_BUCKET}"
          export ALLURE_RESULTS_DIR="$(allureResultsDir)"
          export ENVIRONMENT="$(environment)"
          export BUILD_ID="$(Build.BuildId)"
          export BUILD_REASON="$(Build.Reason)"
          export SYSTEM_TEAMFOUNDATIONCOLLECTIONURI="$(System.TeamFoundationCollectionUri)"
          export SYSTEM_TEAMPROJECT="$(System.TeamProject)"
          export BUILD_BUILDID="$(Build.BuildId)"

          python3 $(scriptsPath)/framework/reporter/influx_reporter.py
        displayName: "Push Metrics to InfluxDB"
        condition: always()
        continueOnError: true
        env:
          INFLUXDB_URL: $(INFLUXDB_URL)
          INFLUXDB_TOKEN: $(INFLUXDB_TOKEN)
          INFLUXDB_ORG: $(INFLUXDB_ORG)
          INFLUXDB_BUCKET: $(INFLUXDB_BUCKET)

      - task: PublishBuildArtifacts@1
        displayName: "Publish Test Results Directory"
        inputs:
          PathtoPublish: "$(buildPath)/test-results"
          ArtifactName: "TestResults"
          publishLocation: "Container"
        condition: always()
        continueOnError: true

      - task: PublishTestResults@2
        displayName: "Publish JUnit Test Results to Azure Pipelines"
        inputs:
          testResultsFormat: "JUnit"
          testResultsFiles: "$(buildPath)/test-results/junit-report.xml"
          mergeTestResults: true
          failTaskOnFailedTests: false
          publishRunAttachments: true
        condition: always()
        continueOnError: true
      - task: PublishBuildArtifacts@1
        displayName: "Publish Playwright HTML Report"
        inputs:
          PathtoPublish: "$(scriptsPath)/playwright-report"
          ArtifactName: "PlaywrightReport"
          publishLocation: "Container"
        condition: always()

      - task: PublishBuildArtifacts@1
        displayName: "Publish Allure Report"
        inputs:
          PathtoPublish: "$(allureReportDir)"
          ArtifactName: "AllureReport"
          publishLocation: "Container"
        condition: always()

      - task: PublishBuildArtifacts@1
        displayName: "Publish Allure Results Data"
        inputs:
          PathtoPublish: "$(allureResultsDir)"
          ArtifactName: "AllureResults"
          publishLocation: "Container"
        condition: always()

      - script: |
          echo "✓ Test Execution Complete"
          echo "Reports are available in the build artifacts:"
          echo "  - Playwright HTML Report: PlaywrightReport"
          echo "  - Allure Report: AllureReport"
          echo "  - Allure Results Data: AllureResults"
          echo "  - Test Results Directory: TestResults"
          echo "  - Test Results: Available in the Tests tab of this pipeline"
        displayName: "Print Test Report Summary"
        condition: always()

      - script: |
          echo "Debugging Allure results in scriptsPath before copying..."
          echo "Scripts Path: $(scriptsPath)/target/allure-results"
          ls -la $(scriptsPath)/target/allure-results 2>/dev/null || echo "No Allure results found in scriptsPath"

          echo "Debugging Allure results in buildPath before copying..."
          echo "Build Path: $(buildPath)/target/allure-results"
          ls -la $(buildPath)/target/allure-results 2>/dev/null || echo "No Allure results found in buildPath"

          echo "Copying Allure results from scriptsPath to buildPath..."
          mkdir -p $(buildPath)/target/allure-results
          cp -r $(scriptsPath)/target/allure-results/* $(buildPath)/target/allure-results 2>/dev/null || echo "No Allure results to copy from scriptsPath"

          echo "Debugging Allure results in buildPath after copying..."
          ls -la $(buildPath)/target/allure-results 2>/dev/null || echo "No Allure results found in buildPath after copying"
        displayName: "Debug and Copy Allure Results"
        condition: always()
        continueOnError: true

