# =============================================================================
# PLAYWRIGHT QA AUTOMATION PIPELINE
# =============================================================================
# TEST FILTER REFERENCE:
# =====================
# Authenticated Tests: sub-menus, Accounts, Clients, Strategists, Overview,
#   Insights, Advisor Benefits, Statements & Reports, Strategies, Research,
#   News, Cash, SMA, Guided Portfolios, DAF, Savos, TMS, Business Consulting,
#   Lending, Financial Planning, Retirement Services, Knowledge Base,
#   Contact Us, Tax Resources, Fees, Glossary, Custodial Services,
#   Compliance Resources, Marketing Resources, Events, RMD Resources,
#   Closed, Needs Action, Open Items
# 
# Unauthenticated Tests: Similar filters available
# Unit Tests: Search by test name keywords
# =============================================================================

pool:
  name: 'ubuntu2204-qa'
  timeoutInMinutes: 10
  
trigger: none

# -----------------------------
# Scheduled triggers
# -----------------------------
schedules:
  - cron: "0 21 * * *"      
    displayName: "Schedule for Test11"
    branches:
      include:
        - Playwright_srilu_pipeline
    always: true

# -----------------------------
# Parameters for Manual Runs
# -----------------------------
parameters:
  - name: environment
    displayName: "Target Environment (manual run)"
    type: string    
    default: "test"
    values:
      - test
      - dev

  - name: testProject
    displayName: "Test Project to Run"
    type: string
    default: "all"
    values:
      - all
      - authenticated
      - unauthenticated
      - local
      - unit-tests
      - setup

  - name: testFilter
    displayName: "Test Filter (e.g., 'sub-menus', 'Accounts', 'Clients', 'Strategists', 'Overview', 'Insights', 'Strategies', 'Research', 'Investments', 'Lending', 'Financial Planning', 'Knowledge Base', 'Contact Us', or leave blank for all)"
    type: string
    default: "all"

# -----------------------------
# Job Section
# -----------------------------
jobs:
- job: RunPlaywrightTests
  displayName: "Run Playwright Tests"
  timeoutInMinutes: 60

  variables:
    buildPath: '$(Build.SourcesDirectory)'
    ewmnavbarPath: '$(Build.SourcesDirectory)/applicationqe/ewmnavbar'
    environment: ${{ parameters.environment }}
    allureResultsDir: '$(Build.SourcesDirectory)/applicationqe/ewmnavbar/target/allure-results'
    allureReportDir: '$(Build.SourcesDirectory)/applicationqe/ewmnavbar/target/allure-report'
    allureToolsDir: '$(Build.ArtifactStagingDirectory)/allure-tools'
    INFLUXDB_URL: 'http://azncc03perf.corp.local:8086'
    INFLUXDB_ORG: 'MF'
    INFLUXDB_BUCKET: 'AutomationData'
    INFLUXDB_TOKEN: '$(InfluxDBToken)'

  steps:
  - checkout: self
    clean: true

  - script: |
      echo "Determining environment and test settings dynamically..."
      if [ "$(Build.Reason)" = "Manual" ]; then
        echo "##vso[task.setvariable variable=environment]${{ parameters.environment }}"
        echo "##vso[task.setvariable variable=testProject]${{ parameters.testProject }}"
        echo "##vso[task.setvariable variable=testFilter]${{ parameters.testFilter }}"
      else
        echo "##vso[task.setvariable variable=environment]test"
        echo "##vso[task.setvariable variable=testProject]all"
        echo "##vso[task.setvariable variable=testFilter]"
      fi
 
    displayName: "Set Environment Variables Dynamically"

  - script: |
      echo "##vso[task.setvariable variable=ENVIRONMENT]$(environment)"
      echo "##vso[task.setvariable variable=ENV]$(environment)"
    displayName: "Set Playwright Environment Variables"

  - script: |
      echo "Print Parameters"
      echo "Environment: $(environment)"
      echo "Test Project: $(testProject)"
      echo "Test Filter: $(testFilter)"
    displayName: "Print Parameters"

  - script: |
      echo "Building Playwright test command..."
      TEST_CMD="npx playwright test --reporter=allure-playwright,html,junit"
      
      # Add project filter if not "all"
      if [ "$(testProject)" != "all" ]; then
        # Authenticated tests require setup to run first (dependency)
        if [ "$(testProject)" = "authenticated" ]; then
          TEST_CMD="$TEST_CMD --project=setup --project=authenticated"
          echo "Running setup + authenticated projects (authenticated depends on setup)"
        else
          TEST_CMD="$TEST_CMD --project=$(testProject)"
          echo "Running project: $(testProject)"
        fi
      else
        echo "Running all projects (all projects will run with their dependencies)"
      fi
      
      # Add test name filter if provided and not "all"
      if [ "$(testFilter)" != "all" ] && [ ! -z "$(testFilter)" ]; then
        TEST_CMD="$TEST_CMD --grep $(testFilter)"
        echo "Filtering tests by pattern: $(testFilter)"
      else
        echo "Running all tests (no filter applied)"
      fi
      
      echo "Final command: $TEST_CMD"
      echo "##vso[task.setvariable variable=TEST_CMD]$TEST_CMD"
    displayName: "Build Playwright Command"
    workingDirectory: $(Build.SourcesDirectory)/applicationqe/ewmnavbar
    continueOnError: false

  - task: NodeTool@0
    inputs:
      versionSpec: "22.x"
    displayName: "Install Node.js"

  - script: npm ci --ignore-scripts
    workingDirectory: $(Build.SourcesDirectory)/applicationqe/ewmnavbar
    displayName: "Install Dependencies"

  - script: npx playwright install chromium
    workingDirectory: $(Build.SourcesDirectory)/applicationqe/ewmnavbar
    displayName: "Install Playwright Browsers"
    continueOnError: false

  - script: |
      echo "Checking for required system libraries..."
      ldd /home/amkbuild/myagent3/_work/31/s/node_modules/playwright/.cache/chromium-*/chrome-linux/chrome 2>/dev/null | grep "not found" | head -5 || echo "Browser appears ready"
    displayName: "Verify Browser Dependencies"
    continueOnError: true

  - script: |
      echo "Installing Allure CLI into tools folder..."
      mkdir -p $(allureToolsDir)
      npm install allure-commandline --prefix $(allureToolsDir)
      echo "Adding Allure CLI to PATH for this step..."
      export PATH="$(allureToolsDir)/node_modules/.bin:$PATH"
      # Also tell the Azure agent to prepend the path for subsequent tasks
      echo "##vso[task.prependpath]$(allureToolsDir)/node_modules/.bin"
      echo "Verifying Allure CLI installation..."
      # Help debug if the binary is missing
      if ! command -v allure >/dev/null 2>&1; then
        echo "Allure binary not found in PATH. Listing bin folder contents:"
        ls -la "$(allureToolsDir)/node_modules/.bin" || true
      fi
      allure --version
    displayName: "Install and Verify Allure CLI"

  - script: |
      mkdir -p "$(ewmnavbarPath)/target/allure-results"
      echo "========================================"
      echo "PLAYWRIGHT TEST EXECUTION START"
      echo "========================================"
      echo "Test Command: $(TEST_CMD)"
      echo "Test Project: $(testProject)"
      echo "Test Filter: $(testFilter)"
      echo "Environment: $(environment)"
      echo "Build Path: $(buildPath)"
      echo "EWMNavbar Path: $(ewmnavbarPath)"
      echo "Allure Results Dir: $(allureResultsDir)"
      echo "========================================"
      echo ""
      echo "Setting up environment variables..."
      export ALLURE_RESULTS_DIR="$(allureResultsDir)"
      export CI=true
      export ENV="$(environment)"
      echo "✓ ALLURE_RESULTS_DIR=$ALLURE_RESULTS_DIR"
      echo "✓ CI=$CI"
      echo "✓ ENV=$ENV"
      echo "Current working directory: $(pwd)"
      echo "Node version: $(node --version)"
      echo "NPM version: $(npm --version)"
      echo ""
      echo "Executing: $(TEST_CMD)"
      echo "========================================"
      echo ""
      eval "$(TEST_CMD)" 2>&1 || TEST_EXIT_CODE=$? || true
      echo ""
      echo "========================================"
      echo "Test Execution Exit Code: ${TEST_EXIT_CODE:-0}"
      echo "========================================"
      echo "##vso[task.setvariable variable=TEST_EXIT_CODE]${TEST_EXIT_CODE:-0}"
      echo ""
      echo "Checking for generated reports..."
      echo "Looking for JUnit XML files:"
      find . -name "junit*.xml" -type f 2>/dev/null | head -10 || echo "No JUnit files found"
      echo ""
      echo "Listing Allure results:"
      ls -la $(allureResultsDir) 2>/dev/null || echo "Allure results directory not found"
      echo ""
      echo "Listing Playwright reports:"
      ls -la $(ewmnavbarPath)/playwright-report 2>/dev/null || echo "Playwright report directory not found"
    displayName: "Run Playwright Tests with Allure"
    workingDirectory: $(Build.SourcesDirectory)/applicationqe/ewmnavbar
    continueOnError: true

  - script: |
      echo "Checking for JUnit test results..."
      echo "Looking in: $(buildPath)/applicationqe/ewmnavbar"
      find $(buildPath)/applicationqe/ewmnavbar -type f -name "*.xml" | grep -E "(junit|test)" | head -20 || echo "No XML files found"
      echo "---"
      echo "test-results contents:"
      ls -la $(buildPath)/applicationqe/ewmnavbar/test-results 2>/dev/null || echo "test-results directory not found"
      echo "---"
      echo "Current directory contents:"
      ls -la $(buildPath)/applicationqe/ewmnavbar 2>/dev/null | grep -E "(junit|test-results|xml|playwright)" || echo "No matching files found"
      echo "---"
      echo "Copying test results to expected location..."
      mkdir -p $(buildPath)/test-results
      cp -r $(buildPath)/applicationqe/ewmnavbar/test-results/* $(buildPath)/test-results 2>/dev/null || echo "No test-results to copy"
      cp -r $(buildPath)/applicationqe/ewmnavbar/playwright-report $(buildPath)/playwright-report 2>/dev/null || echo "No playwright-report to copy"
    displayName: "Debug Test Results Location"
    condition: always()
    continueOnError: true

  - script: |
      echo "Checking Allure Results Directory..."
      echo "Results Dir: $(allureResultsDir)"
      if [ -d "$(allureResultsDir)" ]; then
        echo "✓ Directory exists"
        echo "Contents:"
        ls -la $(allureResultsDir) 2>/dev/null | head -20
        echo ""
        echo "Total files in Allure results:"
        find $(allureResultsDir) -type f 2>/dev/null | wc -l
      else
        echo "✗ Directory does NOT exist - will be created during Allure report generation"
      fi
    displayName: "Debug Allure Results Directory"
    condition: always()

  - script: |
      mkdir -p "$(ewmnavbarPath)/target/allure-report"
      echo "Allure Report Directory created: $(ewmnavbarPath)/target/allure-report"
    displayName: "Create Allure Report Directory"

  - script: |
      echo "Checking for Allure results..."
      # Check ewmnavbar allure-results folder
      SRC_DIR="$(allureResultsDir)"
      ALT_DIR="$(ewmnavbarPath)/allure-results"
      REPORT_DIR="$(allureReportDir)"

      if [ ! -d "$SRC_DIR" ] || [ -z "$(ls -A "$SRC_DIR" 2>/dev/null)" ]; then
        if [ -d "$ALT_DIR" ] && [ -n "$(ls -A "$ALT_DIR" 2>/dev/null)" ]; then
          echo "Using alternate Allure results directory: $ALT_DIR"
          mkdir -p "$SRC_DIR"
          cp -r "$ALT_DIR"/* "$SRC_DIR/" || true
          echo "Copied alternate results into staging: $SRC_DIR"
        else
          echo "##vso[task.logissue type=warning]No Allure results found in $SRC_DIR or $ALT_DIR. Report generation skipped."
          exit 0
        fi
      fi

      echo "Generating Allure report from: $SRC_DIR"
      allure generate "$SRC_DIR" --clean -o "$REPORT_DIR" --single-file
      echo "Report generated at: $REPORT_DIR"
      ls -la "$REPORT_DIR" 2>/dev/null || echo "Report dir not found"
    displayName: "Generate Allure Report"
    condition: always()

  - script: |
      echo "Verifying report directories before publish..."
      echo ""
      echo "Test Results (Build Root):"
      if [ -f "$(buildPath)/test-results/junit-report.xml" ]; then
        echo "✓ JUnit Report: $(buildPath)/test-results/junit-report.xml"
        ls -lh $(buildPath)/test-results/junit-report.xml
      else
        echo "⚠ JUnit Report: NOT FOUND"
      fi
      
      echo ""
      echo "Allure Report:"
      if [ -d "$(allureReportDir)" ]; then
        echo "✓ Report Dir: $(allureReportDir)"
        ls -la $(allureReportDir) 2>/dev/null | head -5
      else
        echo "⚠ Report Dir: NOT FOUND"
      fi
      
      echo ""
      echo "Allure Results:"
      if [ -d "$(allureResultsDir)" ]; then
        echo "✓ Results Dir: $(allureResultsDir)"
        echo "  Files: $(find $(allureResultsDir) -type f 2>/dev/null | wc -l)"
      else
        echo "⚠ Results Dir: NOT FOUND"
      fi
    displayName: "Verify Report Paths"
    condition: always()

  - script: |
      echo "Verifying JUnit report for publishing..."
      
      if [ -f "$(buildPath)/test-results/junit-report.xml" ]; then
        echo "✓ JUnit report found at: $(buildPath)/test-results/junit-report.xml"
        ls -lh $(buildPath)/test-results/junit-report.xml
        echo ""
        echo "Report preview:"
        head -20 $(buildPath)/test-results/junit-report.xml
      else
        echo "⚠ junit-report.xml not found"
        echo ""
        echo "Checking for alternative JUnit files..."
        find $(buildPath)/test-results -name "*.xml" 2>/dev/null || echo "No XML files found"
        echo ""
        echo "Creating fallback JUnit report..."
        mkdir -p $(buildPath)/test-results
        
        cat > $(buildPath)/test-results/junit-report.xml << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<testsuites name="Playwright Test Results" tests="0" failures="0" skipped="0" time="0.000">
  <testsuite name="Playwright Tests" tests="0" failures="0" skipped="0" time="0.000">
    <properties>
      <property name="note" value="No test results available"/>
    </properties>
  </testsuite>
</testsuites>
EOF
        echo "✓ Fallback report created"
      fi
    displayName: "Prepare JUnit Report for Publishing"
    condition: always()
    continueOnError: true

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'
    displayName: "Setup Python for InfluxDB Reporter"

  - script: |
      echo "Installing InfluxDB client..."
      pip install -r $(Build.SourcesDirectory)/applicationqe/ewmnavbar/framework/reporter/requirements.txt
    displayName: "Install Python Dependencies"
    continueOnError: false

  - script: |
      echo "Pushing test metrics to InfluxDB..."
      export INFLUXDB_URL="${INFLUXDB_URL}"
      export INFLUXDB_TOKEN="${INFLUXDB_TOKEN}"
      export INFLUXDB_ORG="${INFLUXDB_ORG}"
      export INFLUXDB_BUCKET="${INFLUXDB_BUCKET}"
      export ALLURE_RESULTS_DIR="$(allureResultsDir)"
      export ENVIRONMENT="$(environment)"
      export BUILD_ID="$(Build.BuildId)"
      export BUILD_REASON="$(Build.Reason)"
      export SYSTEM_TEAMFOUNDATIONCOLLECTIONURI="$(System.TeamFoundationCollectionUri)"
      export SYSTEM_TEAMPROJECT="$(System.TeamProject)"
      export BUILD_BUILDID="$(Build.BuildId)"

      python3 $(Build.SourcesDirectory)/applicationqe/ewmnavbar/framework/reporter/influx_reporter.py
    displayName: "Push Metrics to InfluxDB"
    condition: always()
    continueOnError: true
    env:
      INFLUXDB_URL: $(INFLUXDB_URL)
      INFLUXDB_TOKEN: $(INFLUXDB_TOKEN)
      INFLUXDB_ORG: $(INFLUXDB_ORG)
      INFLUXDB_BUCKET: $(INFLUXDB_BUCKET)

  - task: PublishBuildArtifacts@1
    displayName: "Publish Test Results Directory"
    inputs:
      PathtoPublish: '$(buildPath)/test-results'
      ArtifactName: 'TestResults'
      publishLocation: 'Container'
    condition: always()
    continueOnError: true

  - task: PublishTestResults@2
    displayName: "Publish JUnit Test Results to Azure Pipelines"
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '$(buildPath)/test-results/junit-report.xml'
      mergeTestResults: true
      failTaskOnFailedTests: false
      publishRunAttachments: true
    condition: always()
    continueOnError: true

  - task: PublishBuildArtifacts@1
    displayName: "Publish Playwright HTML Report"
    inputs:
      PathtoPublish: '$(ewmnavbarPath)/playwright-report'
      ArtifactName: 'PlaywrightReport'
      publishLocation: 'Container'
    condition: always()

  - task: PublishBuildArtifacts@1
    displayName: "Publish Allure Report"
    inputs:
      PathtoPublish: '$(allureReportDir)'
      ArtifactName: 'AllureReport'
      publishLocation: 'Container'
    condition: always()

  - task: PublishBuildArtifacts@1
    displayName: "Publish Allure Results Data"
    inputs:
      PathtoPublish: '$(allureResultsDir)'
      ArtifactName: 'AllureResults'
      publishLocation: 'Container'
    condition: always()

  - script: |
      echo "✓ Test Execution Complete"
      echo "Reports are available in the build artifacts:"
      echo "  - Playwright HTML Report: PlaywrightReport"
      echo "  - Allure Report: AllureReport"
      echo "  - Allure Results Data: AllureResults"
      echo "  - Test Results Directory: TestResults"
      echo "  - Test Results: Available in the Tests tab of this pipeline"
    displayName: "Print Test Report Summary"
    condition: always()
