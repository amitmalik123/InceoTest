name: oam-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - data/oam/**
      - config/oam/**
      - tests/features/oam/**
      - tests/steps/oam/**
      - pages/oam/**
      - queries/oam/**
      - azure-pipelines/templates/**
      - requirements.txt

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - data/oam/**
      - config/oam/**
      - tests/features/oam/**
      - tests/steps/oam/**
      - pages/oam/**
      - queries/oam/**
      - azure-pipelines/templates/**
      - requirements.txt

pool:
  vmImage: ubuntu-latest

stages:
  - template: templates/team-stage.yml
    parameters:
      stageName: OAM
      teamDisplay: OAM
      featurePath: tests/features/oam
