# Team Stage Template
# Reusable template for all team pipelines with advanced features from azurePipeline_ES3.yaml
# Includes: Allure reporting, Azure Log Analytics metrics, parallel execution, cross-browser testing

parameters:
  - name: stageName
    type: string
  - name: teamDisplay
    type: string
  - name: featurePath
    type: string
  - name: environment
    type: string
    default: 'test11'
  - name: marker
    type: string
    default: 'smoke'
  - name: workers
    type: string
    default: '1'
  - name: browser
    type: string
    default: 'chromium'
  - name: configDir
    type: string
    default: ''
    # Path under config/ to the team's env YAML files.
    # If empty (default), auto-derived from featurePath by stripping
    # 'tests/features/' prefix, lowercasing, and replacing spaces with hyphens.
    # Override only for non-standard layouts, e.g. configDir: 'stp/stp-fees'

stages:
- stage: ${{ parameters.stageName }}
  displayName: 'Test ${{ parameters.teamDisplay }}'

  pool:
    name: 'ubuntu2204-qa'
    timeoutInMinutes: 10

  jobs:
  - job: RunPytestBDDTests
    displayName: 'Run ${{ parameters.teamDisplay }} Tests'
    timeoutInMinutes: 45

    variables:
    - group: qa-pipelines-shared-config  # Azure subscription, Log Analytics credentials
    - name: buildPath
      value: '$(Build.SourcesDirectory)'
    - name: environment
      value: ${{ parameters.environment }}
    - name: marker
      value: ${{ parameters.marker }}
    - name: workers
      value: ${{ parameters.workers }}
    - name: browser
      value: ${{ parameters.browser }}
    - name: allureResultsDir
      value: '$(Build.SourcesDirectory)/reports/${{ parameters.stageName }}/allure-results'
    - name: allureReportDir
      value: '$(Build.SourcesDirectory)/reports/${{ parameters.stageName }}/allure-report'
    - name: allureToolsDir
      value: '$(Build.ArtifactStagingDirectory)/allure-tools'
    - name: testResultsDir
      value: '$(Build.SourcesDirectory)/reports/${{ parameters.stageName }}'
    - name: keyVaultName
      value: 'amkkvqapipeline-testncus'  # Azure Key Vault name

    steps:
    - checkout: self
      clean: true

    # -----------------------------------------------------------------
    # Azure Key Vault: Fetch secrets and map them to pipeline variables
    # -----------------------------------------------------------------
    # Prerequisites:
    #   1. Azure Key Vault created with secrets following naming convention: {env}-{service}-{key}
    #      Examples: test11-azure-sql-password, test11-api-auth-token
    #   2. Service Connection 'subscription_test' created in Azure DevOps
    #   3. Service Principal granted "Key Vault Secrets User" role on the Key Vault
    #   4. Variable group 'qa-pipelines-shared-config' contains:
    #      - subscription_test (service connection name)
    #      - logAnalyticsWorkspaceId
    #      - logAnalyticsSharedKey
    # -----------------------------------------------------------------
    - task: AzureKeyVault@2
      displayName: 'Fetch Secrets from Azure Key Vault'
      inputs:
        azureSubscription: $(subscription_test)
        KeyVaultName: $(keyVaultName)
        SecretsFilter: '*'
        RunAsPreJob: false
      # Each secret becomes a pipeline variable with the same name.
      # E.g., Key Vault secret "test11-azure-sql-password" → $(test11-azure-sql-password)

    - script: |
        echo "========================================"
        echo "TEAM: ${{ parameters.teamDisplay }}"
        echo "======================================="
        echo "Determining environment and test settings dynamically..."
        if [ "$(Build.Reason)" = "Manual" ]; then
          echo "##vso[task.setvariable variable=environment]${{ parameters.environment }}"
          echo "##vso[task.setvariable variable=marker]${{ parameters.marker }}"
          echo "##vso[task.setvariable variable=workers]${{ parameters.workers }}"
        else
          echo "##vso[task.setvariable variable=environment]${{ parameters.environment }}"
          echo "##vso[task.setvariable variable=marker]${{ parameters.marker }}"
          echo "##vso[task.setvariable variable=workers]${{ parameters.workers }}"
        fi
      displayName: "Set Environment Variables Dynamically"

    - script: |
        echo "##vso[task.setvariable variable=TEST_ENV]$(environment)"
      displayName: "Set Playwright Environment Variables"

    - script: |
        echo "========================================"
        echo "Configuration Summary"
        echo "========================================"
        echo "Team: ${{ parameters.teamDisplay }}"
        echo "Feature Path: ${{ parameters.featurePath }}"
        echo "Environment: $(environment)"
        echo "Marker: $(marker)"
        echo "Workers: $(workers)"
        echo "Browser: $(browser)"
        echo "========================================"
      displayName: "Print Configuration"

    - task: UsePythonVersion@0
      inputs:
        versionSpec: "3.10"
        addToPath: true
      displayName: "Setup Python 3.10"

    - script: |
        python --version
        pip --version
        echo "Installing Python dependencies..."
        python -m pip install --upgrade pip setuptools wheel
        cd applicationqe
        pip install -e .
      displayName: "Install Python Dependencies"

    - script: |
        cd applicationqe
        echo "Installing Playwright browsers (Python version)..."
        if [ "${{ parameters.browser }}" = "both" ]; then
          echo "Installing both Chromium and Edge..."
          python -m playwright install chromium msedge
        elif [ "${{ parameters.browser }}" = "msedge" ]; then
          echo "Installing Microsoft Edge..."
          python -m playwright install msedge
        else
          echo "Installing Chromium (default)..."
          python -m playwright install chromium
        fi
        echo "Browser installation complete!"
      displayName: "Install Playwright Browsers (Python)"
      continueOnError: false

    - script: |
        cd applicationqe
        echo "Installing Allure CLI via pip..."
        pip install allure-pytest

        echo "Installing Allure CLI binary (standalone)..."
        mkdir -p $(allureToolsDir)

        # Download and install Allure commandline
        wget -q https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.tgz
        tar -xzf allure-2.25.0.tgz -C $(allureToolsDir)

        echo "Adding Allure CLI to PATH..."
        export PATH="$(allureToolsDir)/allure-2.25.0/bin:$PATH"
        echo "##vso[task.prependpath]$(allureToolsDir)/allure-2.25.0/bin"

        echo "Verifying Allure CLI installation..."
        allure --version
      displayName: "Install and Verify Allure CLI"

    - script: |
        mkdir -p "$(allureResultsDir)"
        mkdir -p "$(testResultsDir)/junit"
        echo "========================================"
        echo "PYTEST EXECUTION START - ${{ parameters.teamDisplay }}"
        echo "========================================"
        echo "Test Marker: $(marker)"
        echo "Workers: $(workers)"
        echo "Browser: $(browser)"
        echo "Environment: $(environment)"
        echo "Feature Path: ${{ parameters.featurePath }}"
        echo "Build Path: $(buildPath)"
        echo "Allure Results Dir: $(allureResultsDir)"
        echo "========================================"
        echo ""
        echo "Setting up environment variables..."
        export TEST_ENV="$(environment)"
        # Derive configDir from featurePath when not explicitly provided:
        #   strip 'tests/features/' prefix → lowercase → spaces to hyphens
        _CONFIG_DIR="${{ parameters.configDir }}"
        if [ -z "$_CONFIG_DIR" ]; then
          _CONFIG_DIR=$(echo "${{ parameters.featurePath }}" | sed 's|tests/features/||' | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
          echo "Derived configDir: $_CONFIG_DIR"
        fi
        export TEST_CONFIG_PATH="config/${_CONFIG_DIR}/env.$(environment).yaml"
        export TEST_APP="$_CONFIG_DIR"
        echo "✓ TEST_APP=$TEST_APP"
        export CI=true
        export PYTHONUNBUFFERED=1
        export ALLURE_RESULTS_DIR="$(allureResultsDir)"
        echo "✓ TEST_ENV=$TEST_ENV"
        echo "✓ CI=$CI"
        echo ""
        echo "Current working directory: $(pwd)"
        echo "Changing to applicationqe directory..."
        cd applicationqe
        echo "New working directory: $(pwd)"
        echo "Python version: $(python --version)"
        echo ""

        # Determine test target
        TEST_TARGET="${{ parameters.featurePath }}"
        echo "Running tests from: $TEST_TARGET with marker: $(marker)"

        # Determine browser parameter
        BROWSER_VALUE="${{ parameters.browser }}"
        if [ "$BROWSER_VALUE" = "both" ]; then
          BROWSER_PARAM="--browser chromium --browser msedge"
          echo "Cross-browser testing: Chromium and Microsoft Edge"
        elif [ "$BROWSER_VALUE" = "msedge" ]; then
          BROWSER_PARAM="--browser msedge"
          echo "Browser: Microsoft Edge"
        else
          BROWSER_PARAM="--browser chromium"
          echo "Browser: Chromium (default)"
        fi

        PYTEST_CMD="pytest $TEST_TARGET \
          -m \"$(marker)\" \
          $BROWSER_PARAM \
          --junitxml=\"$(testResultsDir)/junit/junit-report.xml\" \
          -v \
          --video=retain-on-failure \
          --tracing=retain-on-failure \
          --screenshot=only-on-failure \
          --alluredir=\"$(allureResultsDir)\" \
          --html=\"$(testResultsDir)/pytest-report.html\" \
          --self-contained-html"

        # Add parallel execution if workers > 1
        WORKERS_VALUE="$(workers)"
        if [ "$WORKERS_VALUE" = "auto" ] || [ "$WORKERS_VALUE" -gt "1" ] 2>/dev/null; then
          PYTEST_CMD="$PYTEST_CMD -n $WORKERS_VALUE --dist loadscope"
          echo "Parallel execution enabled: $WORKERS_VALUE workers with loadscope distribution"
        else
          echo "Sequential execution (single worker)"
        fi

        echo "Executing: $PYTEST_CMD"
        echo "========================================"
        echo ""
        eval $PYTEST_CMD 2>&1 || TEST_EXIT_CODE=$? || true
        echo ""
        echo "========================================"
        echo "Test Execution Exit Code: ${TEST_EXIT_CODE:-0}"
        echo "========================================"
        echo "##vso[task.setvariable variable=TEST_EXIT_CODE]${TEST_EXIT_CODE:-0}"
        echo ""
        echo "Checking for generated reports..."
        echo "Listing Allure results:"
        ls -la $(allureResultsDir) 2>/dev/null || echo "Allure results directory not found"
        echo ""
        echo "Listing test results:"
        ls -la $(testResultsDir) 2>/dev/null || echo "Test results directory not found"
      displayName: "Run Pytest BDD Tests with Allure"
      continueOnError: true
      env:
        WORK_ITEM_AUTH_TOKEN: $(WORK_ITEM_AUTH_TOKEN)
        PARTIES_AUTH_TOKEN: $(PARTIES_AUTH_TOKEN)
        # ── Connection strings: AzureKeyVault@2 fetches secrets → mapped to env vars ──
        # Python reads these via os.getenv() — no direct Key Vault API calls.
        TRANSFER_CONNECTION_STRING: $(transfer-connection-string)
        ACCOUNTDISTRIBUTIONS_CONNECTION_STRING: $(accoundistributions-connection-string)
        CRM_DB_CONNECTION_STRING: $(crm-db-connection-string)
        AM_BILLING_CONNECTION_STRING: $(am-billing-connection-string)
        API_AUTH_TOKEN: $(test11-api-auth-token)
        OUTLOOK_USERNAME: $(outlook-account-username)
        OUTLOOK_PASSWORD: $(outlook-account-password)

    - script: |
        echo "Checking Allure Results Directory..."
        echo "Results Dir: $(allureResultsDir)"
        ls -la $(allureResultsDir) 2>/dev/null || echo "Results dir not found"
      displayName: "Debug Allure Results Directory"
      condition: always()

    - script: |
        mkdir -p "$(allureReportDir)"
        echo "Allure Report Directory created: $(allureReportDir)"
      displayName: "Create Allure Report Directory"

    - script: |
        echo "Checking for Allure results..."
        SRC_DIR="$(allureResultsDir)"
        REPORT_DIR="$(allureReportDir)"

        if [ ! -d "$SRC_DIR" ] || [ -z "$(ls -A "$SRC_DIR" 2>/dev/null)" ]; then
          echo "##vso[task.logissue type=warning]No Allure results found in $SRC_DIR. Report generation skipped."
          exit 0
        fi

        echo "Generating Allure report from: $SRC_DIR"
        allure generate "$SRC_DIR" --clean -o "$REPORT_DIR" --single-file
        echo "Report generated at: $REPORT_DIR"
        ls -la "$REPORT_DIR" 2>/dev/null || echo "Report dir not found"
      displayName: "Generate Allure Report"
      condition: always()

    - script: |
        echo "Verifying report directories before publish..."
        echo "Results Dir: $(allureResultsDir)"
        echo "Report Dir: $(allureReportDir)"
        ls -la $(allureResultsDir) 2>/dev/null || echo "Results dir not found"
        ls -la $(allureReportDir) 2>/dev/null || echo "Report dir not found"
      displayName: "Verify Report Paths"
      condition: always()

    - script: |
        echo "Pushing test metrics to Azure Log Analytics..."
        cd applicationqe
        _CONFIG_DIR="${{ parameters.configDir }}"
        if [ -z "$_CONFIG_DIR" ]; then
          _CONFIG_DIR=$(echo "${{ parameters.featurePath }}" | sed 's|tests/features/||' | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
        fi
        export TEST_APP="$_CONFIG_DIR"
        echo "✓ TEST_APP=$TEST_APP"
        export ALLURE_RESULTS_DIR="$(allureResultsDir)"
        export ENVIRONMENT="$(environment)"
        export BUILD_ID="$(Build.BuildId)"
        export BUILD_REASON="$(Build.Reason)"
        export AZURE_LOG_WORKSPACE_ID="$(logAnalyticsWorkspaceId)"
        export AZURE_LOG_SHARED_KEY="$(logAnalyticsSharedKey)"

        python utils/azure_analytics_reporter.py
      displayName: "Push Metrics to Azure Log Analytics"
      condition: always()
      continueOnError: true
      env:
        AZURE_LOG_WORKSPACE_ID: $(logAnalyticsWorkspaceId)
        AZURE_LOG_SHARED_KEY: $(logAnalyticsSharedKey)

    - task: PublishBuildArtifacts@1
      displayName: "Publish Test Results Directory"
      inputs:
        PathtoPublish: '$(testResultsDir)'
        ArtifactName: 'TestResults-${{ parameters.stageName }}'
        publishLocation: 'Container'
      condition: always()
      continueOnError: true

    - task: PublishTestResults@2
      displayName: "Publish JUnit Test Results to Azure Pipelines"
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(testResultsDir)/junit/junit-report.xml'
        mergeTestResults: true
        failTaskOnFailedTests: false
        publishRunAttachments: true
        testRunTitle: '${{ parameters.teamDisplay }} Tests'
      condition: always()
      continueOnError: true

    - script: |
        echo "========================================"
        echo "✓ ${{ parameters.teamDisplay }} Test Execution Complete"
        echo "========================================"
        echo "Reports are available in the build artifacts:"
        echo "  - Test Results: TestResults-${{ parameters.stageName }}"
        echo "  - Allure Report: $(allureReportDir)"
        echo "  - Test Results: Available in the Tests tab"
        echo "========================================"
      displayName: "Print Test Report Summary"
      condition: always()
