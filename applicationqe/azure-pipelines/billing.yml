name: billing-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - applicationqe/data/billing/**
      - applicationqe/config/billing/**
      - applicationqe/tests/features/billing/**
      - applicationqe/tests/steps/billing/**
      - applicationqe/pages/billing/**
      - applicationqe/queries/billing/**
      - applicationqe/fixtures/billing_fixture.py
      - applicationqe/pages/base_page.py
      - applicationqe/pytest.ini
      - applicationqe/requirements.txt
      - applicationqe/azure-pipelines/templates/**
      - applicationqe/azure-pipelines/billing.yml

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - applicationqe/data/billing/**
      - applicationqe/config/billing/**
      - applicationqe/tests/features/billing/**
      - applicationqe/tests/steps/billing/**
      - applicationqe/pages/billing/**
      - applicationqe/queries/billing/**
      - applicationqe/fixtures/billing_fixture.py
      - applicationqe/pages/base_page.py
      - applicationqe/pytest.ini
      - applicationqe/requirements.txt
      - applicationqe/azure-pipelines/templates/**
      - applicationqe/azure-pipelines/billing.yml

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: "test"
    values:
      - test

  - name: marker
    displayName: "Pytest Marker to Run"
    type: string
    default: "regression"
    values:
      - regression
      - family
      - approve_reject
      - create
      - edit
      - search
      - search_model

  - name: workers
    displayName: "Number of Parallel Workers"
    type: string
    default: "1"
    values:
      - "1"
      - "2"
      - "3"
      - "4"
      - auto

  - name: browser
    displayName: "Browser to Test"
    type: string
    default: "chromium"
    values:
      - chromium
      - msedge
      - both

stages:
  - template: templates/team-stage.yml
    parameters:
      stageName: BILLING_PLATFORM_REVENUE_DASHBOARD
      teamDisplay: Billing Platform Revenue Dashboard
      featurePath: tests/features/billing/platformrevenuedashboard/strategistgroupmodel
      environment: ${{ parameters.environment }}
      marker: ${{ parameters.marker }}
      workers: ${{ parameters.workers }}
      browser: ${{ parameters.browser }}