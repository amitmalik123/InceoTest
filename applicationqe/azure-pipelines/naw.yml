name: naw-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - applicationqe/data/naw/**
      - applicationqe/config/naw/**
      - applicationqe/tests/features/naw/**
      - applicationqe/tests/steps/naw/**
      - applicationqe/pages/ewm/**
      - applicationqe/queries/naw/**
      - applicationqe/azure-pipelines/templates/**
      - applicationqe/requirements.txt
variables:
- group: qa-pipelines-shared-config
pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - applicationqe/data/naw/**
      - applicationqe/config/naw/**
      - applicationqe/tests/features/naw/**
      - applicationqe/tests/steps/naw/**
      - applicationqe/pages/ewm/**
      - applicationqe/queries/naw/**
      - applicationqe/azure-pipelines/templates/**
      - applicationqe/requirements.txt

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: "test11"
    values:
      - test10
      - test11   
      - silo
      - prod

  - name: marker
    displayName: "Pytest Marker to Run"
    type: string
    default: "prodSmoke"
    values:
      - NAW
      - prodSmoke
      - Regression
      - retainAccount
      - TrackingCenterESign
      - GNW_Ind_401k

  - name: workers
    displayName: "Number of Parallel Workers"
    type: string
    default: "1"
    values:
      - "1"
      - "2"
      - "4"
      - "auto"

  - name: browser
    displayName: "Browser to Test"
    type: string
    default: "chromium"
    values:
      - chromium
      - msedge
      - both

stages:
  - template: templates/team-stage.yml
    parameters:
      stageName: naw
      teamDisplay: NAW
      featurePath: tests/features/naw
      environment: ${{ parameters.environment }}
      marker: ${{ parameters.marker }}
      workers: ${{ parameters.workers }}
      browser: ${{ parameters.browser }}
