name: naw-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - data/naw/**
      - config/naw/**
      - tests/features/naw/**
      - tests/steps/naw/**
      - pages/ewm/**
      - queries/naw/**
      - azure-pipelines/templates/**
      - requirements.txt

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - data/naw/**
      - config/naw/**
      - tests/features/naw/**
      - tests/steps/naw/**
      - pages/ewm/**
      - queries/naw/**
      - azure-pipelines/templates/**
      - requirements.txt

pool:
  vmImage: ubuntu-latest

stages:
  - template: templates/team-stage.yml
    parameters:
      stageName: naw
      teamDisplay: NAW
      featurePath: tests/features/naw
