name: stp-journals-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - applicationqe/data/STP/STP-JOURNALS/**
      - applicationqe/config/STP/STP-JOURNALS/**
      - applicationqe/tests/features/STP/STP-JOURNALS/**
      - applicationqe/tests/steps/STP/STP-JOURNALS/**
      - applicationqe/pages/EWM/**
      - applicationqe/pages/STP/STP-JOURNALS/**
      - applicationqe/queries/STP/STP-JOURNALS/**
      - applicationqe/azure-pipelines/templates/**
      - applicationqe/requirements.txt

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - applicationqe/data/STP/STP-JOURNALS/**
      - applicationqe/config/STP/STP-JOURNALS/**
      - applicationqe/tests/features/STP/STP-JOURNALS/**
      - applicationqe/tests/steps/STP/STP-JOURNALS/**
      - applicationqe/pages/EWM/**
      - applicationqe/pages/STP/STP-JOURNALS/**
      - applicationqe/queries/STP/STP-JOURNALS/**
      - applicationqe/azure-pipelines/templates/**
      - applicationqe/requirements.txt

pool:
  vmImage: ubuntu-latest

stages:
  - template: templates/team-stage.yml
    parameters:
      stageName: STP_JOURNALS
      teamDisplay: STP-JOURNALS
      featurePath: tests/features/STP/STP-JOURNALS
