name: proposal-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - applicationqe/data/proposal/**
      - applicationqe/config/proposal/**
      - applicationqe/tests/features/proposal/**
      - applicationqe/tests/steps/proposal/**
      - applicationqe/pages/proposal/**
      - applicationqe/queries/proposal/**
      - applicationqe/azure-pipelines/templates/**
      - applicationqe/requirements.txt

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - applicationqe/data/proposal/**
      - applicationqe/config/proposal/**
      - applicationqe/tests/features/proposal/**
      - applicationqe/tests/steps/proposal/**
      - applicationqe/pages/proposal/**
      - applicationqe/queries/proposal/**
      - applicationqe/azure-pipelines/templates/**
      - applicationqe/requirements.txt

variables:
  - group: qa-pipelines-shared-config

# -----------------------------
# Parameters for Manual Runs
# -----------------------------
parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: "test11"
    values:
      - test11
      - test12
      - test01
      - silo
      - prod
      - qa
  - name: marker
    displayName: "Pytest Marker to Run"
    type: string
    default: "smoke"
    values:
      - smoke
      - regression
      - e2e
  - name: workers
    displayName: "Number of Parallel Workers"
    type: string
    default: "1"
    values:
      - "1"
      - "2"
      - "3"
      - "4"
      - "auto"
  - name: browser
    displayName: "Browser to Test"
    type: string
    default: "chromium"
    values:
      - chromium
      - msedge
      - both

stages:
  - template: templates/team-stage.yml
    parameters:
      stageName: PROPOSAL
      teamDisplay: PROPOSAL
      featurePath: tests/runners/proposal
      configDir: proposal
      environment: ${{ parameters.environment }}
      marker: ${{ parameters.marker }}
      workers: ${{ parameters.workers }}
      browser: ${{ parameters.browser }}
