name: proposal-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - data/proposal/**
      - config/proposal/**
      - tests/features/proposal/**
      - tests/steps/proposal/**
      - pages/proposal/**
      - queries/proposal/**
      - azure-pipelines/templates/**
      - requirements.txt

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - data/proposal/**
      - config/proposal/**
      - tests/features/proposal/**
      - tests/steps/proposal/**
      - pages/proposal/**
      - queries/proposal/**
      - azure-pipelines/templates/**
      - requirements.txt

pool:
  vmImage: ubuntu-latest

stages:
  - template: templates/team-stage.yml
    parameters:
      stageName: PROPOSAL
      teamDisplay: PROPOSAL
      featurePath: tests/runners/proposal
