name: stp-ict-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - data/stp/stp-ict/**
      - config/stp/stp-ict/**
      - tests/features/stp/stp-ict/**
      - tests/steps/stp/stp-ict/**
      - pages/stp/stp-ict/**
      - queries/stp/stp-ict/**
      - azure-pipelines/templates/**
      - requirements.txt

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - data/stp/stp-ict/**
      - config/stp/stp-ict/**
      - tests/features/stp/stp-ict/**
      - tests/steps/stp/stp-ict/**
      - pages/stp/stp-ict/**
      - queries/stp/stp-ict/**
      - azure-pipelines/templates/**
      - requirements.txt

pool:
  vmImage: ubuntu-latest

stages:
  - template: templates/team-stage.yml
    parameters:
      stageName: STP_ICT
      teamDisplay: STP-ICT
      featurePath: tests/features/stp/stp-ict
