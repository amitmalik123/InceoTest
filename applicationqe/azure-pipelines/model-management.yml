name: model-management-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - 'data/model-management/wrappermodel/**'
      - 'config/Model Management/**'
      - 'tests/features/model-management/WrapperModel/**'
      - 'tests/steps/model-management/wrappermodel/**'
      - 'pages/model-management/wrappermodel**'
      - 'queries/model-management/**'
      - azure-pipelines/templates/**
      - requirements.txt

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - 'data/model-management/wrappermodel/**'
      - 'config/Model Management/**'
      - 'tests/features/model-management/WrapperModel/**'
      - 'tests/steps/model-management/wrappermodel/**'
      - 'pages/model-management/wrappermodel**'
      - 'queries/model-management/**'
      - azure-pipelines/templates/**
      - requirements.txt

pool:
  vmImage: ubuntu-latest

stages:
  - template: templates/team-stage.yml
    parameters:
      stageName: MODEL_MANAGEMENT
      teamDisplay: Model Management
      featurePath: tests/features/model-management/WrapperModel
