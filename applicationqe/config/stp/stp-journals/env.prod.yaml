# Production Environment Configuration
environment: prod

# Application settings
application:
  base_url: "https://wrmqa.schwabplan.com/"
  login_url: "https://wrmqa.schwabplan.com/ewmLogin/account/login"
  timeout: 30000  # milliseconds
  
# Browser settings
browser:
  browser_type: "chromium"  # chromium, firefox, webkit
  headless: false
  slow_mo: 0
  viewport:
    width: 1280
    height: 720
  args:
    - "--start-maximized"
  
# Test settings
test:
  screenshot_on_failure: true
  video: "retain-on-failure"  # on, off, retain-on-failure (more conservative for prod)
  trace: "retain-on-failure"  # on, off, retain-on-failure
  
# Reporting
reporting:
  allure_results: "reports/allure-results"
  html_report: "reports/pytest_report.html"
  
# Data
data:
  test_data_csv: "data/STP/STP_JOURNALS/test_data.prod.csv"
