# Silo Environment Configuration
environment: silo

# Application settings
application:
  base_url: "https://silo.ewealthmanager.com/"
  login_url: "https://silo.ewealthmanager.com/ewmLogin/account/login"
  new_nav_url: "https://app.test01.assetmark.com/"
  timeout: 30000  # milliseconds

# Browser settings
browser:
  browser_type: "chromium"  # chromium, firefox, webkit
  headless: false
  slow_mo: 0
  viewport:
    width: 1280
    height: 720
  args:
    - "--start-maximized"

# Test settings
test:
  screenshot_on_failure: true
  screenshot_each_step: false  # Enable to capture screenshots after every BDD step
  video: "on"  # on, off, retain-on-failure
  trace: "retain-on-failure"  # on, off, retain-on-failure

# Reporting
reporting:
  allure_results: "reports/allure-results"
  html_report: "reports/pytest_report.html"

# Outlook / Email settings
outlook:
  url: "https://outlook.office365.com/mail/"

# DocuSign settings
docusign:
  url_patterns:
    - "https://apps-d.docusign.com/"
    - "https://www.docusign.net/"
    - "https://verify-d.docusign.net/"

# Data
data:
  test_data_csv: "data/stp/csv/test_data.silo.csv"
