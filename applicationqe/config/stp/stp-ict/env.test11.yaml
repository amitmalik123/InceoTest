# Test11 Environment Configuration — STP-ICT
environment: test11

# Default application
application:
  base_url: "https://test11.ewealthmanager.com/"
  login_url: "https://test11.ewealthmanager.com/ewmLogin/account/login"
  timeout: 30000  # milliseconds

# Browser settings
browser:
  browser_type: "chromium"  # chromium, firefox, webkit
  headless: false
  slow_mo: 0
  viewport:
    width: 1280
    height: 720
  args:
    - "--start-maximized"

# Test settings
test:
  screenshot_on_failure: true
  screenshot_each_step: false
  video: "on"
  trace: "retain-on-failure"

# Reporting
reporting:
  allure_results: "reports/stp/stp-ict/allure-results"
  html_report: "reports/stp/stp-ict/pytest_report.html"

# Data
data:
  test_data_csv: "data/stp/stp-ict/test_data.test11.csv"

# Applications (multi-app support for authenticated_page fixture)
applications:
  ewm:
    name: "EWM"
    login_url: "https://test11.ewealthmanager.com/ewmLogin/account/login"
    home_url: "https://test11.ewealthmanager.com/"
    login_page_class: "LoginPage"
    timeout: 30000
