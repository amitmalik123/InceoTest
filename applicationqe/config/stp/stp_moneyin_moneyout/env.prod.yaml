# Production Environment Configuration
environment: prod

# Application settings
application:
  base_url: "https://ewealthmanager.com/"
  login_url: "https://ewealthmanager.com/ewmLogin/account/login"
  new_nav_url: "https://app.test01.assetmark.com/"
  timeout: 30000  # milliseconds

# Browser settings
browser:
  browser_type: "chromium"  # chromium, firefox, webkit
  headless: false
  slow_mo: 0
  viewport:
    width: 1280
    height: 720
  args:
    - "--start-maximized"

# Test settings
test:
  screenshot_on_failure: true
  screenshot_each_step: false  # Enable to capture screenshots after every BDD step
  video: "retain-on-failure"  # on, off, retain-on-failure (more conservative for prod)
  trace: "retain-on-failure"  # on, off, retain-on-failure

# Reporting
reporting:
  allure_results: "reports/allure-results"
  html_report: "reports/pytest_report.html"

# Outlook / Email settings
outlook:
  url: "https://outlook.office365.com/mail/"

# DocuSign settings
docusign:
  url_patterns:
    - "https://apps-d.docusign.com/"
    - "https://www.docusign.net/"
    - "https://verify-d.docusign.net/"

# Data
data:
  test_data_csv: "data/stp/csv/test_data.prod.csv"

# External tool URLs
external_urls:
  oa_tool_base_url: "https://nextgen.ewealthmanager.com/trade-actions/home"

# Role-based URLs (for specific test flows)
role_urls:
  manage_bene_test:
    base_url: ""  # TODO: set prod manage_bene URL e.g. https://app.assetmark.com/bene?householdid=<id>
    description: "Manage Beneficiaries prod flow endpoint"
