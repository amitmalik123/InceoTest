# DEV Environment Configuration
environment: dev

# Multiple application configurations
applications:
  ewm:
    name: "ewm"
    login_url: "https://dev01.ewealthmanager.com/ewmLogin/account/login"
    home_url: "https://dev01.ewealthmanager.com/en.aspx"
    login_page_class: "LoginPage"
    timeout: 30000

# Default application
application:
  base_url: "https://dev01.ewealthmanager.com/"
  login_url: "https://dev01.ewealthmanager.com/ewmLogin/account/login"
  new_nav_url: "https://app.dev01.assetmark.com/"
  timeout: 30000  # milliseconds

# Browser settings
browser:
  browser_type: "chromium"
  headless: false
  slow_mo: 0
  viewport:
    width: 1280
    height: 720
  args:
    - "--start-maximized"

# Test settings
test:
  screenshot_on_failure: true
  screenshot_each_step: false
  video: "on"
  trace: "retain-on-failure"

# Reporting
reporting:
  allure_results: "reports/allure-results"
  html_report: "reports/pytest_report.html"
  report_folder_path: ""

# Files and folders
files:
  download_folder: "target"
  upload_pdffile: "/fileToUpload/eSigPDFDownload.pdf"
  upload_tiffile: "/fileToUpload/file.tif"

# Data
data:
  test_data_csv: "data/stp/csv/test_data.dev.csv"

# Role-based URLs (for specific test flows)
role_urls:
  manage_bene_test:
    base_url: "https://app.dev01.assetmark.com/bene?householdid=C19744"
    description: "Manage Beneficiaries DEV flow endpoint"
