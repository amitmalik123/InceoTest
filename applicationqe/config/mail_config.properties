# Mail Configuration - Outlook Email (IMAP) Settings
# Credentials are AES-encrypted using the secret_key from settings.py
# 
# Usage:
#   - Load via: from config.settings import settings
#   - Access via: settings.outlook_email, settings.outlook_password, settings.outlook_imap_server
#
# For local development:
#   - Add to .env: OUTLOOK_EMAIL, OUTLOOK_PASSWORD, OUTLOOK_IMAP_SERVER, OUTLOOK_IMAP_PORT
#   - Or update the encrypted values below (use generate_credentials.py to encrypt)
#
# For CI/CD (Azure Pipelines):
#   - Set via Azure Key Vault secrets mapped to environment variables
#   - Pipeline will set: OUTLOOK_EMAIL, OUTLOOK_PASSWORD before running tests

# Outlook email address (AES-encrypted)
# Decrypted value: saransh.saxena@assetmark.com
outlook.email=dDwTzWdq5f9qIsM7xcfhOBPazVB5iS7UbbrJLiP5Ldc=

# Outlook password or App Password (AES-encrypted)
# When MFA is enabled on account, use an App Password instead
# Decrypted value: [your-app-password-here]
outlook.password=8pBp0AreZeAS9uLF4uHqIg==

# IMAP server hostname for Outlook / Office 365
# For Outlook.com / Office 365: outlook.office365.com
# For on-prem Exchange with IMAP: exchange.company.com
outlook.imap_server=outlook.office365.com

# IMAP port (typically 993 for SSL, 143 for non-SSL)
outlook.imap_port=993

# Mail folder to read from (default: INBOX)
outlook.mail_folder=INBOX

# Connection timeout in seconds
outlook.connection_timeout=30

# Read timeout in seconds
outlook.read_timeout=30
