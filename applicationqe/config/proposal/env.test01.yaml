# Test01 Environment Configuration
# This environment runs proposal tests against the new navbar-wrapped EWM site (app.test01.assetmark.com)
environment: test01

# Multiple application configurations
applications:
  ewm:
    name: "ewm"
    login_url: "https://test-login.assetmark.com/"
    home_url: "https://app.test01.assetmark.com/dashboard"
    login_page_class: "NavbarLoginPage"
    timeout: 30000

# Internal Admin credentials (environment-specific)
# NOTE: Verify these credentials work with the test01/navbar environment
internal_admin:
  username: "T11_AG8959_PERF"
  password: "QAAdminUser_33a"

# Test user for PROPOSAL flows
# NOTE: This is a regular advisor account, NOT an admin. No Switch ID needed.
# Advisor IDs and user IDs must be verified in the test01 environment
test_user:
  user_id: "AG8959"
  advisor_id: "T11_AG8959_PERF"
  advisor_name: "Marty Chiu Hall"
  impersonation_name: "Marty Chiu Hall"

# Default application (for backward compatibility)
application:
  base_url: "https://app.test01.assetmark.com/"
  login_url: "https://test-login.assetmark.com/"
  timeout: 30000 # milliseconds

# Browser settings
browser:
  browser_type: "chromium"
  headless: false
  slow_mo: 0
  viewport:
    width: 1920
    height: 1080

# Test settings
test:
  screenshot_each_step: true
  screenshot_on_failure: true
  video: "on"
  trace: "retain-on-failure"

# Reporting
reporting:
  allure_results: "reports/proposal/allure-results"
  html_report: "reports/proposal/pytest_report.html"
