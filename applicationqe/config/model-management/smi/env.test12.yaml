# Test12 Environment Configuration — Model Management (SMI)

# Application settings
application:
  base_url: "https://test12-smi.assetmark.com/"
  login_url: "https://test12-smi.assetmark.com/"
  timeout: 30000  # milliseconds

# Browser settings
browser:
  headless: true
  browser_type: "chromium"

# Test settings
test:
  screenshot_each_step: false

# Data
data:
  test_data_csv: "data/model-management/test_data.test12.csv"
  test_executive_csv: "data/model-management/test_Executive_data.test12.csv"
  test_external_csv: "data/model-management/test_External_data.test12.csv"
  test_admin_csv: "data/model-management/test_Admin_data.test12.csv"
  test_data_excel: "data/model-management/Test12_data.xlsx"

# Reporting
reporting:
  allure_results_dir: "reports/model-management/allure-results"
  screenshots_dir: "reports/model-management/screenshots"

# API settings (token managed via Key Vault in CI)
api:
  auth_token: ""

# Database settings — connection strings fetched from Azure Key Vault in CI.
# For local dev set these env vars in your .env file.
database:
  vault_databases:
    transfer:
      env_var: "TRANSFER_CONNECTION_STRING"
