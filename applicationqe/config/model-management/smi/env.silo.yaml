# Silo Environment Configuration — Model Management (SMI)

# Application settings
application:
  base_url: "https://silo.ewealthmanager.com/"
  login_url: "https://silo.ewealthmanager.com/ewmLogin/account/login"
  timeout: 30000  # milliseconds

# Browser settings
browser:
  headless: true
  browser_type: "chromium"

# Test settings
test:
  screenshot_each_step: false

# Data
data:
  test_data_csv: "data/model-management/test_data.silo.csv"

# Reporting
reporting:
  allure_results_dir: "reports/model-management/allure-results"
  screenshots_dir: "reports/model-management/screenshots"
