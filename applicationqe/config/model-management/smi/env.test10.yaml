# Test10 Environment Configuration — Model Management (SMI)

# Application settings
application:
  base_url: "https://test10-smi.assetmark.com/"
  login_url: "https://test10-smi.assetmark.com/"
  timeout: 30000  # milliseconds

# Browser settings
browser:
  headless: true
  browser_type: "chromium"

# Test settings
test:
  screenshot_each_step: false

# Data
data:
  test_data_csv: "data/model-management/test_data.test10.csv"
  test_executive_csv: "data/model-management/test_Executive_data.test10.csv"
  test_external_csv: "data/model-management/test_External_data.test10.csv"
  test_admin_csv: "data/model-management/test_Admin_data.test10.csv"
  test_data_excel: "data/model-management/Test10_data.xlsx"

# Reporting
reporting:
  allure_results_dir: "reports/model-management/allure-results"
  screenshots_dir: "reports/model-management/screenshots"

# Database settings
database:
  vault_databases:
    transfer:
      env_var: "TRANSFER_CONNECTION_STRING"
      secret_name: "transfer-connection-string"
    crm:
      env_var: "CRM_DB_CONNECTION_STRING"
      secret_name: "crm-db-connection-string"
