    login_url: "https://test12.ewealthmanager.com/ewmLogin/account/login"
    home_url: "https://test12.ewealthmanager.com/en.aspx"
    login_page_class: "LoginPage"
    timeout: 30000
  baw:
    name: "baw"
    login_url: "https://bawpsnctest12a.corp.local:9444/ProcessPortal/login.jsp"
    home_url: "https://bawpsnctest12a.corp.local:9444/ProcessPortal/dashboards/WFIDASH/Dashboard"
    login_page_class: "BawLoginPage"
    timeout: 30000
  navbar:
    name: "navbar"
    login_url: "https://app.test01.assetmark.com/"
    home_url: "https://app.test01.assetmark.com/dashboard"
    login_page_class: "NavbarLoginPage"
