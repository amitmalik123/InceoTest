# Database settings
database:
  # ── All database connections use connection strings from Azure Key Vault ──
  # The pipeline's AzureKeyVault@2 task fetches secrets and maps them to env vars.
  # Python never calls Key Vault directly — it just reads os.getenv().
  # For local dev, set these env vars in the .env file.
  #
  # Connection strings should include the driver: Driver={ODBC Driver 18 for SQL Server};...
  # The 'driver' field below is OPTIONAL and only used as an override/fallback.
  #
  # Usage: get_db_from_vault("crm")  /  get_db_from_vault("billing")
  #        get_db_from_vault("transfer")  /  get_db_from_vault("accountdistributions")
  vault_databases:
    transfer:
      env_var: "TRANSFER_CONNECTION_STRING"              # set by pipeline or .env
      secret_name: "transfer-connection-string"          # Key Vault secret name
      # driver: "{ODBC Driver 18 for SQL Server}"        # Optional: include in conn string instead
    accountdistributions:
      env_var: "ACCOUNTDISTRIBUTIONS_CONNECTION_STRING"   # set by pipeline or .env
      secret_name: "accoundistributions-connection-string" # Key Vault secret name
      # driver: "{ODBC Driver 18 for SQL Server}"        # Optional: include in conn string instead
    crm:
      env_var: "CRM_DB_CONNECTION_STRING"                # set by pipeline or .env
      secret_name: "crm-db-connection-string"            # Key Vault secret name
      # driver: "{ODBC Driver 17 for SQL Server}"        # Optional: include in conn string instead
    billing:
      env_var: "AM_BILLING_CONNECTION_STRING"            # set by pipeline or .env
      secret_name: "am-billing-connection-string"        # Key Vault secret name
      # driver: "{ODBC Driver 17 for SQL Server}"        # Optional: include in conn string instead

# Encryption settings
secret_key: "MyTestSecretKey12345678901234500"  # 32-byte AES encryption key for credential decryption

