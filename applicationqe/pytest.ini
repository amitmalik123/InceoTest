# Test discovery configuration
testpaths = tests
norecursedirs = 
    reports
    .git
    .vscode
    __pycache__
    *.egg-info
    build
    dist
    node_modules
    .venv
    venv

# Ignore encoding errors on non-test files
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Report generation (matches pyproject.toml addopts)
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --video=on
    --screenshot=on
    --tracing=retain-on-failure
    --junitxml=reports/junit/junit-report.xml
    --html=reports/pytest_report.html
    --self-contained-html
    --alluredir=reports/allure-results
    ; --reruns=1
    ; --reruns-delay=1

asyncio_mode = strict
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s

    

