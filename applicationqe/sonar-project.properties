# SonarQube Project Configuration
# Basic project information
sonar.projectKey=python-playwright-automation
sonar.projectName=Python Playwright Automation Framework
sonar.projectVersion=1.0.0

# Project description
sonar.projectDescription=Python Playwright BDD Automation Framework with comprehensive test coverage

# Source code paths
sonar.sources=pages,utils,config,fixtures,features/steps
sonar.tests=tests,features
sonar.exclusions=**/__pycache__/**,**/venv/**,**/.venv/**,**/allure-results/**,**/reports/**,**/traces/**,**/screenshots/**,**/videos/**,**/test-reports/**,**/*.pyc,**/__init__.py

# Test source patterns
sonar.test.inclusions=tests/**/*.py,features/**/*.py
sonar.test.exclusions=**/__init__.py,**/conftest.py

# Python specific settings
sonar.language=py
sonar.python.version=3.8,3.9,3.10,3.11

# Coverage settings
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/__pycache__/**,**/conftest.py,**/__init__.py

# Code analysis settings
sonar.python.flake8.reportPaths=reports/flake8-report.txt
sonar.python.mypy.reportPaths=reports/mypy-report.txt
sonar.python.bandit.reportPaths=reports/bandit-report.json

# Unit test results
sonar.python.xunit.reportPath=reports/junit.xml

# Source encoding
sonar.sourceEncoding=UTF-8

# Duplications
sonar.cpd.exclusions=**/tests/**,**/test_*.py

# Analysis scope
sonar.inclusions=**/*.py

# Quality gate settings (optional)
# sonar.qualitygate.wait=true
# sonar.qualitygate.timeout=300

# Additional exclusions for generated or third-party code
sonar.issue.ignore.multicriteria=e1,e2,e3

# Rule 1: Ignore "TODO" comments in test files
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/test_*.py

# Rule 2: Ignore cognitive complexity in test files
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/test_*.py

# Rule 3: Ignore similar code blocks in page objects (common patterns)
sonar.issue.ignore.multicriteria.e3.ruleKey=common-py:DuplicatedBlocks
sonar.issue.ignore.multicriteria.e3.resourceKey=**/pages/*.py
