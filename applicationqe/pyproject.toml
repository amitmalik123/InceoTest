[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "applicationqe"
version = "0.1.0"
description = "QE automation framework for application UI tests (Playwright + pytest-bdd)"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0,<9",
    "pytest-bdd>=7.0.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    "allure-pytest",
    "pytest-xdist",
    "pyyaml",
    "openpyxl",
    "influxdb-client",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pages*", "utils*", "fixtures*"]
