[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-automation-framework"
version = "1.0.0"
description = "A Playwright-based Python BDD automation framework using pytest-bdd and Page Object Model."
requires-python = ">=3.8"
dependencies = [
    # Browser automation
    "playwright>=1.42.0",

    # Core testing framework
    "pytest>=8.0.0,<9.0.0",
    "pytest-playwright==0.4.4",
    "pytest-asyncio==0.21.1",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.5.0",
    "pytest-rerunfailures>=12.0",

    # BDD support
    "pytest-bdd>=7.3.0",
    "gherkin-official>=27.0.0",

    # Reporting
    "allure-pytest>=2.13.0",

    # Configuration
    "pyyaml>=6.0",

    # Excel/Data handling
    "pandas>=2.0.0",
    "openpyxl>=3.1.2",

    # API Contract Testing
    "jsonschema>=4.20.0",
    "openapi-spec-validator>=0.7.1",
    "prance>=23.6.21.0",

    # Database
    "pyodbc>=5.0.0",

    # HTTP Requests
    "requests>=2.31.0",

    # Environment (.env) file support
    "python-dotenv>=1.0.0",

    # PDF Testing
    "PyPDF2>=3.0.0",

    # Performance Monitoring (optional)
    "influxdb-client>=1.38.0",

    # PyCryptodome to encrypt and decrypt credentials for email access
    "pycryptodome>=3.20.0",

    # Model Context Protocol (MCP) for AI integration
    "mcp[cli]>=1.0.0"
]

[tool.setuptools]
packages = ["config", "pages", "utils", "tests", "fixtures"]

[tool.setuptools.packages.find]
# Only include actual Python packages (directories with __init__.py)
include = ["pages*", "utils*", "tests*", "config*", "fixtures*"]
# Exclude data directories that aren't Python packages
exclude = ["data*", "queries*", "docs*", "reports*", "scripts*"]

[tool.setuptools.package-data]
# Include non-Python files within packages
"*" = ["*.yaml", "*.json", "*.csv", "*.sql"]

[project.optional-dependencies]
dev = [
    # Code formatting
    "black==24.3.0",
    "autopep8==2.0.4",
    "isort==5.13.2",

    # Linting
    "flake8==7.0.0",
    "flake8-bugbear==24.2.6",
    "flake8-comprehensions==3.14.0",
    "flake8-docstrings==1.7.0",
    "flake8-simplify==0.21.0",
    "pylint>=3.0.0",

    # Type checking
    "mypy==1.9.0",

    # Security
    "bandit==1.7.7",

    # Code coverage
    "pytest-cov==4.1.0",
    "coverage[toml]==7.4.4",

    # Pre-commit hooks
    "pre-commit==3.6.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "smoke: Quick smoke tests for critical functionality",
    "regression: Full regression test suite",
    "FNT_regression: FNT regression test suite",
    "InDev: Tests in development (work in progress)",
    "roth_conversion: Roth IRA conversion related tests",
    "add_ach: Add ACH instructions related tests",
    "ach: ACH functionality tests",
    "login: Login functionality tests",
    "navigation: Navigation and menu tests",
    "account: Account management tests",
    "wizard: Account wizard flow tests",
    "change_investments: Change Investments flow tests",
    "account_management: Account Management flow tests",
    "suspension: Account Suspension tests",
    "docusign: DocuSign integration tests",
    "conversion: Asset conversion tests",
    "investment: Investment management tests",
    "tracking: Tracking center tests",
    "e2e: End-to-end workflow tests",
    "critical: Critical path tests",
    "slow: Tests that take longer to execute",
    "skip_ci: Skip in CI environment",
    "test11: Tests for test11 environment",
    "test12: Tests for test12 environment",
    "silo: Tests for silo environment",
    "prod: Tests for production environment",
    "performance: Performance monitoring tests",
    "lighthouse: Lighthouse audit tests",
    "HappyPath: Happy path scenario",
    "Silo_Regression: Silo Regression",
    "T10_Regression: T10 Regression",
    "Prod_Regression: Prod Regression",
    "SiloRegression_OneCleanUp: Silo Regression with one CleanUp Scenario",
    "app: marks tests to run with specific app (e.g., -m app[ewm])",
    "S1: S1_OAM_Initiated by FA_Online Submit_Finish",
    "S2: S2_OAM_Initiated by SAU_Online Submit_Authorized Signer_Not_Required",
    "S3: S3_OAM_Initiated by SAU_Complete and Print",
    "S4: S4_OAM_Initiated_by_OfficeAdmin_Complete_And_Print",
    "S5: S5_OAM_Initiated by SAU_Online Submit_Authorized Signer_Required_FA",
    "S6: S6_OAM_Initiated by SAU_Online Submit_Authorized Signer_Required_SAU",
    "S7: S7_Prod_OAM_Initiated by SAU_Online Submit_Authorized Signer_Required_FA",
    "S8: S8_OAM_Initiated by FA_Complete and Print",
    "S9: S9_OAM_Initiated by SAU_eSignature_With One Inperson Client Signature_Authorized Signer_NOT required",
    "S10: S10_OAM_Initiated by FA_Online Submit_Finish Later",
    "S11: S11_PRODENG_33109_OAM_SAU_Online Submit_Authorized Approval_Tracking Center_Blue Banner_Trigger Advisor Mail",
]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = """
-v
--tb=short
--strict-markers
--disable-warnings
--video=on
--screenshot=on
--tracing=retain-on-failure
--junitxml=reports/oam/junit/junit-report.xml
--html=reports/oam/pytest_report.html
--self-contained-html
--alluredir=reports/oam/allure-results
--reruns=1
--reruns-delay=1
"""
--junitxml=reports/junit/junit-report.xml
--html=reports/pytest_report.html
--self-contained-html
--alluredir=reports/allure-results
"""
# Note: --reruns and --reruns-delay commented out to allow --pdb debug mode
# Uncomment for normal test runs:
# --reruns=2
# --reruns-delay=1

markers = [
    "smoke: Quick smoke tests for critical functionality",
    "regression: Full regression test suite",
    "roth_conversion: Roth IRA conversion related tests",
    "add_ach: Add ACH instructions related tests",
    "Regression: Full regression test suite (capitalized alias)",
    "ach: ACH functionality tests",
    "login: Login functionality tests",
    "navigation: Navigation and menu tests",
    "account: Account management tests",
    "wizard: Account wizard flow tests",
    "change_investments: Change Investments flow tests",
    "account_management: Account Management flow tests",
    "suspension: Account Suspension tests",
    "docusign: DocuSign integration tests",
    "conversion: Asset conversion tests",
    "investment: Investment management tests",
    "tracking: Tracking center tests",
    "e2e: End-to-end workflow tests",
    "critical: Critical path tests",
    "slow: Tests that take longer to execute",
    "skip_ci: Skip in CI environment",
    "test11: Tests for test11 environment",
    "test12: Tests for test12 environment",
    "silo: Tests for silo environment",
    "prod: Tests for production environment",
    "performance: Performance monitoring tests",
    "lighthouse: Lighthouse audit tests",
    "SMI_InternalAgent: Check login functionality for internal agent",
    "SMI_ExternalAgent: Check login functionality for external agent",
    "SMI_ExecutiveAgent: Check login functionality for executive agent",
    "SMI_AdminAgent: Check login functionality for admin agent",
    "SMI_Rebalance: Navigate to Reallocations menu as internal agent",
    "NAW: WFI Regression- NAW tests",
    "smokeTest11: NAW smoke tests for test11 environment",
    "prodSmoke: Production smoke tests",
    "navbar: Navbar flow tests",
    "TrackingCenterESign: Tracking Center eSign tests",
    "internal_admin: Internal Admin scenarios that skip auto-login",
    "GNW_Ind_401k: NAW GNW Individual 401(k) tests",
    "OnlineBD: NAW GNW LLC OnlineBD Approval tests",
    "retainAccount: Retain account tests",
    "ewm: EWM tests",
    "newAccountWizard: New Account Wizard feature",
    "portfolioEngine: Portfolio Engine feature",
    "widgetTests: Widget tests",
    "TMS: Tax Management Services",
    "bdd: BDD tests",
    "integration: Integration tests",
    "ui: UI tests",
    "api: API tests",
]
asyncio_mode = "strict"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
timeout = 300
timeout_method = "thread"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "W0212",  # protected-access
]

[tool.pylint.format]
max-line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.coverage.run]
source = ["pages", "utils", "config", "fixtures"]
omit = ["*/tests/*", "*/__pycache__/*", "*/generated/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__",
    "pass",
    "raise NotImplementedError",
    "pragma: no cover",
]

[tool.downloads]
download_dir = "reports/downloads"

[tool.route-blocking]
# Allow only requests to these domains; abort everything else.
# Subdomains are automatically included (e.g., app.assetmark.com matches assetmark.com).
# Set enabled = false to disable and allow all traffic.
enabled = false
http_error_log = "reports/oam/network_errors.log"
allowed_domains = [
    # ===== Core AssetMark =====
    "assetmark.com",
    "ewealthmanager.com",
    "assetmark.net",
    
    # ===== DocuSign Services =====
    "docusign.net",
    "docusign.com",
    "apps-d.docusign.com",
    "cdn.docusign.net",
    "docusignaws.com",
    "secure.docusign.com",
    "static.docusign.com",
    "analytics.docusign.com",
    "cdn.docusignaws.net",
    "signingapi.com",
    "doublecheck.docusign.com",
    "dsext.docusign.net",
    "trust.docusign.com",
    
    # ===== Microsoft/Outlook/Office365 (from backup) =====
    "outlook.com",
    "outlook.office.com",
    "outlook.cloud.microsoft",
    "office365.com",
    "microsoftonline.com",
    "microsoft.com",
    "msftauth.net",
    "msauth.net",
    "live.com",
    "akamaihd.net",
    "office.net",
    
    # ===== Azure/Corporate =====
    "azure.com",
    "azncc03perf.corp",
    "corp.local",
    
    # ===== Analytics =====
    "analytics.google.com",
]

[tool.id-capture]
# Capture IDs matching these regex patterns from API responses and page DOM.
# Logged per scenario to reports/network_errors.log with deduplication.
enabled = true
patterns = [
    "[ABDN]\\d{9}",
]

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "build", "dist", ".eggs", "*.egg"]
ignore = ["E203", "W503"]
