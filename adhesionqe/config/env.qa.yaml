# QA Environment Configuration
environment: qa

# Application settings
application:
  base_url: "https://wrmqa.schwabplan.com/"
  timeout: 30000  # milliseconds

# Browser settings
browser:
  browser_type: "chromium"  # chromium, firefox, webkit
  headless: false
  slow_mo: 0
  viewport:
    width: 1280
    height: 720
  args:
    - "--start-maximized"

# Test settings
test:
  screenshot_on_failure: true
  screenshot_each_step: false  # Enable to capture screenshots after every BDD step
  video: "on"  # on, off, retain-on-failure
  trace: "retain-on-failure"  # on, off, retain-on-failure

# Reporting
reporting:
  allure_results: "reports/allure-results"
  html_report: "reports/pytest_report.html"

# Outlook Email (IMAP – password should be in Key Vault or .env)
outlook:
  email: ""                              # your Outlook email address
  password: ""                            # password or App Password (prefer Key Vault / .env)
  imap_server: "outlook.office365.com"    # change for on-prem Exchange
  imap_port: 993

# Data
data:
  test_data_csv: "data/test_data.qa.csv"
