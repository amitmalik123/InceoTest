[mypy]
# Mypy type checker configuration
# Use a modern Python version to allow 'X | Y' union syntax used in the codebase
python_version = 3.14
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True

# Exclude directories (regex pattern)
exclude = (?x)(^venv/|^\\.venv/|^tests/|^allure-results/|^reports/|^__pycache__/)
